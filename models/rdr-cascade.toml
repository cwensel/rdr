# rdr-cascade.toml — a stage's return packet, as one cascade move.
#
# `skills/rdr-draft-to-lock` walks 5-8 §return-packets per run and decided
# each by a prose ladder over verdict x blocking x retry x next_action.
# This table is that ladder; `intrastate lint --model` proves all 96 cells.
#
# DECIDE-ONLY (intrastate RDR 0010): zero owned tags, no `[initial]`, no
# accessors. The caller acts on `emit`; nothing here writes.
#
# THE `packet` GROUP'S TAGS ARE CALLER-SUPPLIED, NOT FACTS. No `recs status
# --tags` vector renders them: the orchestrator binds each from the packet
# it holds (`verdict:`, `blocking:`, `next_action:`) and its own Ledger
# (`retry`), and passes them as `--tag k=v` — the `observed` provenance's
# declared shape. `action` classifies `next_action` lexically; a stage
# stop and a named return stage share the packet's one imperative slot, so
# the route-back is a member of that dimension, never a second one. Every
# dimension is required + single_valued; absence is a declared member
# (`retry=0`, `action=none`). `tools/rdr/routing_test.go` names this
# model's caller tags in an allowlist.
#
# The sibling `posture` group below reads two real facts (`profile`,
# `status`, rendered by `recs status --tags`) plus one more caller-supplied
# tag (`ask_each`, the `--ask-each` flag) — see its own banner.
#
# THE ANSWER IS `emit`: `next` is the disposition; `stage` says what
# `Next:` names. Values are uninterpreted — the stage's own `stopped:*`
# line and the named `/rdr-<stage>` command are relayed by the caller
# verbatim (as NNNN is appended by the caller in rdr-status.toml). The
# blocker-class -> return-stage mapping is not this table's.

outcomes = ["packet", "posture"]

[model]
id          = "rdr-cascade"
version     = 1
class       = "decision-table"
description = "Draft-to-lock cascade: one stage's return packet to the orchestrator's next move."

[emit.next]
kind = "enum"
[emit.next.domain]
run  = ["advance", "rerun"]
park = ["park"]
stop = ["stopped:stage-stop"]

[emit.stage]
kind   = "enum"
domain = ["router", "same", "named"]

[emit.why]
kind = "scalar"

[emit.confirm_upfront]
kind = "bool"

[emit.confirm_each]
kind = "bool"

[emit.confirm_finalize]
kind = "bool"

[tags.recognized]
provenance    = "recognized"
kind          = "enum"
domain        = ["packet", "posture"]
single_valued = true
required      = true

# The packet's own `verdict:` field.
[tags.verdict]
provenance    = "observed"
kind          = "enum"
domain        = ["PASS", "BLOCK", "INCOMPLETE", "NEEDS_DECISION"]
single_valued = true
required      = true

# The packet's own `blocking:` field.
[tags.blocking]
provenance    = "observed"
kind          = "enum"
domain        = ["yes", "no"]
single_valued = true
required      = true

# Prior INCOMPLETE returns of this stage this run, from the orchestrator's
# Ledger; 2 saturates (a third silent re-run never happens).
[tags.retry]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1", "2"]
single_valued = true
required      = true

# The packet's `next_action` classified: absent -> `none`; begins
# `stopped:` -> `stop`; names an `/rdr-` command -> `stage`; else `imperative`.
[tags.action]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "imperative", "stop", "stage"]
single_valued = true
required      = true

# Rendered by `recs status --tags --filter profile,status`; `none` is the
# fact's declared absent sentinel.
[tags.profile]
provenance    = "observed"
kind          = "enum"
domain        = ["small", "mid", "large", "foundational", "none"]
single_valued = true
required      = true

# Rendered by `recs status --tags --filter profile,status`.
[tags.status]
provenance    = "observed"
kind          = "enum"
domain        = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# CALLER-SUPPLIED — the `--ask-each` flag, passed `true|false` on every
# call (never omitted).
[tags.ask_each]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# ===========================================================================
# packet — one return packet to one cascade move
# ===========================================================================

[[rule]]
id = "stage-stop"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.action]
eq = "stop"
[rule.emit]
next = "stopped:stage-stop"
stage = "same"
why  = "The stage stopped on its own code; relay the line verbatim — nothing advances past a stop."

[[rule]]
id = "route-back"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.action]
eq = "stage"
[rule.guard.all.verdict]
in = ["BLOCK", "NEEDS_DECISION", "INCOMPLETE"]
[rule.emit]
next = "park"
stage = "named"
why  = "The packet names another stage: a route-back. Park; this skill never drives backward."

[[rule]]
id = "pass-advance"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.verdict]
eq = "PASS"
[rule.guard.all.blocking]
eq = "no"
[rule.guard.all.action]
in = ["none", "imperative", "stage"]
[rule.emit]
next = "advance"
stage = "router"
why  = "A clean pass; the router names the next stage."

[[rule]]
id = "pass-open-item"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.verdict]
eq = "PASS"
[rule.guard.all.blocking]
eq = "yes"
[rule.guard.all.action]
in = ["none", "imperative", "stage"]
[rule.emit]
next = "park"
stage = "same"
why  = "A passed gate carrying an open item parks; never advance on the verdict alone."

[[rule]]
id = "incomplete-rerun"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.verdict]
eq = "INCOMPLETE"
[rule.guard.all.blocking]
eq = "no"
[rule.guard.all.retry]
eq = "0"
[rule.guard.all.action]
in = ["none", "imperative"]
[rule.emit]
next = "rerun"
stage = "same"
why  = "First INCOMPLETE: re-run the same stage once with next_action appended."

[[rule]]
id = "incomplete-capped"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.verdict]
eq = "INCOMPLETE"
[rule.guard.all.blocking]
eq = "no"
[rule.guard.all.retry]
in = ["1", "2"]
[rule.guard.all.action]
in = ["none", "imperative"]
[rule.emit]
next = "park"
stage = "same"
why  = "Twice incomplete: park as a fork; never a third silent re-run."

[[rule]]
id = "incomplete-open"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.verdict]
eq = "INCOMPLETE"
[rule.guard.all.blocking]
eq = "yes"
[rule.guard.all.action]
in = ["none", "imperative"]
[rule.emit]
next = "park"
stage = "same"
why  = "An open blocking item is not cleared by a re-run; park."

[[rule]]
id = "fork"
[rule.match.recognized]
eq = "packet"
[rule.guard.all.verdict]
in = ["BLOCK", "NEEDS_DECISION"]
[rule.guard.all.action]
in = ["none", "imperative"]
[rule.emit]
next = "park"
stage = "same"
why  = "A block or a decision is the human's; park and stop advancing this RDR."

# ===========================================================================
# posture — where the cascade stops to confirm
# ===========================================================================
#
# profile x status x ask_each = 90 cells. `profile` and `status` are
# facts; `ask_each` is the caller's flag, never absent. An unearned
# `small` reads as `mid` BY CELL — a Draft Profile is provisional, and
# Stage 4 is what earns it — and nothing here reads lower than its field:
# `--ask-each` only ever raises the answer, never lowers it. Once the
# lens restatement is out (the `lens` group of `rdr-status.toml` already
# owns "small = no lens"), `small` and `mid` emit identical confirms
# here; the remap differs only in `why`.

[[rule]]
id = "posture-ask-each"
[rule.match.recognized]
eq = "posture"
[rule.guard.all.ask_each]
eq = "true"
[rule.emit]
confirm_upfront  = "true"
confirm_each     = "true"
confirm_finalize = "true"
why = "--ask-each: confirm before every stage; nothing overrides it downward."

[[rule]]
id = "posture-draft-small-reads-mid"
[rule.match.recognized]
eq = "posture"
[rule.guard.all.ask_each]
eq = "false"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.profile]
eq = "small"
[rule.emit]
confirm_upfront  = "false"
confirm_each     = "false"
confirm_finalize = "false"
why = "Profile small is provisional while Draft — read as mid: hands-off through the row, forks batched at the stop."

[[rule]]
id = "posture-draft-mid"
[rule.match.recognized]
eq = "posture"
[rule.guard.all.ask_each]
eq = "false"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.profile]
eq = "mid"
[rule.emit]
confirm_upfront  = "false"
confirm_each     = "false"
confirm_finalize = "false"
why = "Hands-off through the lens row; forks batched at the end."

[[rule]]
id = "posture-draft-large"
[rule.match.recognized]
eq = "posture"
[rule.guard.all.ask_each]
eq = "false"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.profile]
eq = "large"
[rule.emit]
confirm_upfront  = "false"
confirm_each     = "false"
confirm_finalize = "true"
why = "Hands-off, but confirm once before finalize — the lock is the irreversible step."

[[rule]]
id = "posture-draft-foundational"
[rule.match.recognized]
eq = "posture"
[rule.guard.all.ask_each]
eq = "false"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.profile]
eq = "foundational"
[rule.emit]
confirm_upfront  = "true"
confirm_each     = "false"
confirm_finalize = "true"
why = "Confirm the lens plan up front and before finalize; cross-RDR blast radius earns two interruptions."

[[rule]]
id = "posture-draft-no-profile"
[rule.match.recognized]
eq = "posture"
[rule.guard.all.ask_each]
eq = "false"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.profile]
eq = "none"
[rule.emit]
confirm_upfront  = "true"
confirm_each     = "false"
confirm_finalize = "true"
why = "No Profile yet: posture never drops below what the field would earn, so the foundational row holds until Stage 4 writes it."

[[rule]]
id = "posture-not-draft"
[rule.match.recognized]
eq = "posture"
[rule.guard.all.ask_each]
eq = "false"
[rule.guard.unless.status]
eq = "Draft"
[rule.emit]
confirm_upfront  = "true"
confirm_each     = "true"
confirm_finalize = "true"
why = "Not a Draft: the cascade does not drive this record; if asked anyway, confirm everything — a skipped precondition must never read as hands-off."
