# ===========================================================================
# return — the stage a blocker sends the record back to
# ===========================================================================
#
# Dimensions: blocker_class = 10 cells, eight rows. The answer is the
# packet's `next_action` (rdr-cascade.toml reads it as `action=stage`),
# AND a durable marker on the record. `consult` names a §strong-consult
# owed before the human on the two rows that reopen an already-decided
# approach.
#
# The ladder was stated at Stage 6 (NOT RECONCILED → 2/3/4), Stage 7 (NOT
# READY: spike or disturbed assumption → 6, assumption gap → 4,
# contradiction → 3, scope/MVV gap → 2, missing determinacy → 5) and
# Stage 8 (a spec defect → 2/3/4). One vocabulary, one table; `demote`
# above writes the same class into a Final's qualifier.
#
# THIS GROUP USED TO BE DECIDE-ONLY, AND THAT WAS THE DEFECT. The packet
# named the stage and nothing reached the record, so a Draft sent back
# from Stage 4 looked — to the very next skill — exactly like a Draft
# that had simply reached Stage 4 on its own. The evidence on disk
# (Resolve's verdicts, the contracts) says FORWARD; only the transcript
# said BACKWARD, and the transcript is not what the next stage reads. A
# live pair deadlocked on it: Resolve routed 0150 to Stage 2, Stage 2 read
# the record, found itself already run, and refused — each side correct,
# neither able to move. So the route-back now writes the same kind of
# durable qualifier `demote` writes, in the Draft's own grammar:
#
#   Draft [routed back from resolve <date>; re-verify <IDs> @propose — <reason>]
#
# It rides on the live Status value, so Stage 3's history-scrub cannot
# strip it (that scrub is why §punt-ledger exists at all), and the
# receiving stage clears it as its FIRST act — the marker names work
# owed, and a stage that has done the work owns removing it. `@<stage>`
# is deliberately the SAME slot RevisedFromGrammar writes, so the
# navigator's `reentry` group routes both forms with no new rows.
#
# The qualifier carries the ORIGIN stage as well as the target, because
# "back to Propose from Resolve" and "back to Propose from Stage 8" owe
# different rework, and the receiving stage reads the origin to size it.
#
# THE EDIT ANCHORS ON `Draft`, AND THE GROUP DOES NOT GUARD ON STATUS.
# Stage 8 routes a FINAL back, and that is `demote`'s — it owns the
# Final→Draft flip and writes the same `@<stage>` slot in its own
# qualifier. Routing a Final here would substitute nothing and report
# success, so the CALLER picks the outcome by the status it already holds
# (§rdr-write). A status guard was tried and reverted: every guarded
# dimension makes the whole group demand the record accessor, and this is
# the one stop group reachable without an artifact bind — doctor 12c
# probes it to prove the binary emits dispositions at all. Keeping it
# artifact-free is worth more than restating a boundary the caller's own
# status already settles.

[[rule]]
id = "return-propose"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "approach"
[rule.emit]
op          = "return"
target      = "record"
stage       = "propose"
next_action = "/rdr-propose"
consult     = "strong"
# The `;` must immediately follow the date, exactly as in `demote`:
# RoutedBackGrammar keys on it, and anything looser degrades the
# qualifier to a free-text note that blinds every re-entry rule.
edit        = "s/^- \\*\\*Status\\*\\*: Draft.*$/- **Status**: Draft [routed back from <origin stage> <YYYY-MM-DD>; re-verify <assumption IDs> @propose — <one-line reason>]/"
why         = "The approach, the scope or the MVV is wrong — Stage 2 owns it, and reopening it consults before the human."
surface     = "the refuted claims, so Stage 2 reworks those moves rather than re-deriving the whole proposal"

[[rule]]
id = "return-refine-contradiction"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "contradiction"
[rule.emit]
op          = "return"
target      = "record"
stage       = "refine"
next_action = "/rdr-refine"
consult     = "strong"
edit        = "s/^- \\*\\*Status\\*\\*: Draft.*$/- **Status**: Draft [routed back from <origin stage> <YYYY-MM-DD>; re-verify <assumption IDs> @refine — <one-line reason>]/"
why         = "A contradiction — Stage 3 owns it, and a contradiction consults before the human."
surface     = "the two lines in tension, quoted, so Stage 3 resolves that contradiction and not a paraphrase of it"

[[rule]]
id = "return-refine-contract"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
in = ["contract", "proportionality"]
[rule.emit]
op          = "return"
target      = "record"
stage       = "refine"
next_action = "/rdr-refine"
edit        = "s/^- \\*\\*Status\\*\\*: Draft.*$/- **Status**: Draft [routed back from <origin stage> <YYYY-MM-DD>; re-verify <assumption IDs> @refine — <one-line reason>]/"
why         = "A contract edit or a proportionality finding (a self-flagged split unexecuted, a cost unweighed) — Stage 3 owns it."
surface     = "the contract clause or the unweighed cost, so Stage 3 edits the named text"

[[rule]]
id = "return-resolve"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "assumption-gap"
[rule.emit]
op          = "return"
target      = "record"
stage       = "resolve"
next_action = "/rdr-resolve"
edit        = "s/^- \\*\\*Status\\*\\*: Draft.*$/- **Status**: Draft [routed back from <origin stage> <YYYY-MM-DD>; re-verify <assumption IDs> @resolve — <one-line reason>]/"
why         = "An assumption is unverified or refuted — Stage 4 owns it."
surface     = "the assumption IDs, which are what Stage 4 self-scopes to"

[[rule]]
id = "return-prelock"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "determinacy"
[rule.emit]
op          = "return"
target      = "record"
stage       = "prelock"
next_action = "/rdr-prelock repeatability 1"
edit        = "s/^- \\*\\*Status\\*\\*: Draft.*$/- **Status**: Draft [routed back from <origin stage> <YYYY-MM-DD>; re-verify none @prelock — <one-line reason>]/"
why         = "The `Determinacy:` line reads fired and no run-1/diff exists — repeatability-lite owns it."
surface     = "the `Determinacy:` line, so the lens runs against what fired"

[[rule]]
id = "return-reconcile"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
in = ["spike", "assumption-disturbed"]
[rule.emit]
op          = "return"
target      = "record"
stage       = "reconcile"
next_action = "/rdr-reconcile"
edit        = "s/^- \\*\\*Status\\*\\*: Draft.*$/- **Status**: Draft [routed back from <origin stage> <YYYY-MM-DD>; re-verify <assumption IDs> @reconcile — <one-line reason>]/"
why         = "An open spike or a round-disturbed assumption — Stage 6 owns closing it."
surface     = "the open spike or the disturbed assumption, named, so Stage 6 closes that one"

# The one class that writes NOTHING, and deliberately. A wording fix is
# applied in the lock pass itself — the record never leaves the stage it
# is at, so there is no backward edge to mark and no receiving stage to
# tell. Marking it would post work owed to a stage that is already
# running, and the qualifier would have to be cleared by the same pass
# that wrote it. This row stays decide-only; it is the exception the
# group's header describes, not an omission.
[[rule]]
id = "return-finalize"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "wording"
[rule.emit]
op          = "return"
target      = "packet"
stage       = "finalize"
next_action = "/rdr-finalize"
why         = "Wording or a cross-reference, no assumption disturbed — the lock pass fixes it in place, so no route-back marker is owed."

[[rule]]
id = "return-unclassed"
advance = false
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "none"
[rule.emit]
op   = "stopped:no-blocker-class"
why  = "The blocker carries no class — no stage can be named for it."
surface = "the blocker, so the gate classes it (approach | contradiction | contract | proportionality | assumption-gap | assumption-disturbed | spike | determinacy | wording)"

# ===========================================================================
# ground — the search ladder an open author question walks first
# ===========================================================================
#
# 57 sessions since 2026-05 stopped the flow 75 times to ask the author an
# open design question; 74 of the 75 were already answered by an existing
# source (code or a spike 46, a sibling RDR in the cluster 20, the arc
# corpora 11, an RFD 6, a kata issue 3) — the author's own redirect
# ("check prior art", "read the rfd") always landed one turn later. This
# group is that ladder, proved exhaustive: code, then the cluster (if
# `index --cluster-of` reports a peer), then the corpora, then the
# RFDs/JDRs, then the one question in 75 that is genuinely the author's
# to answer.
#
# Dimensions: searched × found × peers = 5 × 2 × 2 = 20 cells, seven
# rows. DECIDE-ONLY, and now the only group that is: nothing here writes
# the record — the answer is a search to run, not a state to record. The
# caller re-calls this outcome at each rung — `--tag searched=<rung>
# --tag found=<true|false>` — runs what `surface` names, and stops when
# `ground` answers `apply` (the question is settled: recommend from the
# source, with the cite, and ask nothing) or `ask` (every rung is
# searched and none settled it — the §stop-packet is owed, carrying
# `searched=`).

[[rule]]
id = "ground-found"
advance = false
[rule.match.recognized]
eq = "ground"
[rule.guard.all.found]
eq = "true"
[rule.emit]
op      = "ground"
target  = "packet"
ground  = "apply"
why     = "The question is settled in the source found — recommend from it, with the cite; no author question."
surface = "the cite beside the recommendation: file:line, NNNN §element, corpus hit, or RFD §"

[[rule]]
id = "ground-code"
advance = false
[rule.match.recognized]
eq = "ground"
[rule.guard.all.found]
eq = "false"
[rule.guard.all.searched]
eq = "none"
[rule.emit]
op      = "ground"
target  = "packet"
ground  = "code"
why     = "Nothing searched yet — code and a cheap spike settle most author questions (46 of 75)."
surface = "the source repo: `rg`/semble the symbol or behaviour; a spike where a run answers in minutes; one sub-agent (rdr-common §delegation) returning a §return-packet"

[[rule]]
id = "ground-cluster"
advance = false
[rule.match.recognized]
eq = "ground"
[rule.guard.all.found]
eq = "false"
[rule.guard.all.searched]
eq = "code"
[rule.guard.all.peers]
eq = "1+"
[rule.emit]
op      = "ground"
target  = "packet"
ground  = "cluster"
why     = "Code did not settle it and the record has peers — one often already decided it (20 of 75)."
surface = "`rdr index --cluster-of NNNN`, then per peer `rdr inspect --select MMMM:§decision-rationale MMMM` (and its open decisions: `rdr index --open-joint --record MMMM`)"

[[rule]]
id = "ground-corpus-standalone"
advance = false
[rule.match.recognized]
eq = "ground"
[rule.guard.all.found]
eq = "false"
[rule.guard.all.searched]
eq = "code"
[rule.guard.all.peers]
eq = "0"
[rule.emit]
op      = "ground"
target  = "packet"
ground  = "corpus"
why     = "Code did not settle it and the record has no peers — the corpora are next."
surface = "`arc search` the question's nouns over the corpora the {RDR_RESOURCES} file names; one sub-agent"

[[rule]]
id = "ground-corpus"
advance = false
[rule.match.recognized]
eq = "ground"
[rule.guard.all.found]
eq = "false"
[rule.guard.all.searched]
eq = "cluster"
[rule.emit]
op      = "ground"
target  = "packet"
ground  = "corpus"
why     = "The peers did not settle it — the corpora are next."
surface = "`arc search` the question's nouns over the corpora the {RDR_RESOURCES} file names; one sub-agent"

[[rule]]
id = "ground-rfd"
advance = false
[rule.match.recognized]
eq = "ground"
[rule.guard.all.found]
eq = "false"
[rule.guard.all.searched]
eq = "corpus"
[rule.emit]
op      = "ground"
target  = "packet"
ground  = "rfd"
why     = "The corpora did not settle it — the RFDs and JDRs the resources index names are the last written source."
surface = "the RFD/JDR sections the resources index names for this surface"

[[rule]]
id = "ground-ask"
advance = false
[rule.match.recognized]
eq = "ground"
[rule.guard.all.found]
eq = "false"
[rule.guard.all.searched]
eq = "rfd"
[rule.emit]
op      = "ground"
target  = "packet"
ground  = "ask"
why     = "Every written source is searched and none settles it — this is the one question in 75 the author must answer."
surface = "the §stop-packet, with `searched=code[,cluster],corpus,rfd; found: none` in its body"
