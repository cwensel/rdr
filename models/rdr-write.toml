# ===========================================================================
# lock — Stage 7's READY action
# ===========================================================================
#
# The largest hand-edit in the flow, and the one with a genuine content
# move in it. Four gate sub-sections leave the record for
# {ARTIFACT_DIR}/gate.md and are replaced by one pointer line;
# `### Cross-Cutting Concerns` STAYS, because it is the one gate item
# written to be cited BY OTHER RDRs (`cli/NNNN:G-cross-cutting`). The
# other four judge this record at this lock and no peer cites them.
#
# WHICH ITEMS ARE RETAINED IS NOT SPELLED HERE. TEMPLATE.md carries a
# `[Retained at lock — …]` marker beside the sub-section it describes,
# and the projector parses it (`GateItemRetained`). The edit below names
# the retained heading once, as the boundary the section move stops at;
# a template that retains a different item changes there, not here.
#
# The VERDICT is not this table's. Stage 7 reads five written responses
# and decides; `--outcome lock` is the caller asserting READY. This
# answers only "given READY, what is the edit".

# A Draft with its gate written, and written SINCE any re-entry → the
# full lock. `gate_stale` is the second half of the guard: a re-entered
# record's old gate.md satisfies `gate_written` and must not lock. The
# joint-decision form is carved out below — its edit must keep the
# qualifier this row's edit flattens.
[[rule]]
id = "lock-draft"
[rule.match.recognized]
eq = "lock"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.gate_written]
eq = "true"
[rule.guard.all.gate_stale]
eq = "false"
[rule.guard.unless.status_form]
eq = "joint-decision"
[rule.emit]
op     = "lock"
target = "record"
# Three edits, in this order. The status flip is last so a failure in the
# section move leaves the record legibly mid-lock rather than Final.
edit   = "s/^- \\*\\*Status\\*\\*: Draft.*$/- **Status**: Final/"
sections = "replace the `### Contradiction Check`, `### Assumption Verification`, `### Scope Verification` and `### Proportionality` bodies with the single line `Responses: <NNNN-slug>/artifacts/gate.md (Gate PASS YYYY-MM-DD)`; `### Cross-Cutting Concerns` stays in the record, below the pointer"
why    = "Gate written and the record is a Draft — move the four judged responses out, keep the cited one, flip to Final."
surface = "that the README row is flipped in the same pass (`--outcome readme`), and that the commit is a standalone `docs(rdr): finalize cli/NNNN <slug> (Gate PASS)`, never a fixup!"

# A Draft still owing a joint decision locks WITH its qualifier. The bare
# row's edit would flatten `Draft [joint decision → …]` to a bare `Final`,
# and the navigator's `locate-final-joint-decision` row routes the home
# check on that qualifier — a lock that drops it unroutes the check. The
# edit captures the qualifier and re-emits it (a sed backreference), so
# "apply `edit` as handed" still holds: nothing asks the caller to
# recompose what the expression can carry.
[[rule]]
id = "lock-draft-joint-decision"
[rule.match.recognized]
eq = "lock"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.status_form]
eq = "joint-decision"
[rule.guard.all.gate_written]
eq = "true"
[rule.guard.all.gate_stale]
eq = "false"
[rule.emit]
op     = "lock"
target = "record"
# Same three edits as `lock-draft`, in the same order; only the status
# flip differs — the captured `[joint decision → …]` survives onto Final.
edit   = "s/^- \\*\\*Status\\*\\*: Draft *\\(\\[joint decision.*\\]\\).*$/- **Status**: Final \\1/"
sections = "replace the `### Contradiction Check`, `### Assumption Verification`, `### Scope Verification` and `### Proportionality` bodies with the single line `Responses: <NNNN-slug>/artifacts/gate.md (Gate PASS YYYY-MM-DD)`; `### Cross-Cutting Concerns` stays in the record, below the pointer"
why    = "Gate written and the Draft still owes a joint decision — lock as usual, but the qualifier survives the flip: `Final [joint decision → …]` is what routes the home check."
surface = "the preserved qualifier verbatim, so the open question is visible at the lock; the README row flips in the same pass (`--outcome readme`), commit `docs(rdr): finalize cli/NNNN <slug> (Gate PASS)`"

# A Draft whose gate.md predates its re-entry → refuse. The file is
# there, so `gate_written` reads true, but it was written for the Final
# that 7.1 demoted and has never seen the rework; locking over it is the
# pre-gate lock only skill sequencing has stood between. The gate is owed
# again, and `/rdr-finalize` re-gates before it locks.
[[rule]]
id = "lock-gate-stale"
[rule.match.recognized]
eq = "lock"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.gate_written]
eq = "true"
[rule.guard.all.gate_stale]
eq = "true"
[rule.emit]
op   = "stopped:gate-stale"
why  = "{ARTIFACT_DIR}/gate.md predates this record's re-entry — it judged the Final that was demoted, not the rework, so the gate is owed again before the lock."
surface = "the gate.md date beside the demote date from the Status qualifier; re-run the gate (`/rdr-finalize` re-gates, overwriting gate.md) and lock only from that pass"

# A Draft with NO gate.md → refuse. The responses have to exist before
# the record can point at them; a pointer to an absent file is worse than
# an unlocked record, because it reads as a discharged gate.
[[rule]]
id = "lock-no-gate"
[rule.match.recognized]
eq = "lock"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.gate_written]
eq = "false"
[rule.emit]
op   = "stopped:no-gate-written"
why  = "No {ARTIFACT_DIR}/gate.md — the pointer line would name a file that does not exist, which reads as a discharged gate."
surface = "Stage 7 writes the five responses first; the lock is the second half of that pass"

# Already Final → idempotent no-op, not an error. Re-running a lock is
# how a re-lock begins, and the flow re-locks after a 7.1 route-back.
[[rule]]
id = "lock-already-final"
[rule.match.recognized]
eq = "lock"
[rule.guard.all.status]
eq = "Final"
[rule.emit]
op   = "none"
why  = "Already Final — the lock is idempotent, so this is a no-op rather than a second flip."

# A terminal or parked record → refuse. These are past the gate entirely
# and their content is never amended.
[[rule]]
id = "lock-terminal"
[rule.match.recognized]
eq = "lock"
[rule.guard.all.status]
in = ["Implemented", "Reverted", "Abandoned", "Superseded", "Demoted", "Rejected", "Deferred"]
[rule.emit]
op   = "stopped:not-lockable"
why  = "Terminal or parked — the record is past the gate and its content is not amended."
surface = "the status, verbatim"

# ===========================================================================
# demote — 7.1's route-back
# ===========================================================================
#
# A cluster reconcile found a SPEC-DEFECT and named this record — the
# less foundational of the pair — as the one to change. The route-back is
# ONE edit and touches no design body: the status flips with its scope
# qualifier, the index row follows, and a re-entry note lands after
# `## References`.
#
# THE QUALIFIER RIDES ON THE LIVE STATUS VALUE, which is what makes it
# durable: Stage 3's history-scrub never touches it, and the Stage 7
# re-lock flip overwrites it. The named assumption IDs are the only ones
# whose lock-time `Verified` stamp the defect disturbs.
#
# The note is appended AFTER the flip, when the record is already a Draft
# — Drafts carry working context, so it is not an amend. Stage 7 confirms
# it is gone before re-lock, and `models/rdr-template.toml`'s
# `[prose.change-history]` sweep is what proves it: `Refinement Context`
# is a declared word there, so a note that survives a re-lock is a lint
# finding rather than something a reader has to notice.

# ONE ROW PER BLOCKER CLASS, because the `@<stage>` slot is the row's to
# write: the qualifier grammar (TEMPLATE.md Status; model.RevisedFromGrammar)
# accepts `@propose`, `@refine`, `@resolve` and `@finalize`, and the class
# picks which. 7.1's re-entry scope is the same call — RE-LOCK-ONLY is
# `wording`, STAGE-SCOPED is `contract` (3) or `assumption-gap` (4),
# FULL-FLOW is `approach` (2). A class whose stage the grammar has no
# token for (Stage 5, Stage 6) stops rather than guessing `@resolve`.
[[rule]]
id = "demote-final-approach"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.blocker_class]
eq = "approach"
[rule.emit]
op     = "demote"
target = "record"
stage  = "propose"
# The `;` must immediately follow the date (at most one short stage token
# between): RevisedFromGrammar keys on it, and anything looser degrades
# the qualifier to a free-text note that blinds every re-entry rule.
edit   = "s/^- \\*\\*Status\\*\\*: Final.*$/- **Status**: Draft [revised from Final <YYYY-MM-DD>; re-verify <assumption IDs> @propose — <one-line reason>]/"
sections = "append `## Refinement Context (cluster re-entry — delete on re-lock)` at the END of the document, after `## References`, carrying cluster + date, the peer pair, the defect with the offending lines quoted, TARGET RE-ENTRY STAGE (2, FULL-FLOW), resolution direction, and a pointer to the report"
why    = "The chosen approach is voided — flip with the scope qualifier naming Stage 2, then land the note."
surface = "that the README row follows in the same pass (`--outcome readme`), and that leaving it Final would contradict the report"

[[rule]]
id = "demote-final-refine"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.blocker_class]
in = ["contradiction", "contract"]
[rule.emit]
op     = "demote"
target = "record"
stage  = "refine"
edit   = "s/^- \\*\\*Status\\*\\*: Final.*$/- **Status**: Draft [revised from Final <YYYY-MM-DD>; re-verify <assumption IDs> @refine — <one-line reason>]/"
sections = "append `## Refinement Context (cluster re-entry — delete on re-lock)` at the END of the document, after `## References`, carrying cluster + date, the peer pair, the defect with the offending lines quoted, TARGET RE-ENTRY STAGE (3, STAGE-SCOPED), resolution direction, and a pointer to the report"
why    = "A contradiction or a contract edit is Stage 3's — flip with the scope qualifier naming it, then land the note."
surface = "that the README row follows in the same pass (`--outcome readme`), and that leaving it Final would contradict the report"

[[rule]]
id = "demote-final-resolve"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.blocker_class]
eq = "assumption-gap"
[rule.emit]
op     = "demote"
target = "record"
stage  = "resolve"
edit   = "s/^- \\*\\*Status\\*\\*: Final.*$/- **Status**: Draft [revised from Final <YYYY-MM-DD>; re-verify <assumption IDs> @resolve — <one-line reason>]/"
sections = "append `## Refinement Context (cluster re-entry — delete on re-lock)` at the END of the document, after `## References`, carrying cluster + date, the peer pair, the defect with the offending lines quoted, TARGET RE-ENTRY STAGE (4, STAGE-SCOPED), resolution direction, and a pointer to the report"
why    = "An assumption must be re-verified — flip with the scope qualifier naming Stage 4, then land the note."
surface = "that the README row follows in the same pass (`--outcome readme`), and that leaving it Final would contradict the report"

[[rule]]
id = "demote-final-relock"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.blocker_class]
eq = "wording"
[rule.emit]
op     = "demote"
target = "record"
stage  = "finalize"
edit   = "s/^- \\*\\*Status\\*\\*: Final.*$/- **Status**: Draft [revised from Final <YYYY-MM-DD>; re-verify none @finalize — <one-line reason>]/"
sections = "append `## Refinement Context (cluster re-entry — delete on re-lock)` at the END of the document, after `## References`, carrying cluster + date, the peer pair, the defect with the offending lines quoted, TARGET RE-ENTRY STAGE (fix + /rdr-finalize, RE-LOCK-ONLY), resolution direction, and a pointer to the report"
why    = "A wording or cross-reference defect disturbs no assumption — flip RE-LOCK-ONLY, then land the note."
surface = "that the README row follows in the same pass (`--outcome readme`), and that leaving it Final would contradict the report"

# A class whose stage the qualifier grammar cannot name. A Final has
# closed Stage 5 and 6; a spike or a disturbed assumption reopened on it
# is an assumption gap for Stage 4, but that is the gate's reclassing to
# make, not this row's.
[[rule]]
id = "demote-final-not-a-reentry"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.blocker_class]
in = ["spike", "assumption-disturbed", "determinacy"]
[rule.emit]
op   = "stopped:class-not-a-reentry"
why  = "The qualifier grammar names no @stage for Stage 5 or 6 — a Final has closed them, so reclass the blocker (an assumption to re-verify is `assumption-gap`)."
surface = "the class and the finding, so the gate reclasses it or files the missing target"

[[rule]]
id = "demote-final-unclassed"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.blocker_class]
eq = "none"
[rule.emit]
op   = "stopped:no-blocker-class"
why  = "No blocker class was passed — the @<stage> slot cannot be written, and a qualifier without it routes every re-entry to /rdr-resolve."
surface = "the SPEC-DEFECT finding, so the caller classes it and re-runs"

# Already a Draft → no-op. The record is already back in flight; a second
# demote would stack a qualifier on a qualifier.
[[rule]]
id = "demote-already-draft"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
eq = "Draft"
[rule.emit]
op   = "none"
why  = "Already a Draft — the route-back is idempotent, and a second qualifier would stack on the first."

# Anything else → refuse. 7.1 demotes a Final; a terminal or parked
# record is not in the cluster's live set.
[[rule]]
id = "demote-not-final"
[rule.match.recognized]
eq = "demote"
[rule.guard.all.status]
in = ["Implemented", "Reverted", "Abandoned", "Superseded", "Demoted", "Rejected", "Deferred"]
[rule.emit]
op   = "stopped:not-demotable"
why  = "Terminal or parked — 7.1 routes back a Final, and this record is not one."
surface = "the status, verbatim"

# ===========================================================================
# profile — Resolve's sizing of the Profile field
# ===========================================================================
#
# Dimensions: contracts_durable × contracts_prose × user_facing × locks ×
# floor = 3 × 2 × 3 × 5 × 2 = 180 cells, eleven rows.
#
# Profile is sized by blast radius — the matrix at stages/README.md. It
# was a four-line ladder Resolve re-derived from a hand count, with the
# Transient exclusion, the split signal and the accretion floor chained
# after it in prose. Here the count arrives subtracted and bucketed, the
# floor arrives as rdr-status.toml's answer, and the two judgements arrive
# as tags. THE FLOOR OUTRANKS THE COUNT: it claims every cell it holds
# first. Then: two or more durable contracts is the split signal, not a
# size; none is either unlabelled (stop by name — prose contracts cannot
# be counted) or unauthored; exactly one is sized by what it locks and
# whether it is user-facing, and a judgement not written stops rather
# than defaulting. Seed's estimate is not an input: the field is
# OVERWRITTEN from the verified count, so the edit replaces the line.
#
# THE ANSWER IS `profile`, applied as the field's value, and `edit` is
# the field line — with the two dispositions written INTO the clause, so
# a later fact can read them back. The field may wrap; `then` names the
# continuation to drop, since the template's matrix prose belongs in the
# template comment and not the instance.

# --- the floor holds: foundational, whatever the count --------------------
[[rule]]
id = "profile-floored"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "foundational"
[rule.emit]
op      = "profile"
target  = "record"
profile = "foundational"
edit    = "s/^- \\*\\*Profile\\*\\*:.*$/- **Profile**: foundational — accretion floor; <one clause naming the contract(s)>/"
then    = "delete the field's wrapped continuation lines (indented, up to the next `- **` bullet)"
why     = "The accretion floor holds — Profile is foundational whatever the contract axis counts; the count may raise a profile, never lower one the floor holds."
surface = "the floor's `why` from `--outcome floor`, and the durable count beside it"

# --- no durable contract: unlabelled, or unauthored --------------------------
[[rule]]
id = "profile-unlabelled"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "0"
[rule.guard.all.contracts_prose]
eq = "true"
[rule.emit]
op   = "stopped:contracts-unlabelled"
why  = "Normative Contracts carries prose and no labelled fence — the contract count is unreadable, and a size over an unread count is a guess."
surface = "the section: label each independent contract `**Cn**` over its ```normative fence (TEMPLATE.md Normative Contracts), then re-run this call"

[[rule]]
id = "profile-no-contracts"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "0"
[rule.guard.all.contracts_prose]
eq = "false"
[rule.emit]
op   = "stopped:no-contracts"
why  = "Normative Contracts is unauthored — there is nothing to size."
surface = "that the section is the template's own text; Propose and Refine author it before Resolve sizes it"

# --- two or more: the split signal ------------------------------------------
[[rule]]
id = "profile-split"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "2+"
[rule.emit]
op   = "stopped:split-signal"
why  = "Two or more durable contracts — the record spans more than one seam; flag it for splitting rather than picking a profile."
surface = "the durable fences by label: one seam → clauses of one `**C1**`; separate seams → split along them (Stage 2/3)"

# --- exactly one: sized by what it locks, then by its surface ---------------
[[rule]]
id = "profile-locks-unjudged"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "1"
[rule.guard.all.locks]
eq = "unknown"
[rule.emit]
op   = "stopped:profile-judgement-unwritten"
why  = "What the contract locks is not judged — nothing here defaults it."
surface = "the `locks` disposition to write: none | contract | format (enum/hash/format/grammar/destructive op) | cross-rdr (producer, spans modules)"

[[rule]]
id = "profile-cross-rdr"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "1"
[rule.guard.all.locks]
eq = "cross-rdr"
[rule.emit]
op      = "profile"
target  = "record"
profile = "foundational"
edit    = "s/^- \\*\\*Profile\\*\\*:.*$/- **Profile**: foundational — <one clause naming the contract>; user-facing <yes|no>; locks cross-rdr/"
then    = "delete the field's wrapped continuation lines (indented, up to the next `- **` bullet)"
why     = "One durable contract that other RDRs consume or that spans modules — foundational."

[[rule]]
id = "profile-format"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "1"
[rule.guard.all.locks]
eq = "format"
[rule.emit]
op      = "profile"
target  = "record"
profile = "large"
edit    = "s/^- \\*\\*Profile\\*\\*:.*$/- **Profile**: large — <one clause naming the contract>; user-facing <yes|no>; locks format/"
then    = "delete the field's wrapped continuation lines (indented, up to the next `- **` bullet)"
why     = "One durable contract locking an enum, hash, format, grammar or destructive op — large."

[[rule]]
id = "profile-contract"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "1"
[rule.guard.all.locks]
eq = "contract"
[rule.emit]
op      = "profile"
target  = "record"
profile = "mid"
edit    = "s/^- \\*\\*Profile\\*\\*:.*$/- **Profile**: mid — <one clause naming the contract>; user-facing <yes|no>; locks contract/"
then    = "delete the field's wrapped continuation lines (indented, up to the next `- **` bullet)"
why     = "One durable contract that locks a contract — mid, whether or not it is user-facing."

[[rule]]
id = "profile-user-facing"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "1"
[rule.guard.all.locks]
eq = "none"
[rule.guard.all.user_facing]
eq = "yes"
[rule.emit]
op      = "profile"
target  = "record"
profile = "mid"
edit    = "s/^- \\*\\*Profile\\*\\*:.*$/- **Profile**: mid — <one clause naming the contract>; user-facing yes; locks none/"
then    = "delete the field's wrapped continuation lines (indented, up to the next `- **` bullet)"
why     = "One durable contract with a user-facing surface — mid."

[[rule]]
id = "profile-internal"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "1"
[rule.guard.all.locks]
eq = "none"
[rule.guard.all.user_facing]
eq = "no"
[rule.emit]
op      = "profile"
target  = "record"
profile = "small"
edit    = "s/^- \\*\\*Profile\\*\\*:.*$/- **Profile**: small — <one clause naming the contract>; user-facing no; locks none/"
then    = "delete the field's wrapped continuation lines (indented, up to the next `- **` bullet)"
why     = "One durable contract, internal, locking nothing — small; Stage 5 is skipped."
surface = "that the next stage is Reconcile, not Pre-Lock"

[[rule]]
id = "profile-surface-unjudged"
[rule.match.recognized]
eq = "profile"
[rule.guard.all.floor]
eq = "none"
[rule.guard.all.contracts_durable]
eq = "1"
[rule.guard.all.locks]
eq = "none"
[rule.guard.all.user_facing]
eq = "unknown"
[rule.emit]
op   = "stopped:profile-judgement-unwritten"
why  = "A contract locking nothing is small or mid by its surface alone, and that is not judged."
surface = "the `user-facing` disposition to write: yes | no"

# ===========================================================================
# return — the stage a blocker sends the record back to
# ===========================================================================
#
# Dimensions: blocker_class = 9 cells, seven rows. Decide-only: the
# answer is the packet's `next_action` (rdr-cascade.toml reads it as
# `action=stage`), and nothing here writes the record.
#
# The ladder was stated at Stage 6 (NOT RECONCILED → 2/3/4), Stage 7 (NOT
# READY: spike or disturbed assumption → 6, assumption gap → 4,
# contradiction → 3, scope/MVV gap → 2, missing determinacy → 5) and
# Stage 8 (a spec defect → 2/3/4). One vocabulary, one table; `demote`
# above writes the same class into a Final's qualifier.

[[rule]]
id = "return-propose"
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "approach"
[rule.emit]
op          = "return"
target      = "packet"
stage       = "propose"
next_action = "/rdr-propose"
why         = "The approach, the scope or the MVV is wrong — Stage 2 owns it."

[[rule]]
id = "return-refine"
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
in = ["contradiction", "contract"]
[rule.emit]
op          = "return"
target      = "packet"
stage       = "refine"
next_action = "/rdr-refine"
why         = "A contradiction or a contract edit — Stage 3 owns it."

[[rule]]
id = "return-resolve"
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "assumption-gap"
[rule.emit]
op          = "return"
target      = "packet"
stage       = "resolve"
next_action = "/rdr-resolve"
why         = "An assumption is unverified or refuted — Stage 4 owns it."

[[rule]]
id = "return-prelock"
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "determinacy"
[rule.emit]
op          = "return"
target      = "packet"
stage       = "prelock"
next_action = "/rdr-prelock repeatability 1"
why         = "The `Determinacy:` line reads fired and no run-1/diff exists — repeatability-lite owns it."

[[rule]]
id = "return-reconcile"
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
in = ["spike", "assumption-disturbed"]
[rule.emit]
op          = "return"
target      = "packet"
stage       = "reconcile"
next_action = "/rdr-reconcile"
why         = "An open spike or a round-disturbed assumption — Stage 6 owns closing it."

[[rule]]
id = "return-finalize"
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "wording"
[rule.emit]
op          = "return"
target      = "packet"
stage       = "finalize"
next_action = "/rdr-finalize"
why         = "Wording or a cross-reference, no assumption disturbed — the lock pass fixes it in place."

[[rule]]
id = "return-unclassed"
[rule.match.recognized]
eq = "return"
[rule.guard.all.blocker_class]
eq = "none"
[rule.emit]
op   = "stopped:no-blocker-class"
why  = "The blocker carries no class — no stage can be named for it."
surface = "the blocker, so the gate classes it (approach | contradiction | contract | assumption-gap | assumption-disturbed | spike | determinacy | wording)"
