# rdr-write.toml — the flow's structural record edits, as data.
#
# Six operations the flow performed by hand, restated across prompt
# sites and re-derived by a model on every run: claim a number, add or
# flip the README index row, lock at Stage 7, demote at 7.1, size the
# Profile at Resolve, and name the stage a blocker returns to. They are
# the largest edits in the flow and the most mechanical.
#
# ---------------------------------------------------------------------
# WHY THIS IS A TABLE AND NOT AN `rdr` SUBCOMMAND
#
# `rdr` stays READ-ONLY. Its own doctrine — "It never writes to a record"
# (tools/rdr/README.md §What it refuses to do) — is unchanged by this
# file, deliberately and not by omission. The alternative was four write
# verbs in the projector; it was rejected because every such verb is Go
# that has to be kept correct, and because the win being chased is not
# "a binary that writes" but SMALLER PROMPTS AND HIGHER DETERMINISM.
# That win needs the operation NAMED and DISPATCHED somewhere a prompt
# can cite — which is here.
#
# So the composition is the one `rdr-status.toml` already proves:
#
#   rdr status --tags NNNN  →  intrastate flow resolve --model rdr-write.toml
#      (the facts, as argv)       (this table)   →   emit{op, target, edit}
#
# Neither binary calls the other. `rdr` renders the facts, `intrastate`
# selects exactly one row, and the caller applies the emitted edit with
# an established tool (`sed`, `git mv`). Determining the state and
# applying the change are both delegated; this file is the decision in
# between, and it is reviewable as one document.
#
# WHAT `intrastate lint --model` BUYS, AND IT IS THE POINT: every cell of
# each declared product is claimed by exactly one row. The refuse cases —
# a record already Final, a pre-seed record with no index row — are not
# fixtures hoping to be written. They are CELLS, and a gap in them is a
# lint failure here rather than a wrong answer to an agent months from
# now. That is a stronger guarantee than a per-op refuse test.
#
# THE EDIT IS DATA — TRANSITIONALLY. `[rule.emit]` carries the exact `sed`
# expression, not a description of one, and the caller applies it as
# handed. That is a stop-gap, not the design: intrastate RDR 0025's write
# binding takes planned OWNED tags on a state-machine, and a decision
# table owns nothing (RDR 0010), so no shipped binding can consume these
# emits. The end state is a successor intrastate RDR pair (a declared,
# in-process edit writer; `set-state --plan`) after which this file becomes
# a state-machine over a command reader and the `edit`/`sections` emits
# are deleted — the rows' guards and `op` answers survive, the shell
# strings do not. Until then: no interpolation, so `NNNN` and slugs are
# never spelled here; the caller appends what it already holds.
#
# ---------------------------------------------------------------------
# THE COUPLING IS THE FACT NAMES, AND NOTHING ELSE
#
# Every `[tags.*]` name below must match a fact `models/rdr-facts.toml`
# declares. A rename there is a breaking change here, exactly as it is
# for `rdr-status.toml`.
#
# THE DIMENSIONS ARE GUARD ATOMS, NEVER MATCH ATOMS. `[rule.match.*]`
# scopes a row's group and contributes NO dimension to the product lint
# proves exhaustiveness over. A table discriminated by match atoms ranges
# over an empty product that any single row closes — green whether or not
# it is complete.
#
# SIX OUTCOMES, BECAUSE THE PRODUCT BOUND IS PER GROUP. Each op asks a
# different question over a different slice of the facts, and splitting
# the question splits the product.
#
# FOUR TAGS ARE CALLER-SUPPLIED, NOT FACTS — the `observed` provenance's
# ordinary shape, as rdr-cascade.toml's packet fields are. `user_facing`
# and `locks` are Resolve's two judgements of the contract, written once
# in the Profile clause; `floor` is rdr-status.toml's `emit.floor`, passed
# through as a value so the accretion rule keeps its one home; and
# `blocker_class` is the verdict packet's class of blocker. The resolver
# demands a tag only where a row guards on it, so `claim`, `readme` and
# `lock` run unchanged. `tools/rdr/routing_test.go` allowlists them.
#
# ---------------------------------------------------------------------
# WHAT THIS TABLE DOES NOT DECIDE
#
# It routes STRUCTURE and STATUS. It never authors content, and it never
# judges. Whether the gate PASSES is Stage 7's reading of five written
# responses; whether a cluster defect warrants a demotion is 7.1's
# judgement. Those arrive as the caller's `--outcome` — the table answers
# "given that verdict, what is the edit", never "what is the verdict".
#
# Where the flow's own answer is a judgement a fact cannot make, the row
# emits a `stopped:` token naming what is missing, exactly as
# §stop-packet requires: a skipped check must never read as a passed one.
#
# The Profile is the one place a judgement is an INPUT: whether the
# contract is user-facing and what it locks are Resolve's to say, so they
# arrive as tags with `unknown` a declared member that stops by name.
# The `profile` group maps them; it never infers them.

outcomes = ["claim", "readme", "lock", "demote", "profile", "return"]

[model]
id          = "rdr-write"
version     = 1
class       = "decision-table"
description = "RDR write side: the record's facts to the one structural edit."

# --- the emit vocabulary (intrastate RDR 0024) ------------------------------
#
# Declared so a misspelt stop token or an undeclared key is a lint
# failure, not a value a skill reads as an op. `op`'s dispositions are the
# caller's contract: `edit` carries an expression to apply, `none` is the
# state already held, `stop` is a §stop-packet token. Every key a row
# emits is declared — the loader refuses a partial declaration.
[emit.op]
kind = "enum"
[emit.op.domain]
edit = ["claim", "readme-add", "readme-flip", "lock", "demote", "profile", "return"]
none = ["none"]
stop = ["stopped:no-index-table", "stopped:gate-stale", "stopped:no-gate-written", "stopped:not-lockable", "stopped:not-demotable", "stopped:no-blocker-class", "stopped:class-not-a-reentry", "stopped:contracts-unlabelled", "stopped:no-contracts", "stopped:split-signal", "stopped:profile-judgement-unwritten"]

[emit.target]
kind   = "enum"
domain = ["records-dir", "readme", "record", "packet"]

[emit.edit]
kind = "scalar"

[emit.sections]
kind = "scalar"

[emit.then]
kind = "scalar"

[emit.why]
kind = "scalar"

[emit.surface]
kind = "scalar"

# The `profile` group's answer: the value the Profile field must carry.
[emit.profile]
kind   = "enum"
domain = ["small", "mid", "large", "foundational"]

# The stage a blocker returns to, as `demote` writes it (`@<stage>`, the
# four the qualifier grammar accepts) and as `return` names it. The token
# is the skill's verb; `next_action` is the command the packet carries.
[emit.stage]
kind   = "enum"
domain = ["propose", "refine", "resolve", "prelock", "reconcile", "finalize"]

# A subset of rdr-status.toml's `route` disposition, policed by
# `tools/rdr/routing_test.go`; the caller appends NNNN as everywhere.
[emit.next_action]
kind   = "enum"
domain = ["/rdr-propose", "/rdr-refine", "/rdr-resolve", "/rdr-prelock repeatability 1", "/rdr-reconcile", "/rdr-finalize"]

[tags.recognized]
provenance    = "recognized"
kind          = "enum"
domain        = ["claim", "readme", "lock", "demote", "profile", "return"]
single_valued = true
required      = true

# --- the dimensions --------------------------------------------------------
#
# Each is `required` and `single_valued`. An optional tag withholds the
# coverage claim at lint (`graph-unprovable-coverage`) AND refuses at
# resolve (`flow-guard-unevaluable`), so a dimension that is merely
# sometimes supplied cannot be routed on at all. Where the underlying
# field is genuinely sometimes absent, the FACT TABLE declares the
# sentinel and `--tags` always renders the key.

[tags.status]
provenance    = "observed"
kind          = "enum"
domain        = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The index row's own Status, from `rdr-facts.toml`'s `readme_status`.
# `none` is "the table was read and this record has no row" — the
# condition `readme --add` exists for. `unindexed` is the declared absent
# sentinel: no README, or one carrying no index table, which is
# nothing-looked and must never be written into.
[tags.readme_status]
provenance    = "observed"
kind          = "enum"
domain        = ["unindexed", "none", "Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The qualifier grammar, carried verbatim from model.QualifierForm — the
# same tag `rdr-status.toml` routes the joint-decision home check on.
# Here it splits the lock: a Draft still carrying `[joint decision → …]`
# must keep that qualifier through the status flip, because the
# navigator's `locate-final-joint-decision` row reads it off the Final.
[tags.status_form]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "demoted-target", "revised-from", "joint-decision", "revisit-when", "bracketed", "dash", "parenthetical"]
single_valued = true
required      = true

# The two SET-VALUED facts the producer emits, declared with NO guard atom.
#
# They are here purely so the composition does not refuse. `rdr status
# --tags` emits the whole fact vector and this table guards on a subset —
# the intended shape, since only guard atoms make dimensions. But an
# undeclared set-valued tag is currently refused as a kind mismatch
# (intrastate#3exy), so every record would refuse with a message naming a
# declaration that does not exist. Declaring them costs the product
# nothing: no guard atom references them, so they contribute no dimension.
# Delete both when 3exy lands.
[tags.cluster]
provenance = "observed"
kind       = "set"

[tags.open_joint_decisions]
provenance = "observed"
kind       = "set"

# The gate id-lists (ca_pending_ids, ca_off_vocabulary_ids, reverify) are
# set-valued and always on, so they ride the one-substitution call like
# `cluster` does; no row guards on them, so they cost the product nothing.
[tags.ca_pending_ids]
provenance = "observed"
kind       = "set"

[tags.ca_off_vocabulary_ids]
provenance = "observed"
kind       = "set"

[tags.reverify]
provenance = "observed"
kind       = "set"

# Stage 7's done-signal: `{ARTIFACT_DIR}/gate.md` exists. It does not say
# the gate PASSED — the projector does not open that file — so `lock`
# reads it only to tell a first lock from a re-lock.
[tags.gate_written]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# Whether that gate.md PREDATES a re-entry's demote date. A re-entered
# `Draft [revised from Final <date>; …]` keeps the gate.md its Final
# earned, so `gate_written` alone would let the record lock over a gate
# that never saw the rework. Only a re-entry has a demote date, so a
# first-pass Draft renders `false` — the declared absent sentinel.
[tags.gate_stale]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# --- the `profile` group's dimensions ---------------------------------------
#
# The contract axis, from `rdr-facts.toml`: labelled contracts minus the
# Transient-marked ones, already subtracted and bucketed by the projector
# (`contracts_durable`), and whether the section carries authored prose
# (`contracts_prose`) — a `0` bucket with prose is UNLABELLED, which no
# row can size and so stops by name; a `0` without is an empty section.
[tags.contracts_durable]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1", "2+"]
single_valued = true
required      = true

[tags.contracts_prose]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# CALLER-SUPPLIED — Resolve's two judgements of the one durable contract,
# each written once as a disposition in the Profile clause (`mid — C1;
# user-facing yes; locks contract`, 04-resolve.prompt.md). `unknown` is
# the declared "not judged" member and stops; nothing here defaults it.
# `locks` is what the contract binds: nothing, a contract (→ mid), an
# enum/hash/format/grammar/destructive op (→ large), or other RDRs and
# modules (→ foundational) — one single-valued axis where the prose had
# three overlapping clauses.
[tags.user_facing]
provenance    = "observed"
kind          = "enum"
domain        = ["yes", "no", "unknown"]
single_valued = true
required      = true

[tags.locks]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "contract", "format", "cross-rdr", "unknown"]
single_valued = true
required      = true

# CALLER-SUPPLIED — rdr-status.toml's `emit.floor` (`--outcome floor`,
# rdr-common §lens-row), passed through as the value it is. The accretion
# rule (two or more prior point-fixes, no disposition) lives in that one
# group; this table reads its ANSWER and never restates the count.
[tags.floor]
provenance    = "observed"
kind          = "enum"
domain        = ["foundational", "none"]
single_valued = true
required      = true

# CALLER-SUPPLIED — the class of a listed blocker, from the verdict
# packet (Stage 6 NOT RECONCILED, Stage 7 NOT READY, Stage 8's spec
# defect, 7.1's SPEC-DEFECT scope). The vocabulary is the former prose
# ladders' own: an approach or scope/MVV gap (`approach`), a
# `contradiction`, a `contract` edit, an `assumption-gap` Stage 4 must
# re-verify, a round-disturbed assumption or open spike Stage 6 must
# close, a missing `determinacy` disposition, or `wording` a re-lock
# fixes in pass. `none` is the declared "unclassed" member and stops.
[tags.blocker_class]
provenance    = "observed"
kind          = "enum"
domain        = ["approach", "contradiction", "contract", "assumption-gap", "assumption-disturbed", "spike", "determinacy", "wording", "none"]
single_valued = true
required      = true

# ===========================================================================
# claim — reserve the next number, atomically
# ===========================================================================
#
# Replaces the `ls | grep -oE '^[0-9]{4}' | sort -n | tail -1` loop plus
# the `set -C` copy at rdr-common §rdr-claim and 01-seed.prompt.md.
#
# THE RESERVATION IS LOAD-BEARING AND STAYS. `NNNN-RESERVED.md` is keyed
# on the number ONLY — no slug, no session suffix — so `set -C`
# (noclobber) makes a second claimant's write genuinely fail rather than
# coexist under a different name. The number is the lock, and a
# concurrent session's `max()` scan counts the reservation, so it picks
# NNNN+1. Retry-on-collision stays with it: the loser bumps and loops.
#
# The claim materialises a copy of TEMPLATE.md in the same atomic step,
# so the reserved file IS the canonical skeleton — which is what removes
# the reason to author structure from scratch or copy a neighbour RDR.
#
# This op is the one that does not read the record: there is no record
# yet. It guards on nothing but the outcome, so its group's product is
# the single recognized cell, claimed once.

# The guard is what makes `readme_status` a participating dimension for
# this group, so its coverage is PROVABLE rather than merely unclaimed.
# It is not decoration: a claim reserves a number in a records dir, and a
# dir whose index cannot be read is one where the max() scan is the only
# thing standing between two sessions and the same number.
[[rule]]
id = "claim-reserve"
[rule.match.recognized]
eq = "claim"
[rule.guard.unless.readme_status]
eq = "unindexed"
[rule.emit]
op     = "claim"
target = "records-dir"
# One atomic step, and the loop is the retry. `set -C` is the lock; the
# subshell keeps noclobber out of the caller's shell.
edit   = "while :; do max=$(ls \"$RDR_RECORDS\" | grep -oE '^[0-9]{4}' | sort -n | tail -1); NNNN=$(printf '%04d' $((10#${max:-0} + 1))); if ( set -C; cat \"$RDR_HOME/TEMPLATE.md\" > \"$RDR_RECORDS/$NNNN-RESERVED.md\" ) 2>/dev/null; then break; fi; done; echo \"$NNNN\""
why    = "The number is the lock: reserve it before authoring, and let a collision retry."
surface = "the claimed NNNN, and that the reserved file is a verbatim TEMPLATE.md copy — fill it in place, never author structure or copy a neighbour RDR"
# The rename is a separate, later act: the slug is not known at claim time.
then   = "git mv \"$RDR_RECORDS/$NNNN-RESERVED.md\" \"$RDR_RECORDS/$NNNN-<slug>.md\" once the slug is settled"

# A records dir whose index cannot be read → refuse the claim too. The
# reservation itself would still work, but the seed that follows it has
# nowhere to add a row, and a number claimed against an unreadable index
# is how a record ends up outside the table it is supposed to be in.
[[rule]]
id = "claim-unreadable-index"
[rule.match.recognized]
eq = "claim"
[rule.guard.all.readme_status]
eq = "unindexed"
[rule.emit]
op   = "stopped:no-index-table"
why  = "No readable index table in the records dir — a claim here yields a record the seed cannot index."
surface = "the records dir, so the human can scaffold or repoint it"

# ===========================================================================
# readme — the index row (the write twin of `index --readme`)
# ===========================================================================
#
# `index --readme` CHECKS the table against the records; this is the
# symmetric write. Sites: 01-seed.prompt.md, 07-finalize.prompt.md,
# 07.1-cluster-reconcile.prompt.md.
#
# The product here is readme_status (11) x status (9) = 99 cells, and the
# rows below claim all of them: no-row adds, a row that already agrees is
# a no-op, a row that disagrees flips, and the unreadable index refuses.

# The four rows below claim every (readme_status x status) cell: 11 x 9 = 99.
# The order of the guards is what makes them disjoint — `unindexed` first
# (nothing looked), then `none` (no row), then the two that compare a real
# row against the record.

# The index cannot be read → REFUSE, before anything else. Nothing looked,
# so nothing may be written: appending to a README whose index this parser
# cannot see would write a second table beside the real one.
[[rule]]
id = "readme-unreadable"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.readme_status]
eq = "unindexed"
[rule.emit]
op   = "stopped:no-index-table"
why  = "No README, or one carrying no `| [NNNN](...) |` index table — nothing looked, so nothing is written."
surface = "the records dir, so the human can say whether the index moved or was never scaffolded"

# No row → ADD one carrying the record's own status.
[[rule]]
id = "readme-add"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.readme_status]
eq = "none"
[rule.emit]
op     = "readme-add"
target = "readme"
# Appended after the LAST existing index row, so the table stays contiguous
# and no other row is touched. The caller supplies the cells it holds.
edit   = "append `| [NNNN](NNNN-slug.md) | <Title> | <Status> | <Priority> |` after the final `| [NNNN](` row of the `## Index` table; replace a first-RDR placeholder comment if one is present"
why    = "The record has no index row and the table was read cleanly — add it."
surface = "Title and Priority from the record's own H1 and Metadata, never invented"

# A row that already carries the record's status → NO-OP. This is what
# makes the op idempotent: running it twice is running it once. The guard
# is an EQUALITY BETWEEN TWO DIMENSIONS, which the grammar cannot state,
# so it is written as one row per status value.
[[rule]]
id = "readme-agrees"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.readme_status]
eq = "Draft"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-final"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.readme_status]
eq = "Final"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-implemented"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Implemented"
[rule.guard.all.readme_status]
eq = "Implemented"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-deferred"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Deferred"
[rule.guard.all.readme_status]
eq = "Deferred"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-demoted"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Demoted"
[rule.guard.all.readme_status]
eq = "Demoted"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-abandoned"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Abandoned"
[rule.guard.all.readme_status]
eq = "Abandoned"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-superseded"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Superseded"
[rule.guard.all.readme_status]
eq = "Superseded"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-reverted"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Reverted"
[rule.guard.all.readme_status]
eq = "Reverted"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-rejected"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Rejected"
[rule.guard.all.readme_status]
eq = "Rejected"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

# A row that DISAGREES with the record → FLIP it in place. The record is
# the source of truth; the index is derived, so the row moves to match it
# and never the other way.
#
# ONE ROW PER RECORD STATUS, each excluding the readme_status that equals
# it. The grammar has no "these two dimensions are equal" atom, so the
# diagonal is subtracted explicitly — and it must be: a single catch-all
# flip row would accept every cell the `agrees` rows do, lint would call
# those rows redundant, and the op would rewrite a row that already said
# the right thing. That is the difference between idempotent and not.

[[rule]]
id = "readme-flip-draft"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Draft"]
[rule.emit]
op     = "readme-flip"
target = "readme"
edit   = "on the `| [NNNN](` row of the `## Index` table, replace the Status cell with the record's own Status; touch no other row and no other cell unless it drifted"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
surface = "the row's old and new Status, so a flip nobody intended is visible"

[[rule]]
id = "readme-flip-final"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Final"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Final"]
[rule.emit]
op     = "readme-flip"
target = "readme"
edit   = "on the `| [NNNN](` row of the `## Index` table, replace the Status cell with the record's own Status; touch no other row and no other cell unless it drifted"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
surface = "the row's old and new Status, so a flip nobody intended is visible"

[[rule]]
id = "readme-flip-implemented"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Implemented"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Implemented"]
[rule.emit]
op     = "readme-flip"
target = "readme"
edit   = "on the `| [NNNN](` row of the `## Index` table, replace the Status cell with the record's own Status; touch no other row and no other cell unless it drifted"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
