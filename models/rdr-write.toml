# A row that DISAGREES with the record → FLIP it in place. The record is
# the source of truth; the index is derived, so the row moves to match it
# and never the other way.
#
# ONE ROW PER RECORD STATUS, each excluding the readme_status that equals
# it. The grammar has no "these two dimensions are equal" atom, so the
# diagonal is subtracted explicitly — and it must be: a single catch-all
# flip row would accept every cell the `agrees` rows do, lint would call
# those rows redundant, and the op would rewrite a row that already said
# the right thing. That is the difference between idempotent and not.

[[rule]]
id = "readme-flip-draft"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Draft"]
[rule.emit]
op     = "readme-flip"
target = "readme"
edit   = "on the `| [NNNN](` row of the `## Index` table, replace the Status cell with the record's own Status; touch no other row and no other cell unless it drifted"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
surface = "the row's old and new Status, so a flip nobody intended is visible"

[[rule]]
id = "readme-flip-final"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
