# rdr-write.toml — the flow's structural record edits, as data.
#
# Seven operations the flow performed by hand, restated across prompt
# sites and re-derived by a model on every run: claim a number, add or
# flip the README index row, lock at Stage 7, demote at 7.1, size the
# Profile at Resolve, name the stage a blocker returns to, and walk the
# search ladder before an open author question. They are the largest
# edits — and largest stops — in the flow, and the most mechanical.
#
# ---------------------------------------------------------------------
# WHY THIS IS A TABLE AND NOT AN `rdr` SUBCOMMAND
#
# `rdr` stays READ-ONLY. Its own doctrine — "It never writes to a record"
# (tools/rdr/README.md §What it refuses to do) — is unchanged by this
# file, deliberately and not by omission. The alternative was four write
# verbs in the projector; it was rejected because every such verb is Go
# that has to be kept correct, and because the win being chased is not
# "a binary that writes" but SMALLER PROMPTS AND HIGHER DETERMINISM.
# That win needs the operation NAMED and DISPATCHED somewhere a prompt
# can cite — which is here.
#
# So the composition is the one `rdr-status.toml` already proves, now
# with the apply half closed for the two edits that carry no prose:
#
#   rdr status --tags NNNN --except status,readme_status
#      (the observed facts, as argv)
#        →  intrastate flow resolve --model rdr-write.toml --as json
#             (this table; owned state read through `rdr` itself)
#        →  intrastate flow set-state --plan -
#             (applies the `edit` carrier, read-back verified)
#
# Neither binary calls the other AS A LIBRARY — intrastate invokes `rdr`
# only as a declared command reader, argv fixed in this file and visible
# to lint. `rdr` renders the facts and reads state back; it never writes.
# For `lock` and `readme-flip` the caller now types nothing: no `sed`, no
# value, one pipe. For the rest (`profile`, `demote`, `claim`,
# `readme-add`) the emitted edit is still applied by hand, because those
# edits carry author prose no table can supply — see the write block
# below.
#
# WHAT `intrastate lint --model` BUYS, AND IT IS THE POINT: every cell of
# each declared product is claimed by exactly one row. The refuse cases —
# a record already Final, a pre-seed record with no index row — are not
# fixtures hoping to be written. They are CELLS, and a gap in them is a
# lint failure here rather than a wrong answer to an agent months from
# now. That is a stronger guarantee than a per-op refuse test.
#
# THE EDIT IS DATA. For `lock` and `readme-flip` it is now a DECLARED
# edit — an `anchor`/`replace` pair intrastate applies in-process, with no
# shell and no caller transcription (RDR 0028's `edit` carrier, reached
# through `set-state --plan`). The successor pair this header used to
# await has shipped, and those rows' `sed` strings are gone.
#
# For the remaining ops `[rule.emit]` still carries the expression and the
# caller applies it as handed. That is not a stop-gap awaiting a tool: an
# `edit` carrier substitutes a PLANNED VALUE, and `profile`, `demote` and
# `readme-add` interpolate author prose (`<one clause naming the
# contract>`, `<one-line reason>`, a title) that no fact supplies; `claim`
# is an allocation with no planned value at all. Converting them would
# make the caller type the prose as a tag for the table to interpolate —
# the transcription this seam exists to remove, relocated rather than
# removed. Their emits stay, and so does the rule: no interpolation, so
# `NNNN` and slugs are never spelled in them; the caller appends what it
# already holds.
#
# ---------------------------------------------------------------------
# THE COUPLING IS THE FACT NAMES, AND NOTHING ELSE
#
# Every `[tags.*]` name below must match a fact `models/rdr-facts.toml`
# declares. A rename there is a breaking change here, exactly as it is
# for `rdr-status.toml`.
#
# THE DIMENSIONS ARE GUARD ATOMS, NEVER MATCH ATOMS. `[rule.match.*]`
# scopes a row's group and contributes NO dimension to the product lint
# proves exhaustiveness over. A table discriminated by match atoms ranges
# over an empty product that any single row closes — green whether or not
# it is complete.
#
# EIGHT OUTCOMES, BECAUSE THE PRODUCT BOUND IS PER GROUP. Each op asks a
# different question over a different slice of the facts, and splitting
# the question splits the product. `fence` is the one that never edits:
# it re-runs propose's overlap arms at lock and only answers `none` or
# stops. `ground` never edits either: it names the next rung of the
# search ladder. `return` DOES edit — it marks the backward edge on the
# record, because a route-back that lived only in the packet was invisible
# to the stage receiving it (see that group's header).
#
# SIX TAGS ARE CALLER-SUPPLIED, NOT FACTS — the `observed` provenance's
# ordinary shape, as rdr-cascade.toml's packet fields are. `user_facing`
# and `locks` are Resolve's two judgements of the contract, written once
# in the Profile clause; `floor` is rdr-status.toml's `emit.floor`, passed
# through as a value so the accretion rule keeps its one home;
# `blocker_class` is the verdict packet's class of blocker; and
# `searched`/`found` are the `ground` group's ladder position. The
# resolver demands a tag only where a row guards on it, so `claim`,
# `readme` and `lock` run unchanged. `tools/rdr/routing_test.go`
# allowlists them.
#
# ---------------------------------------------------------------------
# WHAT THIS TABLE DOES NOT DECIDE
#
# It routes STRUCTURE and STATUS. It never authors content, and it never
# judges. Whether the gate PASSES is Stage 7's reading of five written
# responses; whether a cluster defect warrants a demotion is 7.1's
# judgement. Those arrive as the caller's `--outcome` — the table answers
# "given that verdict, what is the edit", never "what is the verdict".
#
# Where the flow's own answer is a judgement a fact cannot make, the row
# emits a `stopped:` token naming what is missing, exactly as
# §stop-packet requires: a skipped check must never read as a passed one.
#
# The Profile is the one place a judgement is an INPUT: whether the
# contract is user-facing and what it locks are Resolve's to say, so they
# arrive as tags with `unknown` a declared member that stops by name.
# The `profile` group maps them; it never infers them.

outcomes = ["claim", "readme", "lock", "demote", "profile", "return", "fence", "ground"]

[model]
id          = "rdr-write"
version     = 1
class       = "state-machine"
description = "RDR write side: the record's facts to the one structural edit."

# --- the applied writes (intrastate RDR 0028) -------------------------------
#
# Two owned tags, and they are the two the flow's most-run edits touch:
# the record's own `- **Status**:` line and its README index row's Status
# cell. Everything else this table decides — the Profile field, a demote's
# qualifier and Refinement Context, the claim's reservation, a README row
# that does not exist yet — stays an `[rule.emit]` the caller applies,
# because those edits carry AUTHOR PROSE (`<one-line reason>`, `<one
# clause naming the contract>`) that no fact supplies and no table can
# know. An `edit` carrier substitutes a planned value; it does not write a
# sentence. Converting them would mean the caller typing the prose as a
# tag for the table to interpolate, which is the transcription this whole
# seam exists to remove.
#
# So the file is deliberately MIXED, and intrastate's `advance = false`
# (RDR 0028's successor) is what lets it be: the rows that apply carry
# `[rule.write]`, and every row that refuses or no-ops declares that it
# decides without advancing. A refusal therefore resolves to `writes: {}`
# and `next: {}` — there is nothing for `set-state --plan -` to apply, so
# a stop can never be reported as a successful write.
#
# The owned pair is READ, never supplied: intrastate reads owned state
# through these accessors and refuses it as argv. That is why §rdr-write
# passes `--except status,readme_status` — the rest of the vector is
# observed and still crosses as tags.

# `[initial]` is the root a transition graph is reached from, not a
# default: every resolve reads the live values through the accessors
# below. A record at the start of the flow is a Draft that no index row
# names yet, which is exactly what `/rdr-seed` produces.
[initial]
status        = "Draft"
readme_status = "none"

# The readers are `rdr` itself, in the flat-object shape a command reader
# takes (RDR 0025). The tool that renders the facts is the tool that
# confirms them after a write, so a read-back cannot disagree with the
# vector the same call site guarded on — and `rdr` still never writes.
#
# ARGV[0] IS BARE ON PURPOSE, AND CANNOT BE OTHERWISE. A command accessor is
# `exec`d: there is no shell, so `$RDR_HOME` in argv[0] is not expanded (it
# execs the literal, resolved against the model's own directory), and the
# `{…}` vocabulary is closed — `{artifact}` and `{tag.*}`, nothing that
# reaches the seam. An absolute path would be one machine's. So the binary is
# named, and the CALLER puts `$RDR_HOME/bin` on `PATH` (rdr-common §rdr-write,
# doctor 11f). Do not "fix" these to an absolute path: it breaks every other
# checkout, and `TestCommandAccessorsNameTheBinaryBare` fails.
[read.record]
role    = "record"
command = ["rdr", "status", "--flat", "--filter", "status", "{artifact}"]
keys    = ["status"]
timeout = "20s"

# Row-addressed: `{tag.nnnn}` tells the projector WHICH row to read, so
# the reader opens one row rather than the corpus (`--row-json`, no
# corpus walk).
[read.readme]
role    = "readme"
# `{artifact}` substitutes WHOLE-ELEMENT only (0025:C2), so the README
# path cannot ride inside `--readme=<path>`, and `--readme <path>` reads
# as the bare flag (optional-argument form) with the path silently
# dropped. It is therefore POSITIONAL here — the one spelling a declared
# reader can get right.
command = ["rdr", "index", "--row-json", "{tag.nnnn}", "--flat", "{artifact}"]
keys    = ["readme_status"]
timeout = "20s"

# The record's Status line. The qualifier is CAPTURED and re-emitted:
# `Draft [joint decision → …]` must lock to `Final [joint decision → …]`,
# because the navigator's home check routes on that qualifier and a lock
# that flattened it would unroute the check.
[write.record]
role      = "record"
keys      = ["status"]
timeout   = "20s"
read_back = true
[write.record.edit.status]
anchor  = '^- \*\*Status\*\*: [A-Za-z]+(?P<q>[ \t]+\[.*\])?[ \t]*$'
replace = '- **Status**: {status}${q}'

# The index row's Status cell, addressed by record number so no other
# row is touched. The linked and bare first-cell forms are both matched,
# because a delinked row still says the record is indexed.
[write.readme]
role      = "readme"
keys      = ["readme_status"]
timeout   = "20s"
read_back = true
[write.readme.edit.readme_status]
anchor  = '^(\|[ \t]*(?:\[{tag.nnnn}\]\([^)]*\)|{tag.nnnn})[ \t]*\|[^|]*\|)[^|]*(\|.*)$'
replace = '${1} {readme_status} ${2}'

# --- the emit vocabulary (intrastate RDR 0024) ------------------------------
#
# Declared so a misspelt stop token or an undeclared key is a lint
# failure, not a value a skill reads as an op. `op`'s dispositions are the
# caller's contract: `edit` carries an expression to apply, `none` is the
# state already held, `stop` is a §stop-packet token. Every key a row
# emits is declared — the loader refuses a partial declaration.
[emit.op]
kind = "enum"
[emit.op.domain]
edit = ["claim", "readme-add", "readme-flip", "lock", "demote", "profile", "return", "ground"]
none = ["none"]
stop = ["stopped:no-index-table", "stopped:gate-stale", "stopped:no-gate-written", "stopped:not-lockable", "stopped:not-demotable", "stopped:no-blocker-class", "stopped:class-not-a-reentry", "stopped:contracts-unlabelled", "stopped:no-contracts", "stopped:split-signal", "stopped:profile-judgement-unwritten", "stopped:joint-decision-open", "stopped:overlap-uncited", "stopped:overlap-unchecked", "stopped:rulings-open", "stopped:rulings-unchecked", "stopped:impact-unwritten"]

[emit.target]
kind   = "enum"
domain = ["records-dir", "readme", "record", "packet"]

[emit.edit]
kind = "scalar"

[emit.sections]
kind = "scalar"

[emit.then]
kind = "scalar"

[emit.why]
kind = "scalar"

[emit.surface]
kind = "scalar"

# The `profile` group's answer: the value the Profile field must carry.
[emit.profile]
kind   = "enum"
domain = ["small", "mid", "large", "foundational"]

# The stage a blocker returns to, as `demote` writes it (`@<stage>`, the
# four the qualifier grammar accepts) and as `return` names it. The token
# is the skill's verb; `next_action` is the command the packet carries.
[emit.stage]
kind   = "enum"
domain = ["propose", "refine", "resolve", "prelock", "reconcile", "finalize"]

# A subset of rdr-status.toml's `route` disposition, policed by
# `tools/rdr/routing_test.go`; the caller appends NNNN as everywhere.
[emit.next_action]
kind   = "enum"
domain = ["/rdr-propose", "/rdr-refine", "/rdr-resolve", "/rdr-prelock repeatability 1", "/rdr-reconcile", "/rdr-finalize"]

# The `ground` group's answer: the next rung of the search ladder, or the
# two terminal dispositions — `apply` (found: recommend with the cite, no
# author question) and `ask` (exhausted: the §stop-packet goes to the
# author carrying `searched=`).
[emit.ground]
kind   = "enum"
domain = ["code", "cluster", "corpus", "rfd", "apply", "ask"]

# A `return` row over a reopened approach or a contradiction gets one
# §strong-consult before the human; other blocker classes route back
# without it.
[emit.consult]
kind   = "enum"
domain = ["strong"]

[tags.recognized]
provenance    = "recognized"
kind          = "enum"
domain        = ["claim", "readme", "lock", "demote", "profile", "return", "fence", "ground"]
single_valued = true
required      = true

# --- the dimensions --------------------------------------------------------
#
# Each is `required` and `single_valued`. An optional tag withholds the
# coverage claim at lint (`graph-unprovable-coverage`) AND refuses at
# resolve (`flow-guard-unevaluable`), so a dimension that is merely
# sometimes supplied cannot be routed on at all. Where the underlying
# field is genuinely sometimes absent, the FACT TABLE declares the
# sentinel and `--tags` always renders the key.

# The record's number, as CONTEXT — an identity, never a value. It
# row-addresses the README reader and writer (`{tag.nnnn}`, RDR 0028
# C1.6) so both open one row instead of the table, and it is the one tag
# the caller supplies that no fact produces: `--tag nnnn=NNNN`, the same
# NNNN already in hand at every call site.
[tags.nnnn]
provenance    = "observed"
kind          = "scalar"
required      = true

# OWNED, not observed: `[write.record]` applies it, so intrastate reads
# it through `[read.record]` and refuses it as argv (`flow-tag-owned`).
# That is why §rdr-write passes `--except status,readme_status`.
[tags.status]
provenance    = "owned"
kind          = "enum"
domain        = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The index row's own Status, from `rdr-facts.toml`'s `readme_status`.
# `none` is "the table was read and this record has no row" — the
# condition `readme --add` exists for. `unindexed` is the declared absent
# sentinel: no README, or one carrying no index table, which is
# nothing-looked and must never be written into.
# OWNED, for the same reason `status` is — `[write.readme]` applies it.
[tags.readme_status]
provenance    = "owned"
kind          = "enum"
domain        = ["unindexed", "none", "Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The qualifier grammar, carried verbatim from model.QualifierForm — the
# same tag `rdr-status.toml` routes the joint-decision home check on.
# Here it splits the lock: a Draft still carrying `[joint decision → …]`
# must keep that qualifier through the status flip, because the
# navigator's `locate-final-joint-decision` row reads it off the Final.
[tags.status_form]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "demoted-target", "revised-from", "routed-back", "joint-decision", "revisit-when", "bracketed", "dash", "parenthetical"]
single_valued = true
required      = true

# NO SET-VALUED TAG IS DECLARED HERE, and that is the point. `rdr status
# --tags` emits the whole fact vector while this table guards on a
# subset — the intended shape, since only guard atoms make dimensions.
# Six set-valued facts ride that vector (`cluster`, `open_joint_decisions`,
# the gate id-lists, `spikes_unrun`) and no row guards any of them, so
# each was declared purely to stop the call refusing: an undeclared
# set-valued tag used to be read as a kind mismatch, naming a declaration
# that did not exist. intrastate RDR 0020 admits an undeclared key as a
# pure carrier, so the declarations are gone and a set-valued fact added
# to `rdr-facts.toml` tomorrow needs no edit here.

# Stage 7's done-signal: `{ARTIFACT_DIR}/gate.md` exists. It does not say
# the gate PASSED — the projector does not open that file — so `lock`
# reads it only to tell a first lock from a re-lock.
[tags.gate_written]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# Whether that gate.md PREDATES a re-entry's demote date. A re-entered
# `Draft [revised from Final <date>; …]` keeps the gate.md its Final
# earned, so `gate_written` alone would let the record lock over a gate
# that never saw the rework. Only a re-entry has a demote date, so a
# first-pass Draft renders `false` — the declared absent sentinel.
[tags.gate_stale]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# The lock's reading of the `Joint-check:` lines, from `rdr-facts.toml`'s
# `joint_check_home` — worst line first. `open` is the one the lock
# refuses. `unhomed` locks and stays visible on the vector: a consumer's
# joint-decision register may sit outside the records dir, which the
# tool cannot resolve yet, and refusing what it cannot read would stop
# every fire homed there. `none` is the declared absent sentinel (no
# line written), which rdr-status's `joint_checks` already surfaces and
# the lock does not read as clear.
[tags.joint_check_home]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "clear", "homed", "open", "unhomed"]
single_valued = true
required      = true

# --- the `fence` group's dimensions -----------------------------------------
#
# Propose's overlap arms re-run at lock, scoped to this record
# (`overlap_uncited`, ON DEMAND — the caller filters for it by name).
# `unchecked` is the declared sentinel for no corpus bound.
[tags.overlap_uncited]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+", "unchecked"]
single_valued = true
required      = true

# An author ruling in evidence/rulings.md no stage has marked absorbed
# (`rdr-facts.toml`'s `rulings_open`). `unchecked` is the declared
# sentinel for no evidence root bound.
[tags.rulings_open]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+", "unchecked"]
single_valued = true
required      = true

# --- the `profile` group's dimensions ---------------------------------------
#
# The contract axis, from `rdr-facts.toml`: labelled contracts minus the
# Transient-marked ones, already subtracted and bucketed by the projector
# (`contracts_durable`), and whether the section carries authored prose
# (`contracts_prose`) — a `0` bucket with prose is UNLABELLED, which no
# row can size and so stops by name; a `0` without is an empty section.
[tags.contracts_durable]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1", "2+"]
single_valued = true
required      = true

[tags.contracts_prose]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# CALLER-SUPPLIED — Resolve's two judgements of the one durable contract,
# each written once as a disposition in the Profile clause (`mid — C1;
# user-facing yes; locks contract`, 04-resolve.prompt.md). `unknown` is
# the declared "not judged" member and stops; nothing here defaults it.
# `locks` is what the contract binds: nothing, a contract (→ mid), an
# enum/hash/format/grammar/destructive op (→ large), or other RDRs and
# modules (→ foundational) — one single-valued axis where the prose had
# three overlapping clauses.
[tags.user_facing]
provenance    = "observed"
kind          = "enum"
domain        = ["yes", "no", "unknown"]
single_valued = true
required      = true

[tags.locks]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "contract", "format", "cross-rdr", "unknown"]
single_valued = true
required      = true

# CALLER-SUPPLIED — rdr-status.toml's `emit.floor` (`--outcome floor`,
# rdr-common §lens-row), passed through as the value it is. The accretion
# rule (two or more prior point-fixes, no disposition) lives in that one
# group; this table reads its ANSWER and never restates the count.
# `raise` lifts the contract-axis tier by one; `none` leaves it be.
[tags.floor]
provenance    = "observed"
kind          = "enum"
domain        = ["raise", "none"]
single_valued = true
required      = true

# CALLER-SUPPLIED — the class of a listed blocker, from the verdict
# packet (Stage 6 NOT RECONCILED, Stage 7 NOT READY, Stage 8's spec
# defect, 7.1's SPEC-DEFECT scope). The vocabulary is the former prose
# ladders' own: an approach or scope/MVV gap (`approach`), a
# `contradiction`, a `contract` edit, an `assumption-gap` Stage 4 must
# re-verify, a round-disturbed assumption or open spike Stage 6 must
# close, a missing `determinacy` disposition, `wording` a re-lock fixes
# in pass, or a `proportionality` finding — a self-flagged split not
# executed, a cost unweighed — Stage 3 owns it. `none` is the declared
# "unclassed" member and stops.
[tags.blocker_class]
provenance    = "observed"
kind          = "enum"
domain        = ["approach", "contradiction", "contract", "proportionality", "assumption-gap", "assumption-disturbed", "spike", "determinacy", "wording", "none"]
single_valued = true
required      = true

# CALLER-SUPPLIED — the `ground` group's ladder position. The highest rung
# ALREADY searched for this question; the ladder is ordered (code, then
# the cluster, then the corpora, then the RFDs/JDRs), so one scalar says
# where the caller stands on it. `none` is "nothing searched yet".
[tags.searched]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "code", "cluster", "corpus", "rfd"]
single_valued = true
required      = true

# CALLER-SUPPLIED — whether the rung named by `searched` settled the
# question. `true` short-circuits straight to `apply`; `false` walks the
# caller to the next rung.
[tags.found]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# rdr-facts.toml's `peers` — whether `index --cluster-of` reports anyone
# besides the seed, the `ground` group's one observed FACT dimension. Not
# `clustered`: that reads the DECLARED Cluster field, and a record with no
# field but cross-cutting peers read "no peers" and skipped the rung whose
# surface is that very command. `rdr status --tags` always renders it.
[tags.peers]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+"]
single_valued = true
required      = true

# rdr-facts.toml's `clustered` — whether the record declares Cluster
# siblings; the prelock group's dimension. `rdr status --tags` always
# renders it (`fact.clustered`'s `absent = "false"`), same as `status` or
# `gate_written` above.
[tags.clustered]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# rdr-facts.toml's `impact_families` — impact.md's `families:` count,
# bucketed; `none` when the file is unread. The `fence` group reads it
# beside `clustered`: a clustered record locks only with its predicted
# blast radius written (rdr#2r7s — 7 of cli/0112's 22 deviations were
# cross-record entanglements `rdr impact` had predicted, after the lock).
[tags.impact_families]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+", "none"]
single_valued = true
required      = true

# ===========================================================================
# claim — reserve the next number, atomically
# ===========================================================================
#
# Replaces the `ls | grep -oE '^[0-9]{4}' | sort -n | tail -1` loop plus
# the `set -C` copy at rdr-common §rdr-claim and 01-seed.prompt.md.
#
# THE RESERVATION IS LOAD-BEARING AND STAYS. `NNNN-RESERVED.md` is keyed
# on the number ONLY — no slug, no session suffix — so `set -C`
# (noclobber) makes a second claimant's write genuinely fail rather than
# coexist under a different name. The number is the lock, and a
# concurrent session's `max()` scan counts the reservation, so it picks
# NNNN+1. Retry-on-collision stays with it: the loser bumps and loops.
#
# The claim materialises a copy of TEMPLATE.md in the same atomic step,
# so the reserved file IS the canonical skeleton — which is what removes
# the reason to author structure from scratch or copy a neighbour RDR.
#
# This op is the one that does not read the record: there is no record
# yet. It guards on nothing but the outcome, so its group's product is
# the single recognized cell, claimed once.

# The guard is what makes `readme_status` a participating dimension for
# this group, so its coverage is PROVABLE rather than merely unclaimed.
# It is not decoration: a claim reserves a number in a records dir, and a
# dir whose index cannot be read is one where the max() scan is the only
# thing standing between two sessions and the same number.
[[rule]]
id = "claim-reserve"
advance = false
[rule.match.recognized]
eq = "claim"
[rule.guard.unless.readme_status]
eq = "unindexed"
[rule.emit]
op     = "claim"
target = "records-dir"
# One atomic step, and the loop is the retry. `set -C` is the lock; the
# subshell keeps noclobber out of the caller's shell.
edit   = "while :; do max=$(ls \"$RDR_RECORDS\" | grep -oE '^[0-9]{4}' | sort -n | tail -1); NNNN=$(printf '%04d' $((10#${max:-0} + 1))); if ( set -C; cat \"$RDR_HOME/TEMPLATE.md\" > \"$RDR_RECORDS/$NNNN-RESERVED.md\" ) 2>/dev/null; then break; fi; done; echo \"$NNNN\""
why    = "The number is the lock: reserve it before authoring, and let a collision retry."
surface = "the claimed NNNN, and that the reserved file is a verbatim TEMPLATE.md copy — fill it in place, never author structure or copy a neighbour RDR"
# The rename is a separate, later act: the slug is not known at claim time.
then   = "git mv \"$RDR_RECORDS/$NNNN-RESERVED.md\" \"$RDR_RECORDS/$NNNN-<slug>.md\" once the slug is settled"

# A records dir whose index cannot be read → refuse the claim too. The
# reservation itself would still work, but the seed that follows it has
# nowhere to add a row, and a number claimed against an unreadable index
# is how a record ends up outside the table it is supposed to be in.
[[rule]]
id = "claim-unreadable-index"
advance = false
[rule.match.recognized]
eq = "claim"
[rule.guard.all.readme_status]
eq = "unindexed"
[rule.emit]
op   = "stopped:no-index-table"
why  = "No readable index table in the records dir — a claim here yields a record the seed cannot index."
surface = "the records dir, so the human can scaffold or repoint it"

# ===========================================================================
# readme — the index row (the write twin of `index --readme`)
# ===========================================================================
#
# `index --readme` CHECKS the table against the records; this is the
# symmetric write. Sites: 01-seed.prompt.md, 07-finalize.prompt.md,
# 07.1-cluster-reconcile.prompt.md.
#
# The product here is readme_status (11) x status (9) = 99 cells, and the
# rows below claim all of them: no-row adds, a row that already agrees is
# a no-op, a row that disagrees flips, and the unreadable index refuses.

# The four rows below claim every (readme_status x status) cell: 11 x 9 = 99.
# The order of the guards is what makes them disjoint — `unindexed` first
# (nothing looked), then `none` (no row), then the two that compare a real
# row against the record.

# The index cannot be read → REFUSE, before anything else. Nothing looked,
# so nothing may be written: appending to a README whose index this parser
# cannot see would write a second table beside the real one.
[[rule]]
id = "readme-unreadable"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.all.readme_status]
eq = "unindexed"
[rule.emit]
op   = "stopped:no-index-table"
why  = "No README, or one carrying no numbered index table — nothing looked, so nothing is written."
surface = "the records dir, so the human can say whether the index moved or was never scaffolded"

# No row → ADD one carrying the record's own status.
[[rule]]
id = "readme-add"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.all.readme_status]
eq = "none"
[rule.emit]
op     = "readme-add"
target = "readme"
# Appended after the LAST existing index row, so the table stays contiguous
# and no other row is touched. The caller supplies the cells it holds.
edit   = "append `| [NNNN](NNNN-slug.md) | <Title> | <Status> | <Priority> |` after the final numbered row of the `## Index` table; replace a first-RDR placeholder comment if one is present"
why    = "The record has no index row and the table was read cleanly — add it."
surface = "Title and Priority from the record's own H1 and Metadata, never invented"

# A row that already carries the record's status → NO-OP. This is what
# makes the op idempotent: running it twice is running it once. The guard
# is an EQUALITY BETWEEN TWO DIMENSIONS, which the grammar cannot state,
# so it is written as one row per status value.
[[rule]]
id = "readme-agrees"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.readme_status]
eq = "Draft"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-final"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.readme_status]
eq = "Final"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-implemented"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Implemented"
[rule.guard.all.readme_status]
eq = "Implemented"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-deferred"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Deferred"
[rule.guard.all.readme_status]
eq = "Deferred"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-demoted"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Demoted"
[rule.guard.all.readme_status]
eq = "Demoted"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-abandoned"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Abandoned"
[rule.guard.all.readme_status]
eq = "Abandoned"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-superseded"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Superseded"
[rule.guard.all.readme_status]
eq = "Superseded"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-reverted"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Reverted"
[rule.guard.all.readme_status]
eq = "Reverted"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-rejected"
advance = false
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Rejected"
[rule.guard.all.readme_status]
eq = "Rejected"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

# A row that DISAGREES with the record → FLIP it in place. The record is
# the source of truth; the index is derived, so the row moves to match it
# and never the other way.
#
# ONE ROW PER RECORD STATUS, each excluding the readme_status that equals
# it. The grammar has no "these two dimensions are equal" atom, so the
# diagonal is subtracted explicitly — and it must be: a single catch-all
# flip row would accept every cell the `agrees` rows do, lint would call
# those rows redundant, and the op would rewrite a row that already said
# the right thing. That is the difference between idempotent and not.

[[rule]]
id = "readme-flip-draft"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Draft"]
[rule.emit]
op     = "readme-flip"
target = "readme"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
surface = "the row's old and new Status, so a flip nobody intended is visible"
[rule.write]
readme_status = "Draft"

[[rule]]
id = "readme-flip-final"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Final"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Final"]
[rule.emit]
op     = "readme-flip"
target = "readme"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
surface = "the row's old and new Status, so a flip nobody intended is visible"
[rule.write]
readme_status = "Final"

[[rule]]
id = "readme-flip-implemented"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Implemented"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Implemented"]
[rule.emit]
op     = "readme-flip"
target = "readme"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
surface = "the row's old and new Status, so a flip nobody intended is visible"
[rule.write]
readme_status = "Implemented"

[[rule]]
id = "readme-flip-deferred"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.status]
eq = "Deferred"
[rule.guard.unless.readme_status]
in = ["unindexed", "none", "Deferred"]
