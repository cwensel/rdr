[rule.emit]
op     = "readme-flip"
target = "readme"
edit   = "on the `| [NNNN](` row of the `## Index` table, replace the Status cell with the record's own Status; touch no other row and no other cell unless it drifted"
why    = "The index row disagrees with the record — the record is the source of truth, so the row moves."
surface = "the row's old and new Status, so a flip nobody intended is visible"

