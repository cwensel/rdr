# rdr-write.toml — the flow's structural record edits, as data.
#
# Four operations the flow performs by hand today, restated across five
# prompt sites and re-derived by a model on every run: claim a number,
# add or flip the README index row, lock at Stage 7, demote at 7.1. They
# are the largest edits in the flow and the most mechanical.
#
# ---------------------------------------------------------------------
# WHY THIS IS A TABLE AND NOT AN `rdr` SUBCOMMAND
#
# `rdr` stays READ-ONLY. Its own doctrine — "It never writes to a record"
# (tools/rdr/README.md §What it refuses to do) — is unchanged by this
# file, deliberately and not by omission. The alternative was four write
# verbs in the projector; it was rejected because every such verb is Go
# that has to be kept correct, and because the win being chased is not
# "a binary that writes" but SMALLER PROMPTS AND HIGHER DETERMINISM.
# That win needs the operation NAMED and DISPATCHED somewhere a prompt
# can cite — which is here.
#
# So the composition is the one `rdr-status.toml` already proves:
#
#   rdr status --tags NNNN  →  intrastate flow resolve --model rdr-write.toml
#      (the facts, as argv)       (this table)   →   emit{op, target, edit}
#
# Neither binary calls the other. `rdr` renders the facts, `intrastate`
# selects exactly one row, and the caller applies the emitted edit with
# an established tool (`sed`, `git mv`). Determining the state and
# applying the change are both delegated; this file is the decision in
# between, and it is reviewable as one document.
#
# WHAT `intrastate lint --model` BUYS, AND IT IS THE POINT: every cell of
# each declared product is claimed by exactly one row. The refuse cases —
# a record already Final, a pre-seed record with no index row — are not
# fixtures hoping to be written. They are CELLS, and a gap in them is a
# lint failure here rather than a wrong answer to an agent months from
# now. That is a stronger guarantee than a per-op refuse test.
#
# THE EDIT IS DATA. `[rule.emit]` carries the exact `sed` expression, not
# a description of one. Emit values are uninterpreted strings compared by
# bytes — there is no interpolation — so `NNNN` and slugs are never
# spelled here; the caller appends what it already holds. This is also
# what makes the file forward-compatible: when intrastate ships a write
# accessor that INVOKES a declared command (intrastate#v0hb), the same
# declaration becomes that accessor's command and no row changes.
#
# ---------------------------------------------------------------------
# THE COUPLING IS THE FACT NAMES, AND NOTHING ELSE
#
# Every `[tags.*]` name below must match a fact `models/rdr-facts.toml`
# declares. A rename there is a breaking change here, exactly as it is
# for `rdr-status.toml`.
#
# THE DIMENSIONS ARE GUARD ATOMS, NEVER MATCH ATOMS. `[rule.match.*]`
# scopes a row's group and contributes NO dimension to the product lint
# proves exhaustiveness over. A table discriminated by match atoms ranges
# over an empty product that any single row closes — green whether or not
# it is complete.
#
# FOUR OUTCOMES, BECAUSE THE PRODUCT BOUND IS PER GROUP. Each op asks a
# different question over a different slice of the facts, and splitting
# the question splits the product.
#
# ---------------------------------------------------------------------
# WHAT THIS TABLE DOES NOT DECIDE
#
# It routes STRUCTURE and STATUS. It never authors content, and it never
# judges. Whether the gate PASSES is Stage 7's reading of five written
# responses; whether a cluster defect warrants a demotion is 7.1's
# judgement. Those arrive as the caller's `--outcome` — the table answers
# "given that verdict, what is the edit", never "what is the verdict".
#
# Where the flow's own answer is a judgement a fact cannot make, the row
# emits a `stopped:` token naming what is missing, exactly as
# §stop-packet requires: a skipped check must never read as a passed one.

outcomes = ["claim", "readme", "lock", "demote"]

[model]
id          = "rdr-write"
version     = 1
class       = "decision-table"
description = "RDR write side: the record's facts to the one structural edit."

[tags.recognized]
provenance    = "recognized"
kind          = "enum"
single_valued = true
required      = true

# --- the dimensions --------------------------------------------------------
#
# Each is `required` and `single_valued`. An optional tag withholds the
# coverage claim at lint (`graph-unprovable-coverage`) AND refuses at
# resolve (`flow-guard-unevaluable`), so a dimension that is merely
# sometimes supplied cannot be routed on at all. Where the underlying
# field is genuinely sometimes absent, the FACT TABLE declares the
# sentinel and `--tags` always renders the key.

[tags.status]
provenance    = "observed"
kind          = "enum"
domain        = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The index row's own Status, from `rdr-facts.toml`'s `readme_status`.
# `none` is "the table was read and this record has no row" — the
# condition `readme --add` exists for. `unindexed` is the declared absent
# sentinel: no README, or one carrying no index table, which is
# nothing-looked and must never be written into.
[tags.readme_status]
provenance    = "observed"
kind          = "enum"
domain        = ["unindexed", "none", "Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The two SET-VALUED facts the producer emits, declared with NO guard atom.
#
# They are here purely so the composition does not refuse. `rdr status
# --tags` emits the whole fact vector and this table guards on a subset —
# the intended shape, since only guard atoms make dimensions. But an
# undeclared set-valued tag is currently refused as a kind mismatch
# (intrastate#3exy), so every record would refuse with a message naming a
# declaration that does not exist. Declaring them costs the product
# nothing: no guard atom references them, so they contribute no dimension.
# Delete both when 3exy lands.
[tags.cluster]
provenance = "observed"
kind       = "set"

[tags.open_joint_decisions]
provenance = "observed"
kind       = "set"

# Stage 7's done-signal: `{ARTIFACT_DIR}/gate.md` exists. It does not say
# the gate PASSED — the projector does not open that file — so `lock`
# reads it only to tell a first lock from a re-lock.
[tags.gate_written]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# Whether that gate.md PREDATES a re-entry's demote date. A re-entered
# `Draft [revised from Final <date>; …]` keeps the gate.md its Final
# earned, so `gate_written` alone would let the record lock over a gate
# that never saw the rework. Only a re-entry has a demote date, so a
# first-pass Draft renders `false` — the declared absent sentinel.
[tags.gate_stale]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# ===========================================================================
# claim — reserve the next number, atomically
# ===========================================================================
#
# Replaces the `ls | grep -oE '^[0-9]{4}' | sort -n | tail -1` loop plus
# the `set -C` copy at rdr-common §rdr-claim and 01-seed.prompt.md.
#
# THE RESERVATION IS LOAD-BEARING AND STAYS. `NNNN-RESERVED.md` is keyed
# on the number ONLY — no slug, no session suffix — so `set -C`
# (noclobber) makes a second claimant's write genuinely fail rather than
# coexist under a different name. The number is the lock, and a
# concurrent session's `max()` scan counts the reservation, so it picks
# NNNN+1. Retry-on-collision stays with it: the loser bumps and loops.
#
# The claim materialises a copy of TEMPLATE.md in the same atomic step,
# so the reserved file IS the canonical skeleton — which is what removes
# the reason to author structure from scratch or copy a neighbour RDR.
#
# This op is the one that does not read the record: there is no record
# yet. It guards on nothing but the outcome, so its group's product is
# the single recognized cell, claimed once.

# The guard is what makes `readme_status` a participating dimension for
# this group, so its coverage is PROVABLE rather than merely unclaimed.
# It is not decoration: a claim reserves a number in a records dir, and a
# dir whose index cannot be read is one where the max() scan is the only
# thing standing between two sessions and the same number.
[[rule]]
id = "claim-reserve"
[rule.match.recognized]
eq = "claim"
[rule.guard.unless.readme_status]
eq = "unindexed"
[rule.emit]
op     = "claim"
target = "records-dir"
# One atomic step, and the loop is the retry. `set -C` is the lock; the
# subshell keeps noclobber out of the caller's shell.
edit   = "while :; do max=$(ls \"$RDR_RECORDS\" | grep -oE '^[0-9]{4}' | sort -n | tail -1); NNNN=$(printf '%04d' $((10#${max:-0} + 1))); if ( set -C; cat \"$RDR_HOME/TEMPLATE.md\" > \"$RDR_RECORDS/$NNNN-RESERVED.md\" ) 2>/dev/null; then break; fi; done; echo \"$NNNN\""
why    = "The number is the lock: reserve it before authoring, and let a collision retry."
surface = "the claimed NNNN, and that the reserved file is a verbatim TEMPLATE.md copy — fill it in place, never author structure or copy a neighbour RDR"
# The rename is a separate, later act: the slug is not known at claim time.
then   = "git mv \"$RDR_RECORDS/$NNNN-RESERVED.md\" \"$RDR_RECORDS/$NNNN-<slug>.md\" once the slug is settled"

# A records dir whose index cannot be read → refuse the claim too. The
# reservation itself would still work, but the seed that follows it has
# nowhere to add a row, and a number claimed against an unreadable index
# is how a record ends up outside the table it is supposed to be in.
[[rule]]
id = "claim-unreadable-index"
[rule.match.recognized]
eq = "claim"
[rule.guard.all.readme_status]
eq = "unindexed"
[rule.emit]
op   = "stopped:no-index-table"
why  = "No readable index table in the records dir — a claim here yields a record the seed cannot index."
surface = "the records dir, so the human can scaffold or repoint it"

# ===========================================================================
# readme — the index row (the write twin of `index --readme`)
# ===========================================================================
#
# `index --readme` CHECKS the table against the records; this is the
# symmetric write. Sites: 01-seed.prompt.md, 07-finalize.prompt.md,
# 07.1-cluster-reconcile.prompt.md.
#
# The product here is readme_status (11) x status (9) = 99 cells, and the
# rows below claim all of them: no-row adds, a row that already agrees is
# a no-op, a row that disagrees flips, and the unreadable index refuses.

# The four rows below claim every (readme_status x status) cell: 11 x 9 = 99.
# The order of the guards is what makes them disjoint — `unindexed` first
# (nothing looked), then `none` (no row), then the two that compare a real
# row against the record.

# The index cannot be read → REFUSE, before anything else. Nothing looked,
# so nothing may be written: appending to a README whose index this parser
# cannot see would write a second table beside the real one.
[[rule]]
id = "readme-unreadable"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.readme_status]
eq = "unindexed"
[rule.emit]
op   = "stopped:no-index-table"
why  = "No README, or one carrying no `| [NNNN](...) |` index table — nothing looked, so nothing is written."
surface = "the records dir, so the human can say whether the index moved or was never scaffolded"

# No row → ADD one carrying the record's own status.
[[rule]]
id = "readme-add"
[rule.match.recognized]
eq = "readme"
[rule.guard.all.readme_status]
eq = "none"
[rule.emit]
op     = "readme-add"
target = "readme"
# Appended after the LAST existing index row, so the table stays contiguous
# and no other row is touched. The caller supplies the cells it holds.
edit   = "append `| [NNNN](NNNN-slug.md) | <Title> | <Status> | <Priority> |` after the final `| [NNNN](` row of the `## Index` table; replace a first-RDR placeholder comment if one is present"
why    = "The record has no index row and the table was read cleanly — add it."
surface = "Title and Priority from the record's own H1 and Metadata, never invented"

# A row that already carries the record's status → NO-OP. This is what
# makes the op idempotent: running it twice is running it once. The guard
# is an EQUALITY BETWEEN TWO DIMENSIONS, which the grammar cannot state,
# so it is written as one row per status value.
[[rule]]
id = "readme-agrees"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.readme_status]
eq = "Draft"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

[[rule]]
id = "readme-agrees-final"
[rule.match.recognized]
eq = "readme"
[rule.guard.unless.readme_status]
in = ["unindexed", "none"]
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.readme_status]
eq = "Final"
[rule.emit]
op   = "none"
why  = "The index row already carries this record's status — nothing to write."

