# rdr-launch.toml — the launch prompt's gates, as proven rows.
#
# `prompts/implementation/launch.md` routed Stage 8 by AND-gates in
# prose: the SIZE gate (five caps deciding inline fast-path vs delegated,
# plus four mid-run FALLBACK triggers), the COMPLETION gate (four
# conditions deciding COMPLETE vs INCOMPLETE), the predecessor PRECHECK,
# and — inside Phase 2 — the SHARD route (what the implementer's worklist
# is) and the BUDGET (when a Phase 2 leg returns so a fresh one resumes).
# This table is all of them; `intrastate lint --model` proves every cell.
#
# DECIDE-ONLY (intrastate RDR 0010): zero owned tags, no `[initial]`, no
# accessors. The caller acts on `emit`; nothing here writes.
#
# WHERE EVERY DIMENSION COMES FROM. Facts are rendered by `rdr status
# --tags --filter …` and declared in rdr-facts.toml, whose names are the
# contract (`profile`, `lines`, `req_count`, `impl_orphans`,
# `impl_open_decisions`, `impl_mvv_recorded`, `impact_families`); each is
# total by a declared sentinel or by construction. The rest are
# CALLER-SUPPLIED `observed` tags the caller binds from what the world
# shows it — never estimated, never remembered — and passes as `--tag
# k=v`: `files` (source files in the packets' changed_paths so far),
# `suite` (whether any suite run has exceeded the output cap), `pressure`
# (context nearing the orchestrator limit), `suite_green` (is the full
# suite green now), `baseline` (the full suite before Phase 1 writes a
# test), `commits` and `elapsed` (git and the clock since a Phase 2 leg
# began). At PRECHECKS nothing has happened, so the three size tags are
# their floor values and `req_count` is `none`: the row for that cell is
# what makes the inline path honest rather than a guess.
# `tools/rdr/routing_test.go` names these caller tags in its allowlist.
#
# THE FALLBACK IS THE SAME ROW, RE-ASKED. The prose armed four mid-run
# triggers (a 4th file, >10 REQ, a long suite run, context pressure); each
# is a dimension here, and the inline path re-asks `size` at every phase
# boundary with the tags re-observed. A `delegated` answer mid-run IS the
# fallback — there is no second table for it.
#
# UNDEFINED CELLS, DECIDED. Profile `none` is not `small`, so it delegates
# (the prose: any non-small stays delegated, no exceptions). `req_count`
# `none` with every other cap clear runs inline — Phase 0 writes the list
# and the re-ask reads it — and the row says so in `why`. An unread ledger
# file (`impl_orphans`/`impl_open_decisions` = `none`) is a NAMED STOP,
# never a pass: §stop-packet, a skipped check must not read as a passed
# one. Where more than one condition fails, the first in the prose's own
# order wins — that is the "first failing signal" the ROUTE line printed.
#
# THE ANSWER IS `emit.next`, applied as a value. `size`: `inline` runs
# the phases in this session, `delegated` spawns them (or, mid-run, hands
# off on disk). `complete`: `COMPLETE` is the capsule's state word; a
# `stopped:*` member is the INCOMPLETE blocker, named. `shard`: `single`
# or `sharded` is the worklist the Phase 2 legs walk. `budget`: `continue`
# is the next worklist item, `return-green` the PASS packet,
# `return-partial` the cut — commit, capsule, INCOMPLETE packet, and the
# orchestrator spawns a fresh leg. `why` is the line the caller prints
# beside it. No interpolation: the record number, the phase and the file
# names are the caller's.

outcomes = ["size", "complete", "precheck", "shard", "budget"]

[model]
id          = "rdr-launch"
version     = 1
class       = "decision-table"
description = "Stage-8 launch: the size gate's route, the precheck, the Phase 2 worklist and leg budget, and the completion gate's verdict, from facts plus what the run has observed."

[model.metadata]
owner  = "rdr"
source = "prompts/implementation/launch.md"
facts  = "models/rdr-facts.toml"

[emit.next]
kind = "enum"
[emit.next.domain]
route = ["inline", "delegated", "single", "sharded"]
done  = ["COMPLETE"]
go    = ["proceed", "run-baseline"]
loop  = ["continue", "return-green", "return-partial"]
stop  = ["stopped:coverage-unread", "stopped:deviations-unread", "stopped:suite-red", "stopped:req-orphans", "stopped:mvv-unrecorded", "stopped:open-decisions", "stopped:deviations-status-midline", "stopped:not-final", "stopped:predecessor-unresolved", "stopped:predecessor-incomplete", "stopped:baseline-red", "stopped:impact-unread"]

[emit.why]
kind = "scalar"

[tags.recognized]
provenance    = "recognized"
kind          = "enum"
domain        = ["size", "complete", "precheck", "shard", "budget"]
single_valued = true
required      = true

# --- facts, rendered by `rdr status --tags --filter …` -----------------------

# `none` is the fact's declared absent sentinel: no Profile field.
[tags.profile]
provenance    = "observed"
kind          = "enum"
domain        = ["small", "mid", "large", "foundational", "none"]
single_valued = true
required      = true

# The record's own length at the cap; never absent.
[tags.lines]
provenance    = "observed"
kind          = "enum"
domain        = ["0-400", "401+"]
single_valued = true
required      = true

# Distinct REQ-N in req-list.md at the cap; `none` until Phase 0 writes it.
[tags.req_count]
provenance    = "observed"
kind          = "enum"
domain        = ["0-10", "11+", "none"]
single_valued = true
required      = true

# REQ ids vs coverage rows, both ways; `none` when either file is unread.
[tags.impl_orphans]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+", "none"]
single_valued = true
required      = true

# `Status:` lines still reading needs author decision; `midline` when a
# Status key sits after other text on the line, uncountable; `none` when
# unread.
[tags.impl_open_decisions]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+", "midline", "none"]
single_valued = true
required      = true

# A `## REQ-MVV output` heading in coverage.md; the sentinel is `false`.
[tags.impl_mvv_recorded]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# impact.md's `families:` header count, bucketed; rendered by `rdr status
# --tags --filter impact_families`. `none` = impact.md unread.
[tags.impact_families]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+", "none"]
single_valued = true
required      = true

# --- caller-supplied, observed so far this run -------------------------------

# Source files touched, from the packets' changed_paths; `0-3` at PRECHECKS.
[tags.files]
provenance    = "observed"
kind          = "enum"
domain        = ["0-3", "4+"]
single_valued = true
required      = true

# `long` once any suite run has exceeded ~200 lines of output; `quick` before.
[tags.suite]
provenance    = "observed"
kind          = "enum"
domain        = ["quick", "long"]
single_valued = true
required      = true

# Context approaching the orchestrator limit; `false` at PRECHECKS.
[tags.pressure]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# Is the full suite green now. Inside Phase 2 it is the leg's last
# full-suite exit; at the completion gate the last §return-packet's
# verdict — Phase 2's, or Phase 3c's when it ran: PASS is `true`, anything
# else `false`. PASS means the FULL suite, predecessors included: the
# baseline was green, so a red predecessor test is this change's
# regression, never "pre-existing".
[tags.suite_green]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# The full suite before any Phase 1 test exists: `none` until run (the
# precheck answers `run-baseline`); on resume, the capsule's `baseline:` line.
[tags.baseline]
provenance    = "observed"
kind          = "enum"
domain        = ["green", "red", "none"]
single_valued = true
required      = true

# --- the Phase 2 leg's caps, observed from the world at every ask ----------
#
# The caps ARE the domain boundaries, as `lines` is `0-400`/`401+`: 6
# commits, 30 minutes. Measured over retrofit's recorded Phase 2 agents,
# context grew ~10k tokens/min, so 30 min ≈ 300k — under the 400k line
# every 60–159-min run crossed; at the median 8.5 min per commit the
# elapsed cap binds first and the commit cap catches a fast run.

# `git rev-list --count <start_sha>..HEAD` since the leg's start SHA.
[tags.commits]
provenance    = "observed"
kind          = "enum"
domain        = ["0-5", "6+"]
single_valued = true
required      = true

# Minutes since the leg's start, from epoch seconds: `date -u +%s` now
# minus the start the brief carries, over 60.
[tags.elapsed]
provenance    = "observed"
kind          = "enum"
domain        = ["0-30", "31+"]
single_valued = true
required      = true

# --- the precheck's facts, rendered by `rdr status --tags --filter status,predecessors_state`

# The record's bare lifecycle Status; only Final implements.
[tags.status]
provenance    = "observed"
kind          = "enum"
domain        = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The predecessor gate folded by rdr-facts.toml: `none` when no Predecessors
# field; `unresolved` when a cited record does not resolve; `incomplete`
# when a capsule is absent or not COMPLETE. `predecessors_incomplete` (a set)
# names them for the halt line.
[tags.predecessors_state]
provenance    = "observed"
kind          = "enum"
domain        = ["complete", "incomplete", "unresolved", "none"]
single_valued = true
required      = true

# ===========================================================================
# size — inline fast-path or delegated
# ===========================================================================
#
# profile x lines x req_count x files x suite x pressure = 240 cells. The
# rows are the prose's caps in the prose's order: Profile is the latch,
# then the line cap, the REQ cap, the file cap, the suite cap, and the
# pressure trigger. Two cells run inline: every cap clear with the REQ
# count read, and every cap clear with it not yet written.

[[rule]]
id = "size-not-small"
[rule.match.recognized]
eq = "size"
[rule.guard.unless.profile]
eq = "small"
[rule.emit]
next = "delegated"
why  = "Profile is not small: the latch holds, no exceptions — mid, large and foundational are the 1M-context blowup the delegation exists to prevent."

[[rule]]
id = "size-lines"
[rule.match.recognized]
eq = "size"
[rule.guard.all.profile]
eq = "small"
[rule.guard.all.lines]
eq = "401+"
[rule.emit]
next = "delegated"
why  = "Over 400 lines: a small Profile on a long record is not a small read."

[[rule]]
id = "size-req"
[rule.match.recognized]
eq = "size"
[rule.guard.all.profile]
eq = "small"
[rule.guard.all.lines]
eq = "0-400"
[rule.guard.all.req_count]
eq = "11+"
[rule.emit]
next = "delegated"
why  = "More than 10 REQ-N: the ledger is too wide to hold inline."

[[rule]]
id = "size-files"
[rule.match.recognized]
eq = "size"
[rule.guard.all.profile]
eq = "small"
[rule.guard.all.lines]
eq = "0-400"
[rule.guard.all.req_count]
in = ["0-10", "none"]
[rule.guard.all.files]
eq = "4+"
[rule.emit]
next = "delegated"
why  = "A 4th source file: the surface is wider than the fast-path holds."

[[rule]]
id = "size-suite"
[rule.match.recognized]
eq = "size"
[rule.guard.all.profile]
eq = "small"
[rule.guard.all.lines]
eq = "0-400"
[rule.guard.all.req_count]
in = ["0-10", "none"]
[rule.guard.all.files]
eq = "0-3"
[rule.guard.all.suite]
eq = "long"
[rule.emit]
next = "delegated"
why  = "A suite run exceeded the output cap: its output would accumulate in this context."

[[rule]]
id = "size-pressure"
[rule.match.recognized]
eq = "size"
[rule.guard.all.profile]
eq = "small"
[rule.guard.all.lines]
eq = "0-400"
[rule.guard.all.req_count]
in = ["0-10", "none"]
[rule.guard.all.files]
eq = "0-3"
[rule.guard.all.suite]
eq = "quick"
[rule.guard.all.pressure]
eq = "true"
[rule.emit]
next = "delegated"
why  = "Context pressure: hand off on disk before the limit, not after."

[[rule]]
id = "size-inline"
[rule.match.recognized]
eq = "size"
[rule.guard.all.profile]
eq = "small"
[rule.guard.all.lines]
eq = "0-400"
[rule.guard.all.req_count]
eq = "0-10"
[rule.guard.all.files]
eq = "0-3"
[rule.guard.all.suite]
eq = "quick"
[rule.guard.all.pressure]
eq = "false"
[rule.emit]
next = "inline"
why  = "Every cap holds: run the phases in this session."

[[rule]]
id = "size-inline-uncounted"
[rule.match.recognized]
eq = "size"
[rule.guard.all.profile]
eq = "small"
[rule.guard.all.lines]
eq = "0-400"
[rule.guard.all.req_count]
eq = "none"
[rule.guard.all.files]
eq = "0-3"
[rule.guard.all.suite]
eq = "quick"
[rule.guard.all.pressure]
eq = "false"
[rule.emit]
next = "inline"
why  = "Every cap holds and the REQ count is not yet written: run inline; Phase 0 writes req-list.md and the next re-ask reads it."

# ===========================================================================
# complete — the capsule's verdict
# ===========================================================================
#
# impl_orphans x impl_mvv_recorded x impl_open_decisions x suite_green =
# 48 cells (impl_open_decisions now carries `midline`). An unread ledger
# file stops first (nothing looked is not nothing wrong); then the
# prose's four conditions in its order: green tests, no orphans, MVV
# recorded, no open decisions. `midline` ranks exactly where `1+` ranks
# at every earlier gate — the count is unread either way — and is its
# own named stop once the other three gates have passed, because a
# rewrite is needed before the count can be trusted at all. One cell
# completes.

[[rule]]
id = "complete-coverage-unread"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
eq = "none"
[rule.emit]
next = "stopped:coverage-unread"
why  = "req-list.md or coverage.md was not read: the orphan check did not run, and a check that did not run is not a pass."

[[rule]]
id = "complete-deviations-unread"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
in = ["0", "1+"]
[rule.guard.all.impl_open_decisions]
eq = "none"
[rule.emit]
next = "stopped:deviations-unread"
why  = "deviations.md was not read: Phase 2 writes it even when empty, so an unread one is a missing artifact."

[[rule]]
id = "complete-suite-red"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
in = ["0", "1+"]
[rule.guard.all.impl_open_decisions]
in = ["0", "1+", "midline"]
[rule.guard.all.suite_green]
eq = "false"
[rule.emit]
next = "stopped:suite-red"
why  = "The last packet did not pass: no REQ-N has a green test until the suite is green."

[[rule]]
id = "complete-orphans"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
eq = "1+"
[rule.guard.all.impl_open_decisions]
in = ["0", "1+", "midline"]
[rule.guard.all.suite_green]
eq = "true"
[rule.emit]
next = "stopped:req-orphans"
why  = "coverage.md has an orphan: a REQ-N with no test, or a test with no REQ-N."

[[rule]]
id = "complete-mvv"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
eq = "0"
[rule.guard.all.impl_mvv_recorded]
eq = "false"
[rule.guard.all.impl_open_decisions]
in = ["0", "1+", "midline"]
[rule.guard.all.suite_green]
eq = "true"
[rule.emit]
next = "stopped:mvv-unrecorded"
why  = "coverage.md carries no `## REQ-MVV output`: the end-to-end run is not recorded."

[[rule]]
id = "complete-open-decisions"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
eq = "0"
[rule.guard.all.impl_mvv_recorded]
eq = "true"
[rule.guard.all.impl_open_decisions]
eq = "1+"
[rule.guard.all.suite_green]
eq = "true"
[rule.emit]
next = "stopped:open-decisions"
why  = "deviations.md still has a `Status: needs author decision` line not rewritten to RESOLVED."

[[rule]]
id = "complete-deviations-midline"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
eq = "0"
[rule.guard.all.impl_mvv_recorded]
eq = "true"
[rule.guard.all.impl_open_decisions]
eq = "midline"
[rule.guard.all.suite_green]
eq = "true"
[rule.emit]
next = "stopped:deviations-status-midline"
why  = "a deviations.md entry carries its Status mid-line (`**Type**: … **Status**: …`), so open decisions cannot be counted; rewrite each entry's Status as its own line-leading `Status: <value>` line (launch.md's grammar), then re-run the gate."

[[rule]]
id = "complete"
[rule.match.recognized]
eq = "complete"
[rule.guard.all.impl_orphans]
eq = "0"
[rule.guard.all.impl_mvv_recorded]
eq = "true"
[rule.guard.all.impl_open_decisions]
eq = "0"
[rule.guard.all.suite_green]
eq = "true"
[rule.emit]
next = "COMPLETE"
why  = "Every REQ-N has a green test, no orphans either way, REQ-MVV output recorded, no open decisions."

# ===========================================================================
# precheck — the record may be implemented
# ===========================================================================
#
# status x predecessors_state x baseline = 108 cells. Not Final stops first;
# then the predecessor gate in the prompt's own order: a predecessor that did
# not resolve, then one whose capsule is absent or not COMPLETE. `none` (no
# Predecessors field) counts as complete. The set behind the word is
# `predecessors_incomplete`, which the halt line names. Last, the baseline —
# the cheap reads having passed, the suite runs once: `none` re-asks with
# the result (`run-baseline`), `red` is a named stop (a regression cannot be
# told from a pre-existing failure), `green` proceeds.

[[rule]]
id = "precheck-not-final"
[rule.match.recognized]
eq = "precheck"
[rule.guard.unless.status]
eq = "Final"
[rule.emit]
next = "stopped:not-final"
why  = "Only a Final record implements: an unlocked record goes where /rdr-status routes it."

[[rule]]
id = "precheck-unresolved"
[rule.match.recognized]
eq = "precheck"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.predecessors_state]
eq = "unresolved"
[rule.emit]
next = "stopped:predecessor-unresolved"
why  = "A Predecessors entry names a record the records dir does not hold: correct the field, nothing else."

[[rule]]
id = "precheck-incomplete"
[rule.match.recognized]
eq = "precheck"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.predecessors_state]
eq = "incomplete"
[rule.emit]
next = "stopped:predecessor-incomplete"
why  = "A predecessor's capsule is absent or not COMPLETE; predecessors_incomplete names them — implement those first."

[[rule]]
id = "precheck-baseline-unrun"
[rule.match.recognized]
eq = "precheck"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.predecessors_state]
in = ["complete", "none"]
[rule.guard.all.baseline]
eq = "none"
[rule.emit]
next = "run-baseline"
why  = "Final and predecessors COMPLETE: run the full suite once before any test is written, then re-ask with baseline=green|red."

[[rule]]
id = "precheck-baseline-red"
[rule.match.recognized]
eq = "precheck"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.predecessors_state]
in = ["complete", "none"]
[rule.guard.all.baseline]
eq = "red"
[rule.emit]
next = "stopped:baseline-red"
why  = "The suite is red before this RDR writes a test: a regression could not be told from a pre-existing failure. Make the tree green, then re-run."

[[rule]]
id = "precheck-ok"
[rule.match.recognized]
eq = "precheck"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.predecessors_state]
in = ["complete", "none"]
[rule.guard.all.baseline]
eq = "green"
[rule.emit]
next = "proceed"
why  = "Final, every predecessor COMPLETE (or none declared), and the baseline green: the launch may run."

# ===========================================================================
# shard — the Phase 2 worklist, named once
# ===========================================================================
#
# impact_families = 3 cells, asked once by the orchestrator after Phase 1.
# Phase 0 wrote impact.md from `rdr impact` or halted, so an unread one is
# an artifact inconsistency (the Resume precheck's word), never an empty
# blast radius. The worklist is fixed here and every Phase 2 leg walks it
# from the position its brief carries: the Phase 1 tests, then each
# family in impact.md's file order (sharded only), then the full suite.

[[rule]]
id = "shard-impact-unread"
[rule.match.recognized]
eq = "shard"
[rule.guard.all.impact_families]
eq = "none"
[rule.emit]
next = "stopped:impact-unread"
why  = "impact.md was not read: Phase 0 writes it or halts, so an unread one is an artifact inconsistency, never an empty blast radius."

[[rule]]
id = "shard-single"
[rule.match.recognized]
eq = "shard"
[rule.guard.all.impact_families]
eq = "0"
[rule.emit]
next = "single"
why  = "No family predicted: the worklist is the Phase 1 tests, then the full suite."

[[rule]]
id = "shard-sharded"
[rule.match.recognized]
eq = "shard"
[rule.guard.all.impact_families]
eq = "1+"
[rule.emit]
next = "sharded"
why  = "Families predicted: the worklist is the Phase 1 tests, then impact.md's families in file order, then the full suite."

# ===========================================================================
# budget — when a Phase 2 leg returns
# ===========================================================================
#
# suite_green x elapsed x commits = 8 cells, asked by the Phase 2 leg after
# every commit and every suite run. Every dimension is observed from the
# world — the last suite exit, the clock, git — never remembered, so a
# long-context agent cannot mis-track them. Green returns whatever the
# caps say; over either cap, `return-partial` is the cut that replaces
# the harness's auto-compaction: a fresh leg resumes from the capsule
# instead of a compacted context re-reading its own state. Each row's
# `why` is the line the leg prints.

[[rule]]
id = "budget-green"
[rule.match.recognized]
eq = "budget"
[rule.guard.all.suite_green]
eq = "true"
[rule.emit]
next = "return-green"
why  = "The full suite is green: run REQ-MVV, record it, and return PASS."

[[rule]]
id = "budget-elapsed"
[rule.match.recognized]
eq = "budget"
[rule.guard.all.suite_green]
eq = "false"
[rule.guard.all.elapsed]
eq = "31+"
[rule.emit]
next = "return-partial"
why  = "Over 30 minutes on this leg: commit the tree, write the capsule's next: line, and return INCOMPLETE for a fresh leg to resume."

[[rule]]
id = "budget-commits"
[rule.match.recognized]
eq = "budget"
[rule.guard.all.suite_green]
eq = "false"
[rule.guard.all.elapsed]
eq = "0-30"
[rule.guard.all.commits]
eq = "6+"
[rule.emit]
next = "return-partial"
why  = "A 6th commit on this leg: commit the tree, write the capsule's next: line, and return INCOMPLETE for a fresh leg to resume."

[[rule]]
id = "budget-continue"
[rule.match.recognized]
eq = "budget"
[rule.guard.all.suite_green]
eq = "false"
[rule.guard.all.elapsed]
eq = "0-30"
[rule.guard.all.commits]
eq = "0-5"
[rule.emit]
next = "continue"
why  = "Red and under both caps: take the next worklist item."
