# rdr-facts.toml — the rdr-status signal table, as data.
#
# `skills/rdr-status/SKILL.md` answers "I lost my place — what do I run
# next?" by reading two things: the record's own projection, and what is
# on disk. Both halves used to be prose in that skill, re-derived by a
# model on every run. This file declares them, and `recs` evaluates them.
#
# A fact is one of two kinds:
#
#   probe — does an exact path exist? `root` names which tree it hangs
#           under and `path` is the whole remainder. There are NO globs
#           and no patterns: a probe names one path, or it does not
#           exist. Guessing a path is how a lens that ran reads as
#           un-run, and the flow's own rule is that a skipped check must
#           never read as a passed one — the inverse is just as wrong.
#
#   field — a projection path into `recs inspect --json`. The projector
#           already normalises emphasis, punctuation, qualifier grammars
#           and vocabulary tiers; a fact reads the field it publishes
#           rather than re-parsing the string it rendered.
#
# THREE-VALUED, like `resolved`. A probe whose root is bound answers true
# or false. A probe whose root is UNBOUND answers neither — the fact is
# absent from the output entirely. `--repo` set to the wrong tree is worse
# than `--repo` unset, for the same reason: false says "looked, not
# there", absent says "nothing looked", and only one of those is honest
# when no evidence root was bound.
#
# The names here are a CONTRACT. `models/rdr-status.toml` matches on them
# and neither binary calls the other, so a rename is a breaking change to
# a file in another repo. Values are strings, and every fact declares one
# of the four kinds that side accepts — enum, bool, int, set.

[facts]
version = 1
description = "rdr-status's signals: what the record says, and what is on disk."

# --- roots -----------------------------------------------------------------
#
# Two, and only two, because those are the two the seam binds absolutely.
#
# `evidence` is $RDR_EVIDENCE/<slug>/evidence/ — the per-RDR-first tree
# (rdr-common §evidence), where a lens folder's existence is the signal
# that the lens ran.
#
# `artifacts` is $RDR_RECORDS/<slug>/artifacts/ — the per-RDR artifact
# folder that sits beside the record, `{ARTIFACT_DIR}` as rdr-common
# §seam-bind states it. It is NOT read from $RDR_ENV: that file's
# `{ARTIFACT_DIR}` row is a cwd-relative string a consumer writes for a
# human, rdr-common says never to parse it, and on the reference consumer
# its value disagrees with where gate.md actually sits. A probe spells the
# whole remainder instead, so `gate.md` and `status.md` are each exactly
# what they say.
#
# `legacy` is the flat `<slug>/` the capsule and ledger were written to
# before `{ARTIFACT_DIR}` moved under `artifacts/`. It is read PER PATH
# and only where the path is missing under `suffix` — canonical first, so
# a record carrying both reads the current one, and a gate under the new
# tree beside a capsule under the old one still reads whole. A retained
# tolerance: drop it once the pre-move records are migrated.

[root.evidence]
var    = "RDR_EVIDENCE"
suffix = "{slug}/evidence"

[root.artifacts]
var    = "RDR_RECORDS"
suffix = "{slug}/artifacts"
legacy = "{slug}"

# `records` is $RDR_RECORDS itself — the directory, not a per-RDR subtree.
# It exists for the index README, which is the one shared document the
# facts read: it sits BESIDE the records rather than under any one of
# them, so no `{slug}` suffix can reach it.
[root.records]
var    = "RDR_RECORDS"
suffix = ""

# The evidence root itself, unsuffixed: the pre-migration shapes hang
# directly off it, keyed by slug, rather than under the record's folder.
[root.evidence-root]
var    = "RDR_EVIDENCE"
suffix = ""

# ===========================================================================
# Iteration — where a re-entry pass writes, declared rather than guessed
# ===========================================================================
#
# `recs paths` answers the two questions six skill and prompt sites used to
# hand-build: WHERE does this lens write, and WHICH iteration is next. Both
# were prose restated per site — the shape that produced a live defect when
# two of them named a directory the migration had moved, and nothing noticed
# because a wrong path reads as "the lens never ran".
#
# The convention is DATA and not a regex in the binary, for the reason the
# roots above are: this tool is pointed at more than one document family and
# more than one seam. The reference workspace alone binds two disjoint ones —
# a shared marker whose records and evidence live in different repos, and a
# repo-local marker where `RDR_EVIDENCE = RDR_RECORDS` collapses them into
# `<slug>/{evidence,artifacts}/`. Both work today only because the roots are
# declared. Teaching this file a third tree must stay a TOML edit.
#
# NOT A GLOB, and the distinction is the one the probe rule rests on. A probe
# names one path because guessing is how a lens that ran reads as un-run.
# `--next-iter` names nothing: it LISTS the directory and reports the segments
# it found. Nothing is predicted, the tree is asked — the same argument
# `cluster-member` already makes for reading `cluster-reconcile/` by name.
#
# NON-CONTIGUOUS IS REAL, so the answer carries what it saw. On the reference
# corpus `0122-0123-0130-0131-0132` holds `iter-3` with no `iter-2`. Next is
# 1 + the HIGHEST found, never the lowest absent: reusing a gap's number would
# file a later report under an earlier one and put a reader's history backwards.
# The segments found travel with the answer so the gap is visible rather than
# silently inherited.
[iteration]
# The segment a re-entry pass appends. `{n}` is the iteration, and it is a
# directory name — the whole vocabulary, so a tree that spells it otherwise
# is declared below rather than pattern-matched here.
segment = "iter-{n}"
# Iteration 1 is the LOOSE files directly under the base, not `iter-1/`.
# rdr-common §evidence states it and the corpus agrees: no `iter-1` exists
# anywhere. So a base holding files and no segment is iteration 1, and the
# next pass is 2.
first = "loose"

# The per-lens tree: `$RDR_EVIDENCE/<slug>/evidence/<lens>/`, the base a
# Stage-5 lens writes to and the one `--lens` selects.
# `cap` is the iteration past which a tree's loop is flapping, not
# progressing. `recs paths --next-iter` buckets ITER against it as
# ITER_BUCKET ("1".."cap", else "over"), the tag `models/rdr-loop.toml`
# routes on; a tree with no cap has no bucket. Data, so the cap a stage
# doc states and the one the loop enforces are one number.
[iteration.tree.lens]
root  = "evidence"
under = "{lens}"
cap   = 3

# Stage 7.1's tree, the one output NOT under the record: it is keyed by the
# cluster because one run reconciles a set and writes one directory for all
# of them. `{key}` is the members' numbers joined, which is what makes the
# key the membership — see `cluster_key` below, which reads these same
# directories by name.
[iteration.tree.cluster]
root  = "evidence-root"
under = "cluster-reconcile/{key}"
cap   = 3

# The per-RDR siblings that are not lenses. They take iterations by the same
# rule (07-finalize: "first run `tooling-pass.md`; re-runs `iter-N/`"), so
# they are declared rather than special-cased at the call site.
[iteration.tree.spikes]
root  = "evidence"
under = "spikes"

[iteration.tree.tooling-pass]
root  = "evidence"
under = "tooling-pass"
cap   = 3

# ===========================================================================
# The record half — fields off the projection
# ===========================================================================

# Stage 1's done-signal and the coarse position every routing decision
# starts from. `value` is the bare lifecycle status with any qualifier
# already split off.
[fact.status]
kind        = "enum"
source      = "field"
path        = "metadata.Status.status.value"
domain      = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
description = "The record's lifecycle Status, bare."

# The qualifier grammar, which is what distinguishes a plain Draft from a
# scoped re-entry and a plain Final from one waiting on a joint decision.
# The skill routes on the FORM, not on the qualifier prose: `revised-from`
# means /rdr-resolve self-scoped to the listed IDs, `joint-decision` means
# check the home before implement, `revisit-when` means parked.
#
# The issue that filed this called the domain bare|joint-decision|
# re-entry|deferred. Those are the four the routing cares about, but the
# projector emits model.QualifierForm, and inventing a second spelling of
# a vocabulary the reader already publishes is the drift the same-commit
# rule exists to stop. So the form is carried through verbatim and
# `status_reentry` / `status_parked` below name the two routing cases that
# do not fall out of the bare form.
[fact.status_form]
kind        = "enum"
source      = "field"
path        = "metadata.Status.status.form"
domain      = ["none", "demoted-target", "revised-from", "routed-back", "joint-decision", "revisit-when", "bracketed", "dash", "parenthetical"]
description = "Which qualifier grammar the Status matched (model.QualifierForm)."

# A scoped backward edge: `Draft [revised from Final <date>; re-verify
# <IDs>]`. Still a Draft for every binary gate, but the next command is
# /rdr-resolve, not the front-half stage the evidence would otherwise
# suggest — so the routing needs it as its own predicate.
# NARROWER THAN ITS NAME. It answers "was this demoted from a Final",
# not "is this a re-entry": a `routed-back` Draft is equally a re-entry
# and reads FALSE here, by construction — a bool fact takes one `equals`,
# and the two forms differ in what they owe (a demotion waits for the
# re-lock to clear it; a route-back is cleared by the stage it names).
# Nothing routes on this — `status_form` and `reentry_target` carry every
# routing decision and both span the two forms. Ask those, not this, when
# the question is "is this record re-entering".
[fact.status_reentry]
kind        = "bool"
source      = "field"
path        = "metadata.Status.status.form"
equals      = "revised-from"
description = "The Status is a scoped re-entry from Final (not the routed-back form — see status_form)."

# WHERE the re-entry lands. The 7.1 gate names a target stage (2 propose /
# 3 refine / 4 resolve) and the `@<stage>` slot of the qualifier —
# `re-verify A15, A17 @refine — <reason>`, grammar in TEMPLATE.md — is
# its machine-readable copy; the prose note alone routed every re-entry
# to /rdr-resolve, and a resolve that cannot close a contract edit is a
# full pass spent discovering it was Stage 3's. BOTH re-entry forms write
# this slot — `revised-from` (7.1's demotion) and `routed-back` (a
# mid-flow Draft sent backward) — which is why one `reentry` group routes
# them both. The domain is model.RouteBackTargets plus the sentinel;
# `prelock` and `reconcile` are reachable from `routed-back` only, since a
# Final has closed those stages.
#
# `none` is the ABSENT SENTINEL, not a fourth stage: a qualifier written
# before the slot existed, or one that omits it, has no target. The fact
# is absent in plain output (absent ≠ false), `--tags` renders `none`,
# and the routing table claims that cell with the resolve fallback that
# tells the human to read the note's TARGET RE-ENTRY STAGE.
[fact.reentry_target]
kind        = "enum"
source      = "field"
path        = "metadata.Status.status.reentry_target"
domain      = ["propose", "refine", "resolve", "prelock", "reconcile", "finalize", "none"]
absent      = "none"
description = "The `@<stage>` a scoped re-entry names; `none` when the qualifier carries no target."

# Parked, not terminal: no post-mortem is owed and no next command is due
# while the condition holds. A park that nobody re-reads is how a park
# becomes an abandon by default, so this is a fact and not a footnote.
[fact.status_parked]
kind        = "bool"
source      = "field"
path        = "metadata.Status.status.form"
equals      = "revisit-when"
description = "The Status is Deferred with a revisit condition."

# The joint decisions this record is still waiting on, and only those —
# read off the field, never scraped from the qualifier. A record that has
# FINISHED answering its joint decisions writes them down, and a regex
# over the prose reports a finished record as blocked (README §A field,
# not a regex).
[fact.open_joint_decisions]
kind        = "set"
source      = "field"
path        = "metadata.Status.status.open_joint_decisions"
description = "Joint decisions still open on this record, from the routing form alone."

# The routing latch. `Profile`'s value carries the keyword PLUS a
# rationale tail — `mid — one contract plus the metrics surface` — and
# §lens-row is explicit that a consumer matches the leading word and never
# the whole string. That is the projection missing a field, so the fact
# carries the leading word and `profile_raw` keeps the sentence.
#
# `none` is the ABSENT SENTINEL, not a fifth profile. A record with no
# Profile field is a real corpus state (0033 today), and §lens-row is
# explicit that it is a stop-packet rather than a default — "No `Profile`
# entry = the field is absent: that is a §stop-packet, not a default."
# The sentinel is what lets the routing table SAY that: `--tags` always
# renders the key, and the model claims the `none` cell with a row that
# stops. See the `absent` note in `[fact.cluster]` below for why a
# routing dimension cannot simply go missing.
[fact.profile]
kind        = "enum"
source      = "field"
path        = "metadata.Profile.value"
transform   = "leading-word"
domain      = ["small", "mid", "large", "foundational", "none"]
absent      = "none"
description = "The Profile keyword that selects the Stage-5 lens row."

# PROSE, and the only fact so marked. The rationale tail is a sentence an
# author wrote for a reader — on the reference corpus, 91 records of 144
# carry one — so it is a JSON string in `--json` and is not rendered as a
# tag at all. A tag crosses through an unquoted `$(recs status --tags …)`,
# which splits on whitespace and globs the pieces, so this value would
# arrive as `profile_raw=mid`: a well-formed tag with a silently
# truncated value, and a caller routing on words the record never said.
# `profile` carries the routing half; nothing routes on the sentence.
[fact.profile_raw]
kind        = "scalar"
source      = "field"
path        = "metadata.Profile.value"
prose       = true
description = "Profile verbatim, rationale tail included, for the caveat line."

# The record's own length, bucketed at the Stage-8 size gate's cap. It is
# the number `inspect` reports as top-level `lines`; the gate used to read
# that projection and compare it in prose, and a routing row cannot — a
# dimension is a member, never an inequality. Every record has a length,
# so this is never absent and declares no sentinel.
[fact.lines]
kind        = "enum"
source      = "record-lines"
domain      = ["0-400", "401+"]
description = "The record's line count, bucketed at the size gate's 400-line cap."

# --- the accretion floor's inputs ------------------------------------------
#
# The Seam Lineage field carries a point-fix count and, when the author
# escapes the floor, an `Accretion disposition:` line. The floor — a
# count of two or more with no disposition floors Profile at foundational
# — was a mechanical count a reader re-derived at four stages; it is now
# the `floor` outcome of rdr-status.toml, and these three facts are what
# its rows read. NOTHING here compares the count to two: the row does.
#
# The projector reads the count against the template's form
# (model.SeamLineageCount): `Nth point-fix`, `N prior point-fixes`,
# `Count = N`, or `no prior accretion` as zero. A field that spells its
# count some other way is UNREAD — a real value of the bucket, and a
# stop in the table, because a count the grammar did not read is one a
# reader would have to guess. Measured on the reference corpus: 84
# records carry the field, 73 read, 10 unread (all terminal), 1 a seed
# placeholder.
#
# `seam_lineage_count` is the number, for the reader and the caveat
# line; it routes nothing directly and goes absent with the field, like
# `contracts`. `seam_lineage` is the bucket the rows guard on — `0`,
# `1`, `2+`, `unread` — with `none` as the ABSENT SENTINEL for a record
# that carries no field, which every record older than the field is.
# `accretion_disposition` is whether the escape line is written, in the
# value or as the template's nested bullet; a field without one answers
# false, and a record without the field takes the sentinel `false` —
# the rows never read it under `seam_lineage = none` anyway.
[fact.seam_lineage_count]
kind        = "int"
source      = "seam-lineage"
select      = "count"
min         = 0
description = "The point-fix count Seam Lineage carries; absent when there is no field or no readable count."

[fact.seam_lineage]
kind        = "enum"
source      = "seam-lineage"
select      = "bucket"
domain      = ["0", "1", "2+", "unread", "none"]
absent      = "none"
description = "seam_lineage_count bucketed for the floor rows; `unread` is a written count in no declared form, `none` is no field."

[fact.accretion_disposition]
kind        = "bool"
source      = "seam-lineage"
select      = "disposition"
absent      = "false"
description = "An `Accretion disposition:` line is written in Seam Lineage, inline or as its nested bullet."

# The Stage-5 Determinacy trigger reads the labelled contract count. A
# ZERO does not skip the trigger — contracts written as prose are
# unaddressable and count zero, so on an older record zero means
# *unlabelled*, not *absent*, and the section's lines have to be read.
# The fact reports the count; judging it stays with the skill.
[fact.contracts]
kind        = "int"
source      = "field"
path        = "counts.elements.C"
min         = 0
description = "Labelled Normative Contracts. Zero may mean unlabelled, not absent."

# The Profile contract axis, as the `profile` rows of rdr-write.toml read
# it. TEMPLATE.md's Transient marker (`Transient — scheduled deletion by
# <sibling>, …`) says a marked contract counts toward neither the axis
# nor the split signal, and its Surface marker (`Surface — of Cn; …`)
# says a fence that only enforces another contract here counts as its
# root; the projector reads both (scan Element.Transient, .SurfaceOf)
# and SUBTRACTS here, once, so no row and no stage does the arithmetic.
# `contracts_transient` and `contracts_surface` are the numbers, for the
# reader; `contracts_durable` is the bucket the rows guard on. A Surface
# whose root does not resolve stays counted, so the record stops rather
# than sizes. A record whose contracts are prose has no labelled
# elements and reads `0` durable — `contracts_prose` is what the rows
# read beside it, so the unlabelled case stops by name rather than
# sizing as empty.
[fact.contracts_transient]
kind        = "int"
source      = "contracts"
select      = "transient"
min         = 0
description = "Labelled Normative Contracts carrying the Transient marker."

[fact.contracts_surface]
kind        = "int"
source      = "contracts"
select      = "surface"
min         = 0
description = "Labelled Normative Contracts carrying a Surface marker whose root resolves to a contract in this record."

[fact.contracts_durable]
kind        = "enum"
source      = "contracts"
select      = "durable"
domain      = ["0", "1", "2+"]
absent      = "0"
description = "Labelled contracts minus Transient- and Surface-marked, bucketed for the profile rows; the subtraction is the projector's."

# Declared tandem siblings. The Stage-2 tandem barrier bars a clustered
# Draft from refine until every member has completed propose, so whether
# the field is present is itself routing.
#
# `absent = "[]"` — the empty set — because the tandem barrier reads "is
# this record clustered", and an undeclared Cluster field answers no.
#
# WHY A SENTINEL AT ALL, for this fact and the two others that carry one.
# Absence is honest in `--json`, where a reader sees three values and the
# key is simply not there. It cannot survive `--tags`: a resolver's argv
# has no spelling for "this key is absent". A routing table that
# discriminates on a dimension must therefore always receive it —
# declaring the dimension optional withholds the coverage proof at lint
# (the claim a partial table cannot make), and an absent value under a
# guard atom refuses at resolve rather than routing. Either way the
# navigator would stop on a record whose field is merely unwritten.
#
# So the three facts a routing table discriminates on — `profile`,
# `cluster`, `joint_checks` — declare the value absence takes, and the
# sentinel is a declared member of the fact's own domain so the table
# claims that cell positively instead of defaulting into it. Every other
# fact keeps three-valued absence untouched; a sentinel is a deliberate
# act per fact, never a table-wide default.
[fact.cluster]
kind        = "set"
source      = "field"
path        = "metadata.Cluster.value"
transform   = "record-numbers"
absent      = "[]"
description = "Sibling record numbers from the Cluster field, if declared."

# WHETHER the record is clustered, as opposed to with whom.
#
# A set cannot be a routing dimension: its domain is a power set, not a
# partition, so no table can enumerate its cells. But the two clauses
# that read the Cluster field only ever ask this yes/no — Stage 7.1
# applies "only when the RDR is in a cluster", and the Stage-2 tandem
# barrier fires on a Draft that DECLARES siblings. Deriving it here keeps
# that question answerable by a rule, and keeps every consumer from
# re-deriving it from the members.
#
# It is a separate fact rather than a reading of `cluster` because the
# two answer different questions and `cluster` is still what the skill
# surfaces: an unreconciled clustered Final has to name its peers.
[fact.clustered]
kind        = "bool"
source      = "field"
path        = "metadata.Cluster.value"
transform   = "record-numbers-any"
absent      = "false"
description = "The record declares Cluster siblings — the tandem barrier's and Stage 7.1's precondition."

# --- Critical Assumption tallies ------------------------------------------
#
# Stage 4's primary signal, and Stage 3's only certificate. The tallies
# come off the projection's A elements, each one's Evidence Record Status
# already normalised: `**Verified**`, `Verified.`, `REFUTED (…)` and
# `Verified as narrowed — …` all land on their vocabulary label.
#
# Placeholders are counted SEPARATELY and never as Pending. A Draft that
# still carries the template legend `Verified | Pending | Unverified`
# projects a placeholder with an empty value; folding those into Pending
# would report a seeded record as having a real un-run assumption list,
# and folding them into nothing would hide that the list is unfilled.

[fact.ca_total]
kind        = "int"
source      = "ca-tally"
select      = "total"
min         = 0
description = "Critical Assumptions carrying an Evidence Record Status."

[fact.ca_verified]
kind        = "int"
source      = "ca-tally"
select      = "Verified"
min         = 0
description = "Assumptions at Verified."

[fact.ca_pending]
kind        = "int"
source      = "ca-tally"
select      = "Pending"
min         = 0
description = "Assumptions at Pending."

[fact.ca_unverified]
kind        = "int"
source      = "ca-tally"
select      = "Unverified"
min         = 0
description = "Assumptions at Unverified."

# Refuted, Resolved, Accepted and Downgraded are ObservedAccepted: the
# corpus writes them, the template never listed them. They are terminal
# verdicts — an assumption the flow is done with — so they are tallied
# together rather than silently dropped into neither column.
[fact.ca_other_terminal]
kind        = "int"
source      = "ca-tally"
select      = "observed-terminal"
min         = 0
description = "Assumptions at a corpus-only terminal verdict (Refuted/Resolved/Accepted/Downgraded)."

[fact.ca_placeholder]
kind        = "int"
source      = "ca-tally"
select      = "placeholder"
min         = 0
description = "Assumptions still carrying the template legend — an unfilled list, not a Pending one."

# An assumption status in no tier at all. It is a typo the gate exists to
# report, and naming it in a tally keeps it from reading as terminal.
[fact.ca_off_vocabulary]
kind        = "int"
source      = "ca-tally"
select      = "off-vocabulary"
min         = 0
description = "Assumptions whose Status matches no vocabulary label."

# The rolled-up shape the routing actually branches on.
#
#   all-pending   — every assumption Pending: Refine is un-run, and the
#                   open `~` is the next command, not a footnote.
#   mixed         — some terminal, some not.
#   all-terminal  — every assumption Verified or a terminal verdict:
#                   Resolve is behind you whether or not a folder exists.
#   unknown-plan  — the list is unfilled or unreadable (placeholders, an
#                   off-vocabulary value, or no assumptions at all), so
#                   the tallies cannot certify a stage. Never guess here:
#                   an unreadable list is not an empty one.
[fact.ca]
kind        = "enum"
source      = "ca-rollup"
domain      = ["all-pending", "mixed", "all-terminal", "unknown-plan"]
description = "The Critical Assumption list rolled up to the shape Stage 3/4 routing reads."

# --- Decision Rationale verdict lines --------------------------------------
#
# Stage 2's gate items. `Joint-check:` IS projected — it is a JC element
# with a parsed verdict, targets, home and open flag — so it is a field.
# `Premortem:` and `Ground-sweep:` are not projected at all, and a byte
# read of §decision-rationale is the only way to see them. Their absence
# alone does not reopen propose on a legacy record, but a skipped gate
# item must be surfaced rather than read as a passed one.

# `absent = "0"` reads the same way a zero does here, and that is not the
# conflation it looks like: the fact counts PROJECTED JC elements, so a
# record with no Joint-check: line and a record whose section holds none
# are the same record to every consumer. Contrast `contracts`, where zero
# may mean *unlabelled* rather than absent — which is why that fact
# carries no sentinel and nothing routes on it directly.
[fact.joint_checks]
kind        = "int"
source      = "field"
path        = "counts.elements.JC"
min         = 0
absent      = "0"
description = "Joint-check: lines, projected as JC elements."

# The lock's reading of the Joint-check lines, folded worst-first. A fire
# is `homed` only when every `|` segment of its `(home: …)` minted a
# joint-decision-home edge that resolved TRUE; `unhomed` is a written home
# that names no ref, or one that resolved false or was never looked for —
# the propose gate's own "false or absent is not a pass". `open` is a
# legal propose-time value the lock refuses; `unhomed` locks but stays
# on the vector, since a consumer's joint-decision register may sit
# outside the records dir where no ref resolves. `none` is the ABSENT
# SENTINEL: no Joint-check line at all, which the lock does not read as
# clear and which rdr-status already surfaces through `joint_checks`.
[fact.joint_check_home]
kind        = "enum"
source      = "joint-check-home"
domain      = ["none", "clear", "homed", "open", "unhomed"]
absent      = "none"
description = "Worst Joint-check line at lock: clear, homed (every home ref resolved), open, or unhomed (a home nothing resolves); none when no line is written."

# Propose's arms 1 and 2 (`index --anchor-intersect|--literal-intersect
# --record`) re-run at lock over the in-flight corpus: `1+` when any pair
# touching this record has no cross-citation — a fire nobody wrote, or a
# `clear` that a later peer made stale. ON DEMAND: it walks the corpus
# (~2s). `unchecked` is the sentinel for no corpus bound.
[fact.overlap_uncited]
kind        = "enum"
source      = "overlap-uncited"
on_demand   = true
domain      = ["0", "1+", "unchecked"]
absent      = "unchecked"
description = "Open-peer overlap pairs (shared anchor or contract literal) touching this record with no cross-citation: 0, 1+, or unchecked."

[fact.premortem_line]
