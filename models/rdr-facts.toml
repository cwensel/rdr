# rdr-facts.toml — the rdr-status signal table, as data.
#
# `skills/rdr-status/SKILL.md` answers "I lost my place — what do I run
# next?" by reading two things: the record's own projection, and what is
# on disk. Both halves used to be prose in that skill, re-derived by a
# model on every run. This file declares them, and `rdr` evaluates them.
#
# A fact is one of two kinds:
#
#   probe — does an exact path exist? `root` names which tree it hangs
#           under and `path` is the whole remainder. There are NO globs
#           and no patterns: a probe names one path, or it does not
#           exist. Guessing a path is how a lens that ran reads as
#           un-run, and the flow's own rule is that a skipped check must
#           never read as a passed one — the inverse is just as wrong.
#
#   field — a projection path into `rdr inspect --json`. The projector
#           already normalises emphasis, punctuation, qualifier grammars
#           and vocabulary tiers; a fact reads the field it publishes
#           rather than re-parsing the string it rendered.
#
# THREE-VALUED, like `resolved`. A probe whose root is bound answers true
# or false. A probe whose root is UNBOUND answers neither — the fact is
# absent from the output entirely. `--repo` set to the wrong tree is worse
# than `--repo` unset, for the same reason: false says "looked, not
# there", absent says "nothing looked", and only one of those is honest
# when no evidence root was bound.
#
# The names here are a CONTRACT. `models/rdr-status.toml` matches on them
# and neither binary calls the other, so a rename is a breaking change to
# a file in another repo. Values are strings, and every fact declares one
# of the four kinds that side accepts — enum, bool, int, set.

[facts]
version = 1
description = "rdr-status's signals: what the record says, and what is on disk."

# --- roots -----------------------------------------------------------------
#
# Two, and only two, because those are the two the seam binds absolutely.
#
# `evidence` is $RDR_EVIDENCE/<slug>/evidence/ — the per-RDR-first tree
# (rdr-common §evidence), where a lens folder's existence is the signal
# that the lens ran.
#
# `artifacts` is $RDR_RECORDS/<slug>/ — the per-RDR artifact folder that
# sits beside the record. It is NOT read from $RDR_ENV: that file's
# `{ARTIFACT_DIR}` row is a cwd-relative string a consumer writes for a
# human, rdr-common says never to parse it, and on the reference consumer
# its value disagrees with where gate.md actually sits. A probe spells the
# whole remainder instead, so `artifacts/gate.md` and `status.md` are each
# exactly what they say.

[root.evidence]
var    = "RDR_EVIDENCE"
suffix = "{slug}/evidence"

[root.artifacts]
var    = "RDR_RECORDS"
suffix = "{slug}"

# The evidence root itself, unsuffixed: the pre-migration shapes hang
# directly off it, keyed by slug, rather than under the record's folder.
[root.evidence-root]
var    = "RDR_EVIDENCE"
suffix = ""

# ===========================================================================
# The record half — fields off the projection
# ===========================================================================

# Stage 1's done-signal and the coarse position every routing decision
# starts from. `value` is the bare lifecycle status with any qualifier
# already split off.
[fact.status]
kind        = "enum"
source      = "field"
path        = "metadata.Status.status.value"
domain      = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
description = "The record's lifecycle Status, bare."

# The qualifier grammar, which is what distinguishes a plain Draft from a
# scoped re-entry and a plain Final from one waiting on a joint decision.
# The skill routes on the FORM, not on the qualifier prose: `revised-from`
# means /rdr-resolve self-scoped to the listed IDs, `joint-decision` means
# check the home before implement, `revisit-when` means parked.
#
# The issue that filed this called the domain bare|joint-decision|
# re-entry|deferred. Those are the four the routing cares about, but the
# projector emits model.QualifierForm, and inventing a second spelling of
# a vocabulary the reader already publishes is the drift the same-commit
# rule exists to stop. So the form is carried through verbatim and
# `status_reentry` / `status_parked` below name the two routing cases that
# do not fall out of the bare form.
[fact.status_form]
kind        = "enum"
source      = "field"
path        = "metadata.Status.status.form"
domain      = ["none", "demoted-target", "revised-from", "joint-decision", "revisit-when", "bracketed", "dash", "parenthetical"]
description = "Which qualifier grammar the Status matched (model.QualifierForm)."

# A scoped backward edge: `Draft [revised from Final <date>; re-verify
# <IDs>]`. Still a Draft for every binary gate, but the next command is
# /rdr-resolve, not the front-half stage the evidence would otherwise
# suggest — so the routing needs it as its own predicate.
[fact.status_reentry]
kind        = "bool"
source      = "field"
path        = "metadata.Status.status.form"
equals      = "revised-from"
description = "The Status is a scoped re-entry from Final."

# Parked, not terminal: no post-mortem is owed and no next command is due
# while the condition holds. A park that nobody re-reads is how a park
# becomes an abandon by default, so this is a fact and not a footnote.
[fact.status_parked]
kind        = "bool"
source      = "field"
path        = "metadata.Status.status.form"
equals      = "revisit-when"
description = "The Status is Deferred with a revisit condition."

# The joint decisions this record is still waiting on, and only those —
# read off the field, never scraped from the qualifier. A record that has
# FINISHED answering its joint decisions writes them down, and a regex
# over the prose reports a finished record as blocked (README §A field,
# not a regex).
[fact.open_joint_decisions]
kind        = "set"
source      = "field"
path        = "metadata.Status.status.open_joint_decisions"
description = "Joint decisions still open on this record, from the routing form alone."

# The routing latch. `Profile`'s value carries the keyword PLUS a
# rationale tail — `mid — one contract plus the metrics surface` — and
# §lens-row is explicit that a consumer matches the leading word and never
# the whole string. That is the projection missing a field, so the fact
# carries the leading word and `profile_raw` keeps the sentence.
#
# `none` is the ABSENT SENTINEL, not a fifth profile. A record with no
# Profile field is a real corpus state (0033 today), and §lens-row is
# explicit that it is a stop-packet rather than a default — "No `Profile`
# entry = the field is absent: that is a §stop-packet, not a default."
# The sentinel is what lets the routing table SAY that: `--tags` always
# renders the key, and the model claims the `none` cell with a row that
# stops. See the `absent` note in `[fact.cluster]` below for why a
# routing dimension cannot simply go missing.
[fact.profile]
kind        = "enum"
source      = "field"
path        = "metadata.Profile.value"
transform   = "leading-word"
domain      = ["small", "mid", "large", "foundational", "none"]
absent      = "none"
description = "The Profile keyword that selects the Stage-5 lens row."

# PROSE, and the only fact so marked. The rationale tail is a sentence an
# author wrote for a reader — on the reference corpus, 91 records of 144
# carry one — so it is a JSON string in `--json` and is not rendered as a
# tag at all. A tag crosses through an unquoted `$(rdr status --tags …)`,
# which splits on whitespace and globs the pieces, so this value would
# arrive as `profile_raw=mid`: a well-formed tag with a silently
# truncated value, and a caller routing on words the record never said.
# `profile` carries the routing half; nothing routes on the sentence.
[fact.profile_raw]
kind        = "scalar"
source      = "field"
path        = "metadata.Profile.value"
prose       = true
description = "Profile verbatim, rationale tail included, for the caveat line."

# The Stage-5 Determinacy trigger reads the labelled contract count. A
# ZERO does not skip the trigger — contracts written as prose are
# unaddressable and count zero, so on an older record zero means
# *unlabelled*, not *absent*, and the section's lines have to be read.
# The fact reports the count; judging it stays with the skill.
[fact.contracts]
kind        = "int"
source      = "field"
path        = "counts.elements.C"
min         = 0
description = "Labelled Normative Contracts. Zero may mean unlabelled, not absent."

# Declared tandem siblings. The Stage-2 tandem barrier bars a clustered
# Draft from refine until every member has completed propose, so whether
# the field is present is itself routing.
#
# `absent = "[]"` — the empty set — because the tandem barrier reads "is
# this record clustered", and an undeclared Cluster field answers no.
#
# WHY A SENTINEL AT ALL, for this fact and the two others that carry one.
# Absence is honest in `--json`, where a reader sees three values and the
# key is simply not there. It cannot survive `--tags`: a resolver's argv
# has no spelling for "this key is absent". A routing table that
# discriminates on a dimension must therefore always receive it —
# declaring the dimension optional withholds the coverage proof at lint
# (the claim a partial table cannot make), and an absent value under a
# guard atom refuses at resolve rather than routing. Either way the
# navigator would stop on a record whose field is merely unwritten.
#
# So the three facts a routing table discriminates on — `profile`,
# `cluster`, `joint_checks` — declare the value absence takes, and the
# sentinel is a declared member of the fact's own domain so the table
# claims that cell positively instead of defaulting into it. Every other
# fact keeps three-valued absence untouched; a sentinel is a deliberate
# act per fact, never a table-wide default.
[fact.cluster]
kind        = "set"
source      = "field"
path        = "metadata.Cluster.value"
transform   = "record-numbers"
absent      = "[]"
description = "Sibling record numbers from the Cluster field, if declared."

# WHETHER the record is clustered, as opposed to with whom.
#
# A set cannot be a routing dimension: its domain is a power set, not a
# partition, so no table can enumerate its cells. But the two clauses
# that read the Cluster field only ever ask this yes/no — Stage 7.1
# applies "only when the RDR is in a cluster", and the Stage-2 tandem
# barrier fires on a Draft that DECLARES siblings. Deriving it here keeps
# that question answerable by a rule, and keeps every consumer from
# re-deriving it from the members.
#
# It is a separate fact rather than a reading of `cluster` because the
# two answer different questions and `cluster` is still what the skill
# surfaces: an unreconciled clustered Final has to name its peers.
[fact.clustered]
kind        = "bool"
source      = "field"
path        = "metadata.Cluster.value"
transform   = "record-numbers-any"
absent      = "false"
description = "The record declares Cluster siblings — the tandem barrier's and Stage 7.1's precondition."

# --- Critical Assumption tallies ------------------------------------------
#
# Stage 4's primary signal, and Stage 3's only certificate. The tallies
# come off the projection's A elements, each one's Evidence Record Status
# already normalised: `**Verified**`, `Verified.`, `REFUTED (…)` and
# `Verified as narrowed — …` all land on their vocabulary label.
#
# Placeholders are counted SEPARATELY and never as Pending. A Draft that
# still carries the template legend `Verified | Pending | Unverified`
# projects a placeholder with an empty value; folding those into Pending
# would report a seeded record as having a real un-run assumption list,
# and folding them into nothing would hide that the list is unfilled.

[fact.ca_total]
kind        = "int"
source      = "ca-tally"
select      = "total"
min         = 0
description = "Critical Assumptions carrying an Evidence Record Status."

[fact.ca_verified]
kind        = "int"
source      = "ca-tally"
select      = "Verified"
min         = 0
description = "Assumptions at Verified."

[fact.ca_pending]
kind        = "int"
source      = "ca-tally"
select      = "Pending"
min         = 0
description = "Assumptions at Pending."

[fact.ca_unverified]
kind        = "int"
source      = "ca-tally"
select      = "Unverified"
min         = 0
description = "Assumptions at Unverified."

# Refuted, Resolved, Accepted and Downgraded are ObservedAccepted: the
# corpus writes them, the template never listed them. They are terminal
# verdicts — an assumption the flow is done with — so they are tallied
# together rather than silently dropped into neither column.
[fact.ca_other_terminal]
kind        = "int"
source      = "ca-tally"
select      = "observed-terminal"
min         = 0
description = "Assumptions at a corpus-only terminal verdict (Refuted/Resolved/Accepted/Downgraded)."

[fact.ca_placeholder]
kind        = "int"
source      = "ca-tally"
select      = "placeholder"
min         = 0
description = "Assumptions still carrying the template legend — an unfilled list, not a Pending one."

# An assumption status in no tier at all. It is a typo the gate exists to
# report, and naming it in a tally keeps it from reading as terminal.
[fact.ca_off_vocabulary]
kind        = "int"
source      = "ca-tally"
select      = "off-vocabulary"
min         = 0
description = "Assumptions whose Status matches no vocabulary label."

# The rolled-up shape the routing actually branches on.
#
#   all-pending   — every assumption Pending: Refine is un-run, and the
#                   open `~` is the next command, not a footnote.
#   mixed         — some terminal, some not.
#   all-terminal  — every assumption Verified or a terminal verdict:
#                   Resolve is behind you whether or not a folder exists.
#   unknown-plan  — the list is unfilled or unreadable (placeholders, an
#                   off-vocabulary value, or no assumptions at all), so
#                   the tallies cannot certify a stage. Never guess here:
#                   an unreadable list is not an empty one.
[fact.ca]
kind        = "enum"
source      = "ca-rollup"
domain      = ["all-pending", "mixed", "all-terminal", "unknown-plan"]
description = "The Critical Assumption list rolled up to the shape Stage 3/4 routing reads."

# --- Decision Rationale verdict lines --------------------------------------
#
# Stage 2's gate items. `Joint-check:` IS projected — it is a JC element
# with a parsed verdict, targets, home and open flag — so it is a field.
# `Premortem:` and `Ground-sweep:` are not projected at all, and a byte
# read of §decision-rationale is the only way to see them. Their absence
# alone does not reopen propose on a legacy record, but a skipped gate
# item must be surfaced rather than read as a passed one.

# `absent = "0"` reads the same way a zero does here, and that is not the
# conflation it looks like: the fact counts PROJECTED JC elements, so a
# record with no Joint-check: line and a record whose section holds none
# are the same record to every consumer. Contrast `contracts`, where zero
# may mean *unlabelled* rather than absent — which is why that fact
# carries no sentinel and nothing routes on it directly.
[fact.joint_checks]
kind        = "int"
source      = "field"
path        = "counts.elements.JC"
min         = 0
absent      = "0"
description = "Joint-check: lines, projected as JC elements."

[fact.premortem_line]
kind        = "bool"
source      = "verdict-line"
label       = "Premortem:"
description = "A Premortem: verdict line is written in Decision Rationale."

[fact.ground_sweep_line]
kind        = "bool"
source      = "verdict-line"
label       = "Ground-sweep:"
description = "A Ground-sweep: verdict line is written in Decision Rationale."

# ===========================================================================
# The disk half — exact-path probes
# ===========================================================================
#
# Every path below is `<root>/<exact remainder>`. A lens FOLDER says the
# lens ran; the files inside say it finished. The two are separate facts
# on purpose — §lens-row is explicit that a bare folder is not completion.

# --- lens folders: the lens ran -------------------------------------------

[fact.lens_grounding]
kind = "bool"
source = "probe"
root = "evidence"
path = "grounding"
description = "The grounding lens ran."

[fact.lens_3amigo]
kind = "bool"
source = "probe"
root = "evidence"
path = "3amigo"
description = "The 3amigo lens ran."

[fact.lens_critique]
kind = "bool"
source = "probe"
root = "evidence"
path = "critique"
description = "The critique lens ran."

[fact.lens_repeatability]
kind = "bool"
source = "probe"
root = "evidence"
path = "repeatability"
description = "The repeatability lens ran."

[fact.lens_cove]
kind = "bool"
source = "probe"
root = "evidence"
path = "cove"
description = "The cove lens ran."

# --- lens completion: the lens finished ------------------------------------
#
# Each lens names its own product, and they differ: grounding and cove
# write findings.md, 3amigo writes consolidation.md beside its three
# personas, critique writes critique.md. A single generic "the lens is
# done" probe would be wrong for four of the five.

[fact.lens_grounding_findings]
kind = "bool"
source = "probe"
root = "evidence"
path = "grounding/findings.md"
description = "grounding produced its findings."

[fact.lens_cove_findings]
kind = "bool"
source = "probe"
root = "evidence"
path = "cove/findings.md"
description = "cove produced its findings."

[fact.lens_3amigo_consolidation]
kind = "bool"
source = "probe"
root = "evidence"
path = "3amigo/consolidation.md"
description = "3amigo consolidated its three personas."

[fact.lens_critique_single]
kind = "bool"
source = "probe"
root = "evidence"
path = "critique/critique.md"
description = "critique produced a first-model pass."

# `critique` on a foundational RDR owes the DUAL-MODEL diff, not just
# critique.md: a lone single-model file is in-progress, not done
# (rdr-common §model-stamp). Folder existence proves a lens ran, never
# which model ran it, and for the cross-model lenses that identity is the
# whole signal.
[fact.lens_critique_modelb]
kind = "bool"
source = "probe"
root = "evidence"
path = "critique/critique-modelB.md"
description = "critique ran a second base model."

[fact.lens_critique_diff]
kind = "bool"
source = "probe"
root = "evidence"
path = "critique/diff.md"
description = "critique's two model passes were diffed."

# repeatability's variant follows Profile, not the files present:
# mid/large = lite (run-1 then a focused RDR-vs-run diff);
# foundational/escalation = full (run-1/2/3 then diff). Both owe the diff.
# Probing each run separately is what lets the routing point at the next
# missing piece for the variant the Profile selects, rather than at a
# folder that is merely non-empty.
[fact.lens_repeatability_run1]
kind = "bool"
source = "probe"
root = "evidence"
path = "repeatability/run-1.md"
description = "repeatability run 1."

[fact.lens_repeatability_run2]
kind = "bool"
source = "probe"
root = "evidence"
path = "repeatability/run-2.md"
description = "repeatability run 2 — the full variant only."

[fact.lens_repeatability_run3]
kind = "bool"
source = "probe"
root = "evidence"
path = "repeatability/run-3.md"
description = "repeatability run 3 — the full variant only."

[fact.lens_repeatability_diff]
kind = "bool"
source = "probe"
root = "evidence"
path = "repeatability/diff.md"
description = "repeatability's runs were diffed — owed by both variants."

# --- the non-lens siblings -------------------------------------------------

# Stage 2's hardened-critic output. A sibling, never a Stage-5 lens
# signal: counting it toward lens convergence would certify a Pre-Lock row
# from a Propose artifact.
[fact.propose_premortem]
kind = "bool"
source = "probe"
root = "evidence"
path = "propose-premortem"
description = "Stage 2's premortem critic wrote output. NOT a Stage-5 lens."

# Stage 4 writes an evidence folder only when it names spikes. A pure
# source-search resolve records its verdicts inline and creates no folder
# at all, so an absent spikes dir is expected, not a sign Resolve is
# un-run — the CA tallies are the authority there.
[fact.spikes]
kind = "bool"
source = "probe"
root = "evidence"
path = "spikes"
description = "Spikes were run. Absence does not mean Resolve is un-run."

# Stage 7. The folder existing also certifies the last lens's resolution,
# which is why it is a fact the Pre-Lock row reads too.
[fact.reconcile]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile"
description = "The reconcile folder exists — also certifies the last lens's resolution."

# The reconcile report has three spellings in the corpus and no glob may
# guess between them, so each is its own probe and the routing takes the
# disjunction. A bare reconcile folder with none of them is a real state:
# the stage started and left no report.
[fact.reconcile_report]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile/reconcile.md"
description = "The reconcile report, canonical spelling."

[fact.reconcile_report_alt]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile/report.md"
description = "The reconcile report, second corpus spelling."

[fact.reconcile_report_alt2]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile/reconcile-report.md"
description = "The reconcile report, third corpus spelling."

# A re-entry pass appends iter-N/ beside the loose iteration-1 files. Two
# is the one that says a lens was re-entered at all; deeper iterations are
# the same signal and the skill reports the highest it finds.
[fact.iter_2]
kind = "bool"
source = "probe-any"
root = "evidence"
paths = [
  "grounding/iter-2",
  "3amigo/iter-2",
  "critique/iter-2",
  "repeatability/iter-2",
  "cove/iter-2",
  "reconcile/iter-2",
]
description = "Some lens was re-entered for a second iteration."

# The pre-migration evidence shapes, probed so that a legacy folder can
# never silently read as "lens un-run".
#
# The migration moved directory-shaped evidence under the record it
# belongs to and left FILE-shaped evidence where it was, so these three
# paths still hold real lens output for records that were never
# migrated. Every one of those records is terminal, and a terminal
# record's next command is none, so this fact changes no routing today.
#
# It is declared anyway because that is a claim about the corpus, and a
# claim nothing checks is a claim that quietly stops being true. If a
# record with legacy evidence ever appears in flight, this says so
# instead of reporting its lenses un-run. `{slug}` is spelled here
# because these paths are keyed by slug at the TOP of the evidence root
# rather than under the record's own directory — the whole reason the
# migration happened.
[fact.legacy_evidence_shape]
kind = "bool"
source = "probe-any"
root = "evidence-root"
paths = [
  "3amigo/{slug}.md",
  "critique/{slug}-critique.md",
  "reconcile/{slug}",
]
description = "Pre-migration evidence exists for this record outside its own directory."

# --- the artifact half -----------------------------------------------------

# Stage 8's done-signal. The locked gate's four judgement responses move
# out of the record into this file, and the record keeps the pointer plus
# Cross-Cutting Concerns. A legacy record with all five inline satisfies
# the stage too, which is why this is a fact and not the whole verdict.
[fact.gate_written]
kind = "bool"
source = "probe"
root = "artifacts"
path = "artifacts/gate.md"
description = "The Finalization Gate's responses are written out of the record."

# Stage 9's capsule. Its header is the single authoritative resume read —
# phase, next, blocker and state in one pass — and the detailed
# implementation artifacts are opened only when it is absent or
# contradicts the tree.
[fact.impl_capsule]
kind = "bool"
source = "probe"
root = "artifacts"
path = "status.md"
description = "The Stage-9 status capsule exists."

# The capsule's own state word, read from the header rather than inferred
# from the tree. Absent when the file is not there — never guessed.
[fact.impl_state]
kind        = "enum"
source      = "capsule-state"
path        = "status.md"
domain      = ["COMPLETE", "INCOMPLETE", "IN-PROGRESS"]
description = "The Stage-9 capsule header's state word."

# --- Stage 7.1, the cluster half ------------------------------------------
#
# 7.1's output is the one stage that does not live under the record. It is
# `$RDR_EVIDENCE/cluster-reconcile/<key>/`, keyed by the CLUSTER, because
# one run reconciles a set and writes one directory for all of them.
#
# In the current shape the key is the members' numbers joined —
# `0122-0123-0130-0131-0132` — so the key IS the membership, written by
# the run that made it. That is why this reads the directory instead of
# naming a path, and why doing so is not the guess the probe rule bans:
# nothing is predicted, the tree is asked. The alternative considered and
# rejected was a table of hand-authored keys, which turns a DERIVED name
# into a maintained one and goes stale the first time a run forgets it.
#
# Overlap is not ambiguity. Where a re-run widened a cluster, both
# directories persist — `0122-0123-0131-0132` is iteration 1 and
# `0122-0123-0130-0131-0132` is iterations 2-3, which iter-3's own report
# states in its "Prior iterations" line. On the reference corpus every
# overlap is nested (7 records, 2 directories each, zero non-nested), and
# both answer the only question asked here: 7.1 ran.
[fact.cluster_reconciled]
kind        = "bool"
source      = "cluster-member"
root        = "evidence-root"
path        = "cluster-reconcile"
description = "Stage 7.1 reconciled a cluster containing this record."

# ===========================================================================
# Not declared here, and why
# ===========================================================================
#
# The TOPICAL cluster epoch is not covered by `cluster_reconciled`. Before
# 2026-06-29 a 7.1 directory was named for its subject rather than its
# members — `dml-purpose`, `dml-sidecar-append`, `replay-perf-2026-06-25`,
# `final-cluster-2026-06-22`, `final-cluster-2026-05-28`. Five directories,
# all earlier than every numeric-keyed one, with no interleaving.
#
# They are excluded BY SHAPE rather than read and filtered, which is what
# keeps the rule exact: `final-cluster-2026-06-22` contains the four-digit
# run `2026`, and a rule that pulled numbers out of a name would mint a
# membership claim for a record 2026 that no run ever made.
#
# Their membership is genuinely unrecoverable by any mechanical rule. Two
# carry no pairwise files at all; `final-cluster-2026-06-22` names five
# members of which one (cli/0067) appears in no filename, only in the
# report's prose; and `final-cluster-2026-05-28` lists its ten members in
# a sentence. Parsing that prose is the failure this table exists to end.
#
# Whether they are even the same OBJECT is open. `final-cluster-2026-05-28`
# carries neither a whole-set critique nor a pairwise scan — the two
# artifacts that define the stage — reads as a repo-wide survey of every
# Final-and-unimplemented RDR, and predates `stages/07.1-cluster-reconcile.md`
# (2026-06-18) by three weeks. It labels itself "Stage 08.1", a number the
# stage vocabulary has never had. Segmenting these from the current shape
# is deliberate: their role is decided by the corpus owner, not by a probe.
#
# Every record they cover is terminal, so no routing reads them today.
#
# Legacy evidence shapes have no probes either, and that one IS settled:
# the pre-migration trees that remain — loose `3amigo/<slug>.md`,
# `critique/<slug>-critique.md`, `reconcile/<slug>/` — belong exclusively
# to terminal records. A navigator answers "what do I run next", no
# in-flight record carries a legacy shape, and a terminal record's next
# command is none.
#
# The gate's CONTENTS are not declared, and this is a decision rather than
# a gap. `gate_written` is an exact-path probe: `artifacts/gate.md` exists.
# Whether the gate PASSED, which items were answered, and whether any
# response is a deferral all live inside that file, which the projector
# does not open — it reads records, and gate.md is not one.
#
# Nothing routes on them. Every `Final` branch of `rdr-status.toml` keys on
# `status`, `open_joint_decisions`, `clustered` and `cluster_reconciled`;
# `gate_written` is not among the model's tags at all. It earns its place
# by rendering the Stage-7 checklist row, not by deciding a next command —
# and it does not need to decide one, because a record is only `Final`
# once the gate has passed. `Final` IS the discharged gate; a second
# signal saying so would be the same fact read twice, and the two could
# disagree.
#
# So a gate reader would add facts nothing asks for, to a table whose
# names are a cross-repo contract. If a stage ever routes on a gate
# ITEM — a deferral that blocks implement, say — that is the moment to
# declare it, and the moment to decide whether the items project as
# `NNNN:G-<key>` on the record or as their own document. Until then the
# absence is the answer.
#
# Note the inline shape is fully readable and always was the intent: a
# gate answered in the record projects `G-<item>` elements whether it is
# written as sub-headings or as a labelled list, so a legacy record's
# five responses are citable. Only the EXTERNALIZED file is unread.
