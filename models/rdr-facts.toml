path = "repeatability/diff.md"
description = "repeatability's runs were diffed — owed by both variants."

# --- what the lens files SAY, as opposed to that they exist ---------------
#
# The four probes above answer whether critique's and repeatability's
# files are on disk. They cannot answer WHICH MODEL wrote them or WHICH
# VARIANT was owed, and for these two lenses that identity is the whole
# signal — this table's own header said so, and four skills were
# overriding the routing with prose because of it.
#
# Both stamps are written at generation to a fixed form, so they are read
# with a strict label rather than a search. Absent when the file or the
# stamp is missing: §model-stamp's rule is that no stamp means
# model-unknown, and a `false` there would assert a match that was never
# observed.

# The critique lens's first pass, and its second. Compared rather than
# exported: the raw ids are an OPEN vocabulary — `claude-opus-5[1m]`,
# `glm-5.2:cloud`, `Claude Sonnet 5` all appear — so no enum can carry
# one, and a routing table needs a domain it can enumerate. What the
# flow actually asks is whether the two passes were DIFFERENT models,
# which is a closed question over any pair of ids.
#
# PROSE, for the reason the open vocabulary above already implies: a
# model id is not a shell word. `claude-opus-5[1m]` carries brackets, and
# `[1m]` is a glob — an unquoted `$(recs status --tags …)` would glob it
# away or split it. The tag renderer is right to refuse such a value, but
# it refuses the WHOLE call, so an undeclared id here took the navigator
# down on every record whose critique ran under a bracketed model:
# measured 2026-08-28, 27 of 157 records exited 2 with no output, and
# they were the recent in-flight ones the navigator is actually called
# on. Nothing lost by declaring it: `critique_models` below carries the
# routing half, these two are the caveat line beside it, and `--json`
# still publishes both ids for §model-stamp's reader. Same treatment and
# the same reason as `profile_raw` and `cluster_key`.
[fact.critique_model_a]
kind        = "scalar"
source      = "header-field"
root        = "evidence"
path        = "critique/critique.md"
label       = "model:"
prose       = true
description = "The base model that wrote critique.md, from its §model-stamp."

[fact.critique_model_b]
kind        = "scalar"
source      = "header-field"
root        = "evidence"
path        = "critique/critique-modelB.md"
label       = "model:"
prose       = true
description = "The base model that wrote critique-modelB.md."

# The dual-model question as a routing dimension.
#
# `differ` is the pass §model-stamp wants: two base models, so the diff
# is a cross-model draw. `same` is the recorded single-model fallback —
# legitimate, and the flow says to say so rather than skip the step —
# and it is NOT a failure, only a different completion story. `unknown`
# is a pass with no stamp on one side, which §model-stamp is explicit
# about: don't assume a match, offer the second pass. `absent` is no
# second pass at all.
#
# Measured over the corpus: 24 differ, 8 same, 10 unknown. Every case is
# real, which is why all four are declared members rather than a
# boolean with a default.
[fact.critique_models]
kind        = "enum"
source      = "model-compare"
root        = "evidence"
paths       = ["critique/critique.md", "critique/critique-modelB.md"]
label       = "model:"
domain      = ["differ", "same", "unknown", "absent"]
absent      = "absent"
description = "Whether critique's two passes were written by different base models."

# The repeatability variant, from run-1's own header.
#
# §repeatability-variant: "the intended variant lives on disk, not in
# session memory" — pre-lock clears context and switches models between
# runs, so the header is the durable record BY DESIGN. It is declared
# here so the routing stops inferring the variant from how many run
# files exist, which is what silently promotes a `large` RDR to full x3.
#
# On today's corpus the header always AGREES with Profile, including the
# one escalation (cli/0106, whose Profile was updated to foundational
# with it). So this adds no routing power it does not already have — its
# job is to catch the DIVERGENCE that Profile cannot see: a `run-2`
# beside a `variant: lite` header is a variant mismatch the reconcile
# preflight already treats as a caveat, and only the header can say so.
#
# `none` is the absent sentinel: no run-1, or a run-1 with no variant
# line (27 such files, all terminal and all pre-dating the header).
[fact.repeatability_variant]
kind        = "enum"
source      = "header-field"
root        = "evidence"
path        = "repeatability/run-1.md"
label       = "variant:"
domain      = ["lite", "full", "none"]
absent      = "none"
description = "The variant run-1's header declares — the durable record, never the file count."

# --- the non-lens siblings -------------------------------------------------

# Stage 2's hardened-critic output. A sibling, never a Stage-5 lens
# signal: counting it toward lens convergence would certify a Pre-Lock row
# from a Propose artifact.
[fact.propose_premortem]
kind = "bool"
source = "probe"
root = "evidence"
path = "propose-premortem"
description = "Stage 2's premortem critic wrote output. NOT a Stage-5 lens."

# Stage 4 writes an evidence folder only when it names spikes. A pure
# source-search resolve records its verdicts inline and creates no folder
# at all, so an absent spikes dir is expected, not a sign Resolve is
# un-run — the CA tallies are the authority there.
[fact.spikes]
kind = "bool"
source = "probe"
root = "evidence"
path = "spikes"
description = "Spikes were run. Absence does not mean Resolve is un-run."

# Stage 7. The folder existing also certifies the last lens's resolution,
# which is why it is a fact the Pre-Lock row reads too.
[fact.reconcile]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile"
description = "The reconcile folder exists — also certifies the last lens's resolution."

# The reconcile report has three spellings in the corpus and no glob may
# guess between them, so each is its own probe and the routing takes the
# disjunction. A bare reconcile folder with none of them is a real state:
# the stage started and left no report.
[fact.reconcile_report]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile/reconcile.md"
description = "The reconcile report, canonical spelling."

[fact.reconcile_report_alt]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile/report.md"
description = "The reconcile report, second corpus spelling."

[fact.reconcile_report_alt2]
kind = "bool"
source = "probe"
root = "evidence"
path = "reconcile/reconcile-report.md"
description = "The reconcile report, third corpus spelling."

# A re-entry pass appends iter-N/ beside the loose iteration-1 files. The
# boolean collapsed one extra pass and four into one signal; the cap rows
# live in rdr-loop.toml on ITER_BUCKET, so this routes nothing and is for
# the checklist reader.
[fact.iter_depth]
kind = "int"
source = "iter-max"
root = "evidence"
paths = [
  "grounding",
  "3amigo",
  "critique",
  "repeatability",
  "cove",
  "reconcile",
]
min = 1
description = "The deepest iter-N any lens or reconcile pass reached; 1 is the loose first pass."

# The pre-migration evidence shapes, probed so that a legacy folder can
# never silently read as "lens un-run".
#
# The migration moved directory-shaped evidence under the record it
# belongs to and left FILE-shaped evidence where it was, so these three
# paths still hold real lens output for records that were never
# migrated. Every one of those records is terminal, and a terminal
# record's next command is none, so this fact changes no routing today.
#
# It is declared anyway because that is a claim about the corpus, and a
# claim nothing checks is a claim that quietly stops being true. If a
# record with legacy evidence ever appears in flight, this says so
# instead of reporting its lenses un-run. `{slug}` is spelled here
# because these paths are keyed by slug at the TOP of the evidence root
# rather than under the record's own directory — the whole reason the
# migration happened.
[fact.legacy_evidence_shape]
kind = "bool"
source = "probe-any"
root = "evidence-root"
paths = [
  "3amigo/{slug}.md",
  "critique/{slug}-critique.md",
  "reconcile/{slug}",
]
description = "Pre-migration evidence exists for this record outside its own directory."

# --- freshness: evidence older than the re-entry ---------------------------
#
# Every probe above answers whether evidence EXISTS. On a re-entered record
# that is the wrong question: `Draft [revised from Final <date>; …]` keeps
# every folder its Final earned, so the lens row read complete — and routed
# to reconcile — over a battery that never saw the rework. Three prose
# overrides in one measured run, each re-deriving "this predates the
# demote" by hand. These two facts are that reading.
#
# The reference point is the DEMOTE DATE the qualifier already carries:
# content, so it survives a checkout, and by construction the date after
# which the record changed. Only a re-entered record has one, so a Final or
# a first-pass Draft can never read stale — both answer the fresh value.
#
# The evidence side is dated content-first, mtime last. A file with a
# `Date:` header (gate.md, reconcile and tooling-pass reports) is dated by
# it; a file without one — the lens element files carry `Model:` and no
# date — by its modification time. That fallback is the one
# non-deterministic read in this table and it fails SAFE: a checkout resets
# mtimes to now, which reads as fresh, the answer routing gave before these
# facts existed. Same-day is fresh, so a re-verify landing on the demote
# date counts.

# The first lens, in row order, whose newest file (loose or under any
# iter-N) predates the demote date. `none` is both the fresh answer and the
# absent sentinel: a record with nothing to be older than routes as it did.
# Cove and grounding are never on one row together, so listing both in
# this order walks whichever row the profile owns.
[fact.lens_stale]
kind        = "enum"
source      = "stale-lens"
root        = "evidence"
paths       = ["cove", "grounding", "3amigo", "critique", "repeatability"]
domain      = ["none", "cove", "grounding", "3amigo", "critique", "repeatability"]
absent      = "none"
description = "The first lens whose evidence predates the re-entry's demote date; none when fresh or not re-entered."

# The ledger vocabulary is 05-prelock-resolve.prompt.md's — fixed /
# dismissed-with-cite / charted-to-successor / needs-tiebreaker — and only
# the last is open; the newest iteration's ledger is the current one.
[fact.lens_findings_open]
kind        = "int"
source      = "ledger-tally"
root        = "evidence"
paths       = ["grounding", "3amigo", "critique", "repeatability", "cove"]
path        = "dispositions.md"
entry       = "^\\| *`"
open        = "needs-tiebreaker"
min         = 0
description = "Open findings in each lens's newest dispositions ledger: rows still at needs-tiebreaker."

# The gate responses predate the demote. `gate_written` beside it says the
# file exists; a Draft re-entered after its lock keeps that file, and a
# re-lock that reads it as discharged is the same folder-existence error
# one level up. rdr-write.toml's lock outcome refuses on it
# (`lock-gate-stale`), and the Stage-7 row renders it.
[fact.gate_stale]
kind        = "bool"
source      = "stale-path"
root        = "artifacts"
path        = "gate.md"
absent      = "false"
description = "artifacts/gate.md predates the re-entry's demote date."

# An author ruling used to live in {ARTIFACT_DIR}/run-plan.md, which no
# lens reads — cli/0113's Stage-7 punt; rdr-write's fence stops on 1+.
[fact.rulings_open]
kind        = "enum"
source      = "ledger-tally"
root        = "evidence"
path        = "rulings.md"
entry       = "^- \\*\\*"
closed      = "absorbed @"
domain      = ["0", "1+", "unchecked"]
absent      = "unchecked"
description = "Author rulings in evidence/rulings.md no stage has marked absorbed; unchecked when no evidence root is bound."

# --- the artifact half -----------------------------------------------------

# Stage 8's done-signal. The locked gate's four judgement responses move
# out of the record into this file, and the record keeps the pointer plus
# Cross-Cutting Concerns. A legacy record with all five inline satisfies
# the stage too, which is why this is a fact and not the whole verdict.
[fact.gate_written]
kind = "bool"
source = "probe"
root = "artifacts"
path = "gate.md"
description = "The Finalization Gate's responses are written out of the record."

# Stage 9's capsule. Its header is the single authoritative resume read —
# phase, next, blocker and state in one pass — and the detailed
# implementation artifacts are opened only when it is absent or
# contradicts the tree.
[fact.impl_capsule]
kind = "bool"
source = "probe"
root = "artifacts"
path = "status.md"
description = "The Stage-9 status capsule exists."

# The capsule's own state word, read from the header rather than inferred
# from the tree. Absent when the file is not there — never guessed.
[fact.impl_state]
kind        = "enum"
source      = "capsule-state"
path        = "status.md"
domain      = ["COMPLETE", "INCOMPLETE", "IN-PROGRESS"]
description = "The Stage-9 capsule header's state word."

# The Stage-8 completion gate's inputs, read from the artifact ledger the
# launch prompt writes beside the capsule. Same absence rule as
# impl_state: no root, no dir or no file is ABSENT — `none`/`false` is
# the --tags sentinel, so a launch table can hold every dimension required.
[fact.req_count]
kind        = "enum"
source      = "impl-artifact"
select      = "req-count"
root        = "artifacts"
paths       = ["req-list.md"]
domain      = ["0-10", "11+", "none"]
absent      = "none"
description = "Distinct [REQ-N] lines in req-list.md, bucketed at the size gate's cap; REQ-MVV is not counted."

[fact.impl_orphans]
kind        = "enum"
source      = "impl-artifact"
select      = "orphans"
root        = "artifacts"
paths       = ["req-list.md", "coverage.md"]
domain      = ["0", "1+", "none"]
absent      = "none"
description = "REQ ids in req-list.md vs REQ rows in coverage.md, diffed both ways; an empty test cell is an orphan."

[fact.impl_open_decisions]
kind        = "enum"
source      = "impl-artifact"
select      = "open-decisions"
root        = "artifacts"
paths       = ["deviations.md"]
label       = "needs author decision"
domain      = ["0", "1+", "midline", "none"]
absent      = "none"
description = "Status: lines in deviations.md still reading needs author decision, bold or qualified; a line rewritten with → is closed; midline when a Status key sits mid-line (the **Type**: … **Status**: … entry form), where the count cannot be trusted."

# The implementation deviation taxonomy is declared here, once; launch.md,
# README.md (Post-Mortem Process), stages/08-implement.md and the
# post-mortem template repeat it as prose and are kept in sync by hand.
[fact.impl_deviation_types_unknown]
kind        = "enum"
source      = "impl-artifact"
select      = "deviation-types"
root        = "artifacts"
paths       = ["deviations.md"]
label       = "SPEC-DEFECT SPEC-UNDER DEPENDENCY-LIMIT TEST-FIXTURE IMPL-DECISION IMPL-GAP"
domain      = ["0", "1+", "none"]
absent      = "none"
description = "Type: entries in deviations.md whose type is outside the declared taxonomy (label); 0 when every entry is typed from the list, 1+ when the launch minted its own, none when the file is unread."

[fact.impl_mvv_recorded]
kind        = "bool"
source      = "impl-artifact"
select      = "mvv-recorded"
root        = "artifacts"
paths       = ["coverage.md"]
label       = "REQ-MVV output"
absent      = "false"
description = "coverage.md carries a REQ-MVV output line; a runner line alone is not a recording."

[fact.impl_verification_recorded]
kind        = "bool"
source      = "impl-artifact"
select      = "verification-recorded"
root        = "artifacts"
paths       = ["verification.md"]
absent      = "false"
description = "verification.md carries a Phase 3 finding (FAIL-N/ADV-N) or a clean Verdict; a file with neither is a stub, not a run."

# triage.md is the findings ledger a downstream review writes AFTER the
# gate first passes (the engine never runs the reviewer; it defines the
# row grammar): a table whose header names `Verdict` and `Outcome`. An
# IN-SCOPE row — a defect in a clause the record already decided, reproduced
# at HEAD — is open until Phase 3c rewrites its Outcome to `fixed:<sha>` or
# `held:<reason>`; any other Outcome (`open`, a kata id) is a known in-scope
# defect the run has not finished. Rows in any other Verdict are not the
# engine's. No file is `none` and NOT a stop: the ledger is optional
# downstream; a file with no such table has nothing open.
[fact.impl_findings_open]
kind        = "enum"
source      = "impl-artifact"
select      = "findings-open"
root        = "artifacts"
paths       = ["triage.md"]
label       = "IN-SCOPE"
domain      = ["0", "1+", "none"]
absent      = "none"
description = "IN-SCOPE rows in triage.md whose Outcome is neither fixed:<sha> nor held:<reason>; none when there is no ledger."

# Phase 0 writes impact.md from `recs impact`; the launch table's shard
# route reads only the header's `families:` count. Unread is `none`, a
# named stop, never `0` — an empty blast radius was looked for.
[fact.impact_families]
kind        = "enum"
source      = "impl-artifact"
select      = "impact-families"
root        = "artifacts"
paths       = ["impact.md"]
domain      = ["0", "1+", "none"]
absent      = "none"
description = "The families: count in impact.md's header, bucketed; none when the file is unread."

# --- Stage 7.1, the cluster half ------------------------------------------
#
# 7.1's output is the one stage that does not live under the record. It is
# `$RDR_EVIDENCE/cluster-reconcile/<key>/`, keyed by the CLUSTER, because
# one run reconciles a set and writes one directory for all of them.
#
# In the current shape the key is the members' numbers joined —
# `0122-0123-0130-0131-0132` — so the key IS the membership, written by
# the run that made it. That is why this reads the directory instead of
# naming a path, and why doing so is not the guess the probe rule bans:
# nothing is predicted, the tree is asked. The alternative considered and
# rejected was a table of hand-authored keys, which turns a DERIVED name
# into a maintained one and goes stale the first time a run forgets it.
#
# Overlap is not ambiguity. Where a re-run widened a cluster, both
# directories persist — `0122-0123-0131-0132` is iteration 1 and
# `0122-0123-0130-0131-0132` is iterations 2-3, which iter-3's own report
# states in its "Prior iterations" line. On the reference corpus every
# overlap is nested (7 records, 2 directories each, zero non-nested), and
# both answer the only question asked here: 7.1 ran.
[fact.cluster_reconciled]
kind        = "bool"
source      = "cluster-member"
root        = "evidence-root"
path        = "cluster-reconcile"
description = "Stage 7.1 reconciled a cluster containing this record."

# WHICH set that run reconciled, when one did — the directory's own name.
#
# The key IS the membership (see above), so this is the only place a
# reconciled cluster's members are readable without re-deriving them, and
# re-deriving is exactly what cannot be done cheaply: `index --cluster-of`
# is one hop rather than a closure, so it answers differently from every
# seed (9, 10, 11 and 13 members from four members of one live set), and
# it costs ~1.9s against `status`'s ~56ms. The run that wrote the
# directory already made that judgement, dropped candidates and all.
#
# PROSE, so nothing routes on it. `cluster_reconciled` remains the
# routing fact; this is the caveat line beside it and the argument a
# re-entering 7.1 run is invoked with. Prose also keeps it out of
# `--tags`, where a resolver's argv has no use for a membership and where
# a dash-joined key would be one more word to make safe.
#
# ABSENT rather than empty when no run covers this record: absence is
# honest in `--json`, a caller cannot spell "no key" as a value, and the
# navigator's answer in that case is the bare verb — there is nothing to
# name. No sentinel, because nothing routes on it (see the sentinel note
# under `[fact.cluster]`).
[fact.cluster_key]
kind        = "scalar"
source      = "cluster-key"
root        = "evidence-root"
path        = "cluster-reconcile"
prose       = true
description = "The Stage 7.1 directory that reconciled this record's set; its name is the membership."

# ===========================================================================
# Not declared here, and why
# ===========================================================================
#
# The TOPICAL cluster epoch is not covered by `cluster_reconciled`. Before
# 2026-06-29 a 7.1 directory was named for its subject rather than its
# members — `dml-purpose`, `dml-sidecar-append`, `replay-perf-2026-06-25`,
# `final-cluster-2026-06-22`, `final-cluster-2026-05-28`. Five directories,
# all earlier than every numeric-keyed one, with no interleaving.
#
# They are excluded BY SHAPE rather than read and filtered, which is what
# keeps the rule exact: `final-cluster-2026-06-22` contains the four-digit
# run `2026`, and a rule that pulled numbers out of a name would mint a
# membership claim for a record 2026 that no run ever made.
#
# Their membership is genuinely unrecoverable by any mechanical rule. Two
# carry no pairwise files at all; `final-cluster-2026-06-22` names five
# members of which one (cli/0067) appears in no filename, only in the
# report's prose; and `final-cluster-2026-05-28` lists its ten members in
# a sentence. Parsing that prose is the failure this table exists to end.
#
# Whether they are even the same OBJECT is open. `final-cluster-2026-05-28`
# carries neither a whole-set critique nor a pairwise scan — the two
# artifacts that define the stage — reads as a repo-wide survey of every
# Final-and-unimplemented RDR, and predates `stages/07.1-cluster-reconcile.md`
# (2026-06-18) by three weeks. It labels itself "Stage 08.1", a number the
# stage vocabulary has never had. Segmenting these from the current shape
# is deliberate: their role is decided by the corpus owner, not by a probe.
#
# Every record they cover is terminal, so no routing reads them today.
#
# Legacy evidence shapes have no probes either, and that one IS settled:
# the pre-migration trees that remain — loose `3amigo/<slug>.md`,
# `critique/<slug>-critique.md`, `reconcile/<slug>/` — belong exclusively
# to terminal records. A navigator answers "what do I run next", no
# in-flight record carries a legacy shape, and a terminal record's next
# command is none.
#
# The gate's CONTENTS are not declared, and this is a decision rather than
# a gap. `gate_written` is an exact-path probe: `gate.md` exists under the artifact root.
# Whether the gate PASSED, which items were answered, and whether any
# response is a deferral all live inside that file, which the projector
# does not open — it reads records, and gate.md is not one.
#
# Nothing routes on them. Every `Final` branch of `rdr-status.toml` keys on
# `status`, `open_joint_decisions`, `clustered` and `cluster_reconciled`;
# `gate_written` is not among the model's tags at all. It earns its place
# by rendering the Stage-7 checklist row, not by deciding a next command —
# and it does not need to decide one, because a record is only `Final`
# once the gate has passed. `Final` IS the discharged gate; a second
# signal saying so would be the same fact read twice, and the two could
# disagree.
#
# So a gate reader would add facts nothing asks for, to a table whose
# names are a cross-repo contract. If a stage ever routes on a gate
# ITEM — a deferral that blocks implement, say — that is the moment to
# declare it, and the moment to decide whether the items project as
# `NNNN:G-<key>` on the record or as their own document. Until then the
# absence is the answer.
#
# Note the inline shape is fully readable and always was the intent: a
# gate answered in the record projects `G-<item>` elements whether it is
# written as sub-headings or as a labelled list, so a legacy record's
# five responses are citable. Only the EXTERNALIZED file is unread.

# Whether Normative Contracts carries text the AUTHOR wrote, as distinct
# from `contracts`, which counts LABELLED ones.
#
# A zero `contracts` has two meanings and they route differently: the
# section is empty, or it holds contracts written as PROSE — real,
# load-bearing, and unaddressable. The Stage-5 Determinacy trigger fires
# on either, which is why the skills were told to stop and read the
# section (rdr-common §lens-row, rdr-status §How it decides). This fact
# is that read, so the trigger's input is a fact rather than an
# instruction to go looking.
#
# Template guidance and draft placeholders are NOT content: a section
# holding only `[Load-bearing — …]` and `_Draft placeholder._` is empty
# however many lines it spans. That is the difference between cli/0069
# (52 lines, entirely the template's) and cli/0053 (27 lines of real
# prose contracts), and getting it wrong in either direction would make
# the trigger fire on a seed or miss an authored contract.
[fact.contracts_prose]
kind        = "bool"
source      = "section-prose"
path        = "Normative Contracts"
absent      = "false"
description = "Normative Contracts carries authored text, labelled or not."

# The Stage-5 Determinacy judgement, written once. Whether a locked
# contract is ALGORITHMIC is a reading no fact makes; what a fact reads
# is the line that reading leaves behind — `Determinacy: fired — …` or
# `Determinacy: n/a — <reason>` in Normative Contracts, outside the
# fences (prompts/pre-lock/3-repeatability.md §Determinacy trigger). The
# `determinacy` group of rdr-status.toml routes repeatability-lite on it.
#
# `unjudged` is the ABSENT SENTINEL: no line, a placeholder-only section,
# or a word off the domain all read absent, and the table stops on that
# by name rather than reading silence as n/a. Absent ≠ na.
[fact.determinacy]
kind        = "enum"
source      = "verdict-line"
path        = "Normative Contracts"
label       = "Determinacy:"
domain      = ["fired", "na", "unjudged"]
absent      = "unjudged"
description = "The Stage-5 Determinacy judgement, written once as a `Determinacy:` line in Normative Contracts; n/a reads as na."

# --- the index row ---------------------------------------------------------
#
# What `$RDR_RECORDS/README.md`'s index table says about this record. The
# write-side ops (rdr-write.toml) route on it: `readme --add` needs "there
# is no row", `--flip` and `lock` need "there is one, and it says X", and
# both must REFUSE rather than guess on a shape they do not recognise.
#
# It reads the same table `index --readme` audits, through the same
# parser, so a per-record answer and the corpus report cannot disagree.
#
# `none` is a DECLARED value, not an absence: "the table was read and this
# record has no row" is the exact condition `--add` exists for, and a
# fact that went absent there would be indistinguishable from an
# unreadable README — which is the one case where nothing may be claimed.
[fact.readme_status]
kind        = "enum"
source      = "readme-row"
root        = "records"
path        = "README.md"
domain      = ["unindexed", "none", "Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
absent      = "unindexed"
description = "The Status cell of this record's README index row, or `none` when it has no row."

# ===========================================================================
# Gate facts — which assumptions, which re-verify set, how many anchors
# ===========================================================================
#
# The tallies above say HOW MANY assumptions are Pending; a stage's exit
# gate asks WHICH, and a Resolve re-entry asks which ones the qualifier
# reopened. Without these the answer was a 100KB+ facet pull and a
# hand-written walker per stage. Each set renders as a compact JSON
# array of ids (`["0106:A3","0106:A7"]`), one shell word, so `--tags`
# carries it as any other set.

[fact.ca_pending_ids]
kind        = "set"
source      = "assumption-ids"
select      = "Pending"
description = "The assumptions at Pending, by id — the members ca_pending counts."

[fact.ca_off_vocabulary_ids]
kind        = "set"
source      = "assumption-ids"
select      = "off-vocabulary"
description = "The assumptions whose Status matches no vocabulary label, by id."

# The re-verify set of a `Draft [revised from Final …; re-verify A2,A4 —
# …]` qualifier, read off the projection's reverify self-edges. ABSENT
# unless the Status is in that form: no re-entry means no set, which is
# not an empty one — `re-verify none` is a real answer and reads `[]`.
[fact.reverify]
kind        = "set"
source      = "reverify-ids"
description = "The assumption ids a scoped re-entry must re-verify; absent when the Status is not a revised-from."

# Source-anchor edges by verdict. `resolved` is three-valued and so are
# these: total, looked-for-and-missing, and never-looked (no source root
# bound). The three are read together — an `unlooked` equal to `total`
# says the check did not run, which is neither pass nor fail.
# ON DEMAND: deciding an edge scans the records dir and walks the source
# root (~1s on a large record), and the navigator renders `--tags` several
# times a stage. So these four are evaluated only when `--filter` names
# them, and an unfiltered render omits them — declared, like `prose`.
[fact.anchors_total]
kind        = "int"
source      = "edge-tally"
select      = "anchors-total"
on_demand   = true
min         = 0
description = "Source anchors (`path::Symbol`) the record cites."

[fact.anchors_unresolved]
kind        = "int"
source      = "edge-tally"
select      = "anchors-unresolved"
on_demand   = true
min         = 0
description = "Source anchors looked for in the source root and not found."

[fact.anchors_unlooked]
kind        = "int"
source      = "edge-tally"
select      = "anchors-unlooked"
on_demand   = true
min         = 0
description = "Source anchors nothing looked for — no source root was bound."

# Absent while any peer-evidence edge is undecided (no records dir to
# check against), so a zero here always means looked and found.
[fact.peer_evidence_unresolved]
kind        = "int"
source      = "edge-tally"
select      = "peer-evidence-unresolved"
on_demand   = true
min         = 0
description = "Peer-RDR Evidence citations whose element was looked for and not found; absent while unchecked."

# The spikes the record NAMES minus the ones `evidence/spikes/` holds —
# Stage 6's third open-set source, as a set rather than a walk. A name is
# the first path segment after `{SPIKE_DIR}/` in an `artifact` edge; an
# entry matches by name with or without its extension. Absent when the
# evidence root is unbound; `[]` when the record names none, or every one
# named has a run on disk — and a missing spikes dir means every named
# spike is unrun, which is a real answer, not the unbound case.
[fact.spikes_unrun]
kind        = "set"
source      = "spike-diff"
root        = "evidence"
description = "Spikes the record cites under {SPIKE_DIR} with no entry in evidence/spikes/."

# --- the rollups: what the record's peers say ------------------------------
#
# Each folds a SET the flow used to fold by hand — a read per peer, then an
# AND in prose — into one word a routing row can claim. The peer is read
# through the same table (its own `impl_state`, its own section-prose
# rule), so a rollup and a direct `status` of the peer cannot disagree.
#
# Stage 8's predecessor gate. `predecessors_incomplete` is the set that
# owes WORK — an unresolvable record and an absent capsule are members,
# because neither is "looked and COMPLETE"; `predecessors_state` is the
# word `rdr-launch.toml`'s precheck routes on. `unresolved` wins over
# `incomplete` (the prompt halted on a dangling predecessor first), and
# `incomplete` over `retired`: work owed outranks a lineage to confirm.
#
# A RETIRED predecessor (Superseded, Abandoned, Rejected) is split out
# because its capsule is absent and always will be — the flow closed it
# without implementing. Folding it into `incomplete` said "implement
# those first" about a record that never can be, which is unsatisfiable
# by construction: a successor names the record it supersedes as its
# predecessor, so the gate asked that record to be built in order to be
# replaced. Demoted and Deferred are NOT retired — a Demoted record
# re-enters at a named stage and a Deferred one is parked, so both may
# still reach COMPLETE.
#
# A predecessor with NO READABLE capsule state — none in either layout,
# or a legacy capsule whose header has no state word — and a record
# Status of Implemented is complete: the landing flow writes that word
# only after the merge, so it is the flow's own terminal assertion for a
# record implemented before the capsule header was fixed. A capsule whose
# state reads and is not COMPLETE still wins over the word. DECIDED
# 2026-09-08 — this header skew (63 of 117 Implemented records in one
# corpus), not the flat-capsule layout, was why a wrapper overrode the
# precheck.
#
# All three sets are absent with no Predecessors field; `none` is the
# state's sentinel.
# The sets are ON DEMAND — read by name for the halt line, never riding
# the whole `--tags` vector. That is a COST choice, not a refusal one:
# since intrastate RDR 0020 an undeclared set crosses as a pure carrier,
# so the reason to keep them off the vector is that each resolves peers.
[fact.predecessors_incomplete]
kind        = "set"
source      = "predecessor-rollup"
select      = "incomplete"
on_demand   = true
description = "Predecessors whose capsule does not read COMPLETE, an unresolvable one included."

[fact.predecessors_retired]
kind        = "set"
source      = "predecessor-rollup"
select      = "retired"
on_demand   = true
description = "Predecessors closed without implementing (Superseded, Abandoned, Rejected) — no capsule exists and none ever will."

[fact.predecessors_state]
kind        = "enum"
source      = "predecessor-rollup"
select      = "state"
domain      = ["complete", "incomplete", "retired", "unresolved", "none"]
absent      = "none"
description = "The predecessor gate folded: complete, incomplete, retired (every unbuilt one is Superseded/Abandoned/Rejected), unresolved (a record did not resolve), or none declared."

# The Stage-2 tandem barrier: a clustered Draft is barred from refine until
# every sibling has proposed. "Proposed" is the sibling's Implementation
# Plan carrying authored text — `contracts_prose`'s rule on that section —
# and a sibling that does not resolve reads not-proposed. `solo` is the
# sentinel for a record with no Cluster field.
[fact.cluster_members_proposed]
kind        = "enum"
source      = "cluster-proposed"
path        = "Implementation Plan"
domain      = ["all", "some", "none", "solo"]
absent      = "solo"
description = "How many declared Cluster siblings carry an authored Implementation Plan: all, some, none; solo when unclustered."

# Finalize's "reconcile before implement": the record's asserted cluster
# members (`index --cluster-of`, candidates excluded) that are Final and
# not COMPLETE. ON DEMAND: it walks the corpus, like the edge tallies.
[fact.related_final_unimplemented]
kind        = "enum"
source      = "related-rollup"
select      = "final-unimplemented"
on_demand   = true
domain      = ["0", "1+"]
description = "Asserted cluster members that are Final with no COMPLETE capsule; 1+ routes to /rdr-cluster-reconcile first."

# Stage 8's cluster-order question: the Final, unbuilt siblings that build
# BEFORE this record in the cluster's build order — topo's order (`index
# --topo --edges predecessors,overrides`): an explicit edge first (a record
# builds after the one it names as predecessor or overrides), then
# Priority, then number. The order is total, so exactly one member has
# nobody before it — a rule that stopped on every unbuilt sibling once
# deadlocked four Final records. An author who wants another order writes
# the edge. The set names them for the halt line; both ON DEMAND.
[fact.related_final_unordered]
kind        = "enum"
source      = "related-rollup"
select      = "final-unordered"
on_demand   = true
domain      = ["0", "1+"]
description = "Final, unbuilt cluster members that build before this record (explicit edges, then Priority, then number); 1+ is stopped:cluster-order at launch."

[fact.cluster_unordered]
kind        = "set"
source      = "related-rollup"
select      = "unordered"
on_demand   = true
description = "The members behind related_final_unordered: implement them first, or write the edge that orders this record ahead."

# Finalize's close used to dispatch 7.1 on `related_final_unimplemented`
# alone, so a run fired while a sibling was still Draft and re-fired when
# the sibling later locked. This is the other half: a Draft sibling caught
# BEFORE that pass, not after.
[fact.cluster_members_in_flight]
kind        = "enum"
source      = "related-rollup"
select      = "draft"
on_demand   = true
domain      = ["0", "1+"]
description = "Asserted cluster members still Draft; 1+ means a 7.1 pass now would run on a partial set."

# The ground ladder's cluster rung: does `index --cluster-of` return anyone
# besides the seed. `clustered` is the wrong guard for it — that reads the
# DECLARED Cluster field, and a record with no field but two cross-cutting
# peers read "no peers" and skipped the rung its own surface names. This
# counts what the rung would search: every member the walk reports, the
# candidate tier included, since a mutual-mentions peer is a lead worth
# one read and the rung asserts no membership.
[fact.peers]
kind        = "enum"
source      = "related-rollup"
select      = "any"
on_demand   = true
domain      = ["0", "1+"]
description = "Cluster members index --cluster-of reports besides the seed, candidates included; 1+ is the ground ladder's cluster rung."

# Stage 8's third ordering question, the one neither of the two above
# carries: a `### Prerequisites` box saying another record's code "lands
# before Step 2" names a record that is not a Predecessor and not a
# cluster sibling, so a launch passed both gates, built for hours, and
# halted at the completion gate with the boxed half's REQs untestable.
# The evaluator reads the boxes as records write them and refuses the
# rest (its comment lists the rule: an unchecked box, a record named in
# the clause's head outside any `(…)` gloss, a landing verb, and no
# `not`/`if`/`or`/`co-landing` escape); a named record is implemented by
# `predecessors_state`'s read. Absent with no Prerequisites section:
# `none` is the declared sentinel, and the launch table routes it as `0`.
# The set names the records for the halt line; both ON DEMAND.
[fact.prerequisites_unimplemented]
kind        = "enum"
source      = "prerequisite-rollup"
select      = "unimplemented"
on_demand   = true
domain      = ["0", "1+", "none"]
absent      = "none"
description = "Records a `### Prerequisites` box says must land first and whose capsule is not COMPLETE nor Status Implemented; 1+ is stopped:prerequisite-unimplemented at launch."

[fact.prerequisites_owed]
kind        = "set"
source      = "prerequisite-rollup"
select      = "owed"
on_demand   = true
description = "The records behind prerequisites_unimplemented: implement them first, or move the half that waits on them to a successor record."
