[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.all.lens_repeatability_diff]
eq = "true"
[rule.guard.all.lens_repeatability_run2]
eq = "false"
[rule.guard.all.lens_repeatability_run3]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next = "none"
why  = "Variant lite — run-1 and the diff are written; the lens is complete."

[[rule]]
id = "repeatability-lite-variant-mismatch"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "lite"
[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.all.lens_repeatability_diff]
eq = "true"
[rule.guard.all.lens_repeatability_run2]
eq = "true"
[rule.guard.all.lens_repeatability_run3]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "none"
why     = "Variant lite with a run-2 present — full ran where lite was owed."
surface = "the VARIANT MISMATCH as a Caveat: the header reads lite and a run-2 exists; do not silently pass it as done"

