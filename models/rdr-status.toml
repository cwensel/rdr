# NO ESCAPE ROW HERE EITHER. The product ranges over every lens flag for
# every profile, so cells exist that no row names in prose — a `small`
# record carrying a `critique/` folder, a `mid` one carrying `cove/`.
# Those are OFF-ROW lenses, and §lens-row's answer is that they are absent
# from the row rather than owed by it, so they change no answer: each
# profile's rows guard only its own row's lenses, which is exactly what
# makes them span those cells already. Coverage is therefore proved here
# too, and an "otherwise" row would have been unreachable.

# ===========================================================================
# `critique` — is the critique lens FINISHED? (rdr-common.md §model-stamp)
# ===========================================================================
#
# Dimensions: profile × critique_models × lens_critique_modelb ×
# lens_critique_diff × lens_stale = 5 × 4 × 2 × 2 × 6 = 480.
#
# This group exists because a FOLDER cannot answer the question. The
# `lens` group reads `lens_critique` — critique.md is on disk — and
# §lens-row is explicit that a bare folder is not completion. For
# critique on a foundational RDR the completion rule is the DUAL-MODEL
# diff, and the identity of the model that wrote each pass is the whole
# signal. Four skills carried that rule as prose and overrode the
# routing with it; the facts now say it, so the rows can.
#
# THE DEFECT THIS CLOSES, measured on the live corpus: cli/0142 is a
# foundational Final carrying critique.md AND critique-modelB.md and NO
# diff.md. The `lens` group answers `/rdr-reconcile` — "the row is
# complete" — because both folders exist. It is not complete: the two
# passes were never diffed. Only a rule that reads the diff can say so.
#
# THE ROW ORDER IS THE COMPLETION ORDER: a second pass, then the diff of
# the two. Each row's `unless` on the earlier step is what makes it claim
# exactly the cells where that step is the first missing one.

# --- not a critique-owing profile -----------------------------------------
#
# `small` skips Stage 5 entirely and `mid` has no critique in its row, so
# there is nothing here to finish. `none` is the absent-Profile sentinel:
# §lens-row makes that a stop-packet rather than a default, and this group
# gives the same answer the `lens` group does rather than a second one.
[[rule]]
id = "critique-no-profile"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "none"
[rule.emit]
next    = "stopped:no-profile"
why     = "The Profile field is absent — §lens-row makes that a stop-packet, never a default."
surface = "that no Profile is written; infer the row only with the basis flagged"

[[rule]]
id = "critique-off-row"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
in = ["small", "mid"]
[rule.emit]
next = "none"
why  = "Profile small/mid — critique is not on this row, so there is no completion to judge."

# --- large: one pass is the whole obligation ------------------------------
#
# §lens-row's large row ends at critique, and the DUAL-MODEL rule is
# foundational's. A large RDR's critique is finished when critique.md is
# written — the second pass is available and often taken, but it is not
# owed, so a large record with one pass is complete rather than pending.
[[rule]]
id = "critique-large-unrun"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.critique_models]
eq = "absent"
[rule.guard.all.lens_critique_modelb]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next = "none"
why  = "Profile large — critique owes one pass; the dual-model diff is foundational's rule."

[[rule]]
id = "critique-large-second-pass-undiffed"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.lens_critique_modelb]
eq = "true"
[rule.guard.all.lens_critique_diff]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next    = "/rdr-prelock critique"
why     = "A second critique pass was written and never diffed — the disagreement is the signal, and it is unread."
surface = "that the diff is what is missing, not another pass"

[[rule]]
id = "critique-large-complete"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.lens_critique_modelb]
eq = "false"
[rule.guard.all.critique_models]
in = ["differ", "same", "unknown"]
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next = "none"
why  = "Profile large — critique's pass is written; large does not owe the dual-model diff."

[[rule]]
id = "critique-large-diffed"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.lens_critique_modelb]
eq = "true"
[rule.guard.all.lens_critique_diff]
eq = "true"
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next = "none"
why  = "Profile large — a second pass was taken and diffed; nothing is owed."

# --- foundational: the dual-model diff is the completion rule -------------

[[rule]]
id = "critique-foundational-no-second-pass"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_critique_modelb]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next    = "/rdr-prelock critique"
why     = "Profile foundational — critique owes the DUAL-MODEL diff and no second pass exists."
surface = "run the second pass on a DIFFERENT base model (§model-stamp); a recorded single-model fallback is the sanctioned alternative"

[[rule]]
id = "critique-foundational-undiffed"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_critique_modelb]
eq = "true"
[rule.guard.all.lens_critique_diff]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next    = "/rdr-prelock critique"
why     = "Both critique passes are written and never diffed — the disagreement between them is the whole signal."
surface = "that the diff is what is missing, not another pass"

# Both passes, diffed, on two DIFFERENT models: the rule as written.
[[rule]]
id = "critique-foundational-complete"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_critique_modelb]
eq = "true"
[rule.guard.all.lens_critique_diff]
eq = "true"
[rule.guard.all.critique_models]
eq = "differ"
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next = "none"
why  = "Profile foundational — two base models, diffed; the dual-model obligation is discharged."

# Diffed, but both passes came from the SAME model. The critique lens
# sanctions this explicitly as the single-model fallback — "do not let
# the absence of one skip the anti-sycophancy step" — so it completes,
# and the caveat is surfaced rather than the stage re-run.
[[rule]]
id = "critique-foundational-single-model-fallback"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_critique_modelb]
eq = "true"
[rule.guard.all.lens_critique_diff]
eq = "true"
[rule.guard.all.critique_models]
eq = "same"
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next    = "none"
why     = "Profile foundational — diffed, but both passes are the same base model: the recorded single-model fallback."
surface = "that this was a SINGLE-MODEL fallback; the diff weights agreement lower than a true cross-model draw"

# Diffed, but a stamp is missing on one side. §model-stamp: no stamp is
# model-unknown, and the rule is never to assume a match — so this
# completes the lens while saying the cross-model claim is unproven.
[[rule]]
id = "critique-foundational-unstamped"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_critique_modelb]
eq = "true"
[rule.guard.all.lens_critique_diff]
eq = "true"
[rule.guard.all.critique_models]
in = ["unknown", "absent"]
[rule.guard.unless.lens_stale]
eq = "critique"
[rule.emit]
next    = "none"
why     = "Profile foundational — diffed, but a pass carries no Model: stamp, so the cross-model draw is unproven."
surface = "the missing §model-stamp: model-unknown is never read as a match"

# --- re-entered: the pass predates the demote ------------------------------
#
# A re-entered Draft keeps the critique its Final earned, so the rows
# above would read a pre-demote pass — or its diff — as finished work.
# `lens_stale` says the lens's newest evidence predates the demote date;
# the rows above exclude this slice with `unless`, so each cell is still
# claimed once, and the answer never reads as done.
[[rule]]
id = "critique-stale"
[rule.match.recognized]
eq = "critique"
[rule.guard.all.profile]
in = ["large", "foundational"]
[rule.guard.all.lens_stale]
eq = "critique"
[rule.emit]
next    = "/rdr-prelock critique"
why     = "Re-entered — the pass on disk predates the demote, so the lens is owed a pass for this iteration."
surface = "the demote date from the qualifier and the lens's newest evidence date; a re-run under iter-N makes it current"

# ===========================================================================
# `repeatability` — is the repeatability lens FINISHED?
#   (rdr-prelock §repeatability-variant)
# ===========================================================================
#
# Dimensions: profile × repeatability_variant × the three run probes ×
# the diff × lens_stale = 5 × 3 × 2 × 2 × 2 × 2 × 6 = 1440.
#
# `rdr-prelock:96-125` was this table written as prose: a (profile ×
# variant × requested-run) product a model re-derived every run. The
# variant is the latch — lite owes `run-1` then the diff, full owes
# `run-1/2/3` then the diff — and the rule that matters most is the one
# the prose states twice: NEVER INFER THE VARIANT FROM THE FILE COUNT.
# That is what silently promotes a `large` RDR to full ×3. The variant
# comes from run-1's own header, which is why it is a fact.
#
# THE VARIANT IS READ, NOT DERIVED FROM PROFILE, and the rows below guard
# on it rather than on profile alone. On today's corpus the two always
# agree, so this changes no answer — its job is the DIVERGENCE: a
# `run-2` beside a `variant: lite` header is a variant mismatch that
# rdr-reconcile's preflight already treats as a caveat, and only the
# header can see it. A row that re-derived the variant from Profile
# would be structurally unable to report the case it exists for.
#
# `none` is the variant sentinel: no run-1 on disk, or a run-1 that
# predates the header (27 such files, all terminal). With no run-1 the
# variant is genuinely unwritten, so the next step is run 1 — under the
# variant Profile implies, which is the ONE place deriving it is right,
# because there is no header yet to read.

[[rule]]
id = "repeatability-no-profile"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
eq = "none"
[rule.emit]
next    = "stopped:no-profile"
why     = "The Profile field is absent — §lens-row makes that a stop-packet, never a default."
surface = "that no Profile is written; infer the variant only with the basis flagged"

# --- no run-1: the variant has no header to be read from ------------------
#
# The one case where Profile decides the variant, because nothing has
# been written yet to disagree with it. `small` has no Stage 5 at all.
[[rule]]
id = "repeatability-small"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
eq = "small"
[rule.emit]
next = "none"
why  = "Profile small — §lens-row skips Stage 5, so repeatability is not owed."

# Foundational: repeatability is ON THE ROW, so an unrun lens is simply
# the next run, and the variant to stamp is full.
[[rule]]
id = "repeatability-unrun-foundational"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.repeatability_variant]
eq = "none"
[rule.guard.all.lens_repeatability_run1]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "/rdr-prelock repeatability"
why     = "Profile foundational — repeatability is on the row and has not started; the variant is FULL."
surface = "stamp `variant: full (profile: foundational)` into run-1's header at generation"

# mid/large: repeatability is NOT on the row. It is an ADD-ON owed only
# when the Stage-5 Determinacy trigger fires — a judgement over the
# Normative Contracts section (is a locked contract algorithmic?) that no
# fact makes, but one Stage 5 WRITES once, as the `Determinacy:` line the
# `determinacy` fact reads. This group is at 1440, and a third value on
# it overflows the bound, so the line gets its own outcome, chained
# exactly as `locate` chains to `reentry`. The chained group routes run
# 1, `none`, or the unjudged stop — nothing here re-derives it.
[[rule]]
id = "repeatability-mid-large-unrun"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large"]
[rule.guard.all.repeatability_variant]
eq = "none"
[rule.guard.all.lens_repeatability_run1]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next = "resolve:determinacy"
why  = "Profile mid/large — repeatability is an add-on; the trigger is a written line the determinacy group routes on."

# A run-1 exists but carries no variant header. Pre-dates
# §repeatability-variant; the header is the durable record and this one
# has none, so the variant cannot be read and must not be guessed from
# the file count — which is exactly the promotion the rule forbids.
[[rule]]
id = "repeatability-unstamped"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "none"
[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "stopped:repeatability-variant-unstamped"
why     = "run-1 exists with no `variant:` header — the durable record is missing and the file count must never stand in for it."
surface = "run-1.md's header line, to be written from Profile before any further run"

# --- lite: run-1, then the diff -------------------------------------------

[[rule]]
id = "repeatability-lite-diff"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "lite"
[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.all.lens_repeatability_diff]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "/rdr-prelock repeatability diff"
why     = "Variant lite — run-1 is written and the RDR-vs-run diff is what remains. Never point at run-2."
surface = "that lite stops after run-1: a run-2 request against this header is stopped:repeatability-lite-no-run-2"

[[rule]]
id = "repeatability-lite-run1-missing"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "lite"
[rule.guard.all.lens_repeatability_run1]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next = "/rdr-prelock repeatability"
why  = "Variant lite — run-1 is the only run owed and it is missing."

# Lite, run-1 and the diff present. Extra runs beside a `lite` header are
# the VARIANT MISMATCH the reconcile preflight flags: full ran where lite
# was owed. It completes — the work is done and more of it than required
