why     = "Variant lite with a run-3 present — full ran where lite was owed."
surface = "the VARIANT MISMATCH as a Caveat: the header reads lite and a run-3 exists; do not silently pass it as done"

# --- full: run-1/2/3, then the diff ---------------------------------------
#
# Each row points at the FIRST missing run, so a fresh session is told
# exactly which one it is writing (the runs are one-per-session by
# design: independence comes from each run being authored by a context
# that wrote no other).

[[rule]]
id = "repeatability-full-run1"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "full"
[rule.guard.all.lens_repeatability_run1]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next = "/rdr-prelock repeatability"
why  = "Variant full — run-1 is the first of three and is missing."

[[rule]]
id = "repeatability-full-run2"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "full"
[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.all.lens_repeatability_run2]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "/rdr-prelock repeatability"
why     = "Variant full — run-2 is the next run owed."
surface = "that the remaining runs land on models the existing stamps do not carry — the cross-model draw is the point"

[[rule]]
id = "repeatability-full-run3"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "full"
[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.all.lens_repeatability_run2]
eq = "true"
[rule.guard.all.lens_repeatability_run3]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "/rdr-prelock repeatability"
why     = "Variant full — run-3 is the last run owed."
surface = "that the remaining runs land on models the existing stamps do not carry — the cross-model draw is the point"

[[rule]]
id = "repeatability-full-diff"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "full"
[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.all.lens_repeatability_run2]
eq = "true"
[rule.guard.all.lens_repeatability_run3]
eq = "true"
[rule.guard.all.lens_repeatability_diff]
eq = "false"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "/rdr-prelock repeatability diff"
why     = "Variant full — all three runs are written and the diff is what remains."
surface = "that the diffing context must have written none of the runs"

[[rule]]
id = "repeatability-full-complete"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.repeatability_variant]
eq = "full"
[rule.guard.all.lens_repeatability_run1]
eq = "true"
[rule.guard.all.lens_repeatability_run2]
eq = "true"
[rule.guard.all.lens_repeatability_run3]
eq = "true"
[rule.guard.all.lens_repeatability_diff]
eq = "true"
[rule.guard.unless.lens_stale]
eq = "repeatability"
[rule.emit]
next = "none"
why  = "Variant full — run-1/2/3 and the diff are written; the lens is complete."

# --- re-entered: the run set predates the demote ---------------------------
#
# Same seam as the `lens` group's stale rows: a re-entered Draft keeps
# the runs its Final earned, and the rows above would read them — and
# their diff — as finished work. The rows above exclude this slice with
# `unless`, so each cell is still claimed once, and the answer never
# reads as done.
[[rule]]
id = "repeatability-stale"
[rule.match.recognized]
eq = "repeatability"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.guard.all.lens_stale]
eq = "repeatability"
[rule.emit]
next    = "/rdr-prelock repeatability"
why     = "Re-entered — the run set is written but predates the demote, so the lens is owed a pass for this iteration."
surface = "the demote date from the qualifier and the runs' newest evidence date; a re-run under iter-N makes it current"

# ===========================================================================
# `determinacy` — is repeatability-lite owed?
#   (prompts/pre-lock/3-repeatability.md §Determinacy trigger)
# ===========================================================================
#
# Dimensions: profile × determinacy = 5 × 3 = 15.
#
# Reached only through `repeatability-mid-large-unrun`'s
# `resolve:determinacy` — no run-1, variant unwritten, not stale — so the
# run and diff dimensions are already settled and are not re-imported.
# The judgement stays with Stage 5: whether a locked contract is
# algorithmic is a reading. What the table routes on is the line that
# reading leaves behind, `Determinacy: fired — …` or `Determinacy: n/a —
# <reason>` in Normative Contracts, which `rdr status` reads as
# `determinacy`. `unjudged` is the absent sentinel and it STOPS: a
# missing judgement must never read as n/a (§stop-packet), and it stops
# once, here, instead of being re-walked at Stages 5, 6 and 7.
#
# Every cell is claimed. No profile is the stop it always is; small has
# no Stage 5; foundational has the full lens on its row already, so the
# line adds nothing there. Only mid/large read it.

[[rule]]
id = "determinacy-no-profile"
[rule.match.recognized]
eq = "determinacy"
[rule.guard.all.profile]
eq = "none"
[rule.emit]
next    = "stopped:no-profile"
why     = "The Profile field is absent — §lens-row makes that a stop-packet, never a default."
surface = "that no Profile is written; the lite add-on cannot be sized without it"

[[rule]]
id = "determinacy-small"
[rule.match.recognized]
eq = "determinacy"
[rule.guard.all.profile]
eq = "small"
[rule.emit]
next = "none"
why  = "Profile small — §lens-row skips Stage 5, so repeatability is not owed."

[[rule]]
id = "determinacy-foundational"
[rule.match.recognized]
eq = "determinacy"
[rule.guard.all.profile]
eq = "foundational"
[rule.emit]
next = "none"
why  = "Profile foundational — the full repeatability lens is on the row already; the trigger adds nothing."

[[rule]]
id = "determinacy-unjudged"
[rule.match.recognized]
eq = "determinacy"
[rule.guard.all.profile]
in = ["mid", "large"]
[rule.guard.all.determinacy]
eq = "unjudged"
[rule.emit]
next    = "stopped:determinacy-trigger-unjudged"
why     = "Profile mid/large — no `Determinacy:` line is written in Normative Contracts, so the trigger is unjudged."
surface = "Normative Contracts: judge the trigger once against $RDR_HOME/prompts/pre-lock/3-repeatability.md §Determinacy trigger and write `Determinacy: fired — <contracts>` or `Determinacy: n/a — <reason>` there, outside the fences"

[[rule]]
id = "determinacy-na"
[rule.match.recognized]
eq = "determinacy"
[rule.guard.all.profile]
in = ["mid", "large"]
[rule.guard.all.determinacy]
eq = "na"
[rule.emit]
next = "none"
why  = "Profile mid/large — the `Determinacy:` line reads n/a; repeatability is not on this row."

[[rule]]
id = "determinacy-fired-mid"
[rule.match.recognized]
eq = "determinacy"
[rule.guard.all.profile]
eq = "mid"
[rule.guard.all.determinacy]
eq = "fired"
[rule.emit]
next    = "/rdr-prelock repeatability"
why     = "Profile mid — the `Determinacy:` line reads fired; repeatability-lite is owed."
surface = "stamp `variant: lite (profile: mid)` into run-1's header at generation"

[[rule]]
id = "determinacy-fired-large"
[rule.match.recognized]
eq = "determinacy"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.determinacy]
eq = "fired"
[rule.emit]
next    = "/rdr-prelock repeatability"
why     = "Profile large — the `Determinacy:` line reads fired; repeatability-lite is owed."
surface = "stamp `variant: lite (profile: large)` into run-1's header at generation"

# ===========================================================================
# `after-lock` — Finalize's Next after the lock
# ===========================================================================
#
# Dimensions: cluster_members_in_flight × related_final_unimplemented =
# 2 × 2 = 4 cells, three rows.
#
# The finalize close used to read `related_final_unimplemented` alone and
# dispatch 7.1 while a cluster sibling was still Draft, so the pass
# re-fired when the sibling locked (0138-0139-0141: 4 iterations, 0141
# demoted 3 times). A Draft sibling is checked FIRST — lock it before any
# 7.1 pass runs, so the pass covers the whole set once.

[[rule]]
id = "after-lock-sibling-draft"
[rule.match.recognized]
eq = "after-lock"
[rule.guard.all.cluster_members_in_flight]
eq = "1+"
[rule.emit]
next     = "/rdr-draft-to-lock"
next_arg = "sibling"
why      = "A cluster sibling is still Draft — 7.1 on a partial set re-runs when it locks; lock the sibling first."
surface  = "the `status=Draft` members of `index --json --cluster-of NNNN`; 7.1 runs once over the whole set after they lock"

[[rule]]
id = "after-lock-reconcile"
[rule.match.recognized]
eq = "after-lock"
[rule.guard.all.cluster_members_in_flight]
eq = "0"
[rule.guard.all.related_final_unimplemented]
eq = "1+"
[rule.emit]
next = "/rdr-cluster-reconcile"
next_arg = "cluster"
why  = "Every member is locked and a related Final is unimplemented — reconcile the set before any of it implements."

[[rule]]
id = "after-lock-implement"
[rule.match.recognized]
eq = "after-lock"
[rule.guard.all.cluster_members_in_flight]
eq = "0"
[rule.guard.all.related_final_unimplemented]
eq = "0"
[rule.emit]
next = "/rdr-implement"
why  = "No cluster work is owed — implement is next."
