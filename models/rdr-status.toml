# rdr-status.toml — the navigator's routing table, as data.
#
# `skills/rdr-status/SKILL.md` answers "I lost my place — what do I run
# next?". N1 and N2 moved its SIGNALS into data (`rdr-facts.toml`, read by
# `rdr status --tags NNNN`). This file is the other half: the ROUTING,
# which was §How it decides next plus `rdr-common.md` §lens-row — prose a
# model re-derived on every run.
#
# The point is a guarantee prose cannot give. `intrastate lint --model`
# proves every cell of each declared product is claimed by exactly one
# row; the 2026-08-26 proof-of-concept found a 208/512 hole in a partial
# table. A missing branch is a lint failure here, not a wrong answer to a
# human three months from now.
#
# THE COUPLING IS THE FACT NAMES, AND NOTHING ELSE. Neither binary calls
# the other: `rdr` renders tags, `intrastate` resolves them, and the
# skill composes the two in one Bash call —
#
#   intrastate flow resolve --model "$RDR_HOME/models/rdr-status.toml" \
#     --outcome locate $(rdr status --tags NNNN)
#
# so every `[tags.*]` name below must match a fact `rdr-facts.toml`
# declares. A rename there is a breaking change to this file in another
# repo, which is why that table says so in its own header.
#
# ---------------------------------------------------------------------
# WHY A DECISION TABLE, AND WHY THE ROWS LOOK LIKE THIS
#
# This is a `decision-table` (intrastate RDR 0010): zero owned tags, no
# `[initial]`, no accessors, no `--artifact`. The navigator is stateless
# by doctrine — `stages/README.md` resources-vs-memory: a position
# computed from the artifacts cannot drift from them — so a model that
# held state would be the wrong shape even where one was available.
#
# THE DIMENSIONS ARE GUARD ATOMS, NEVER MATCH ATOMS. `[rule.match.*]`
# scopes a row's group and contributes NO dimension to the product lint
# proves exhaustiveness over, so a table discriminated by match atoms
# ranges over an empty product that any single row closes — green whether
# or not the table is complete. Only `[rule.guard.all.*]` and
# `[rule.guard.unless.*]` participate.
#
# EVERY DIMENSION IS `required` AND `single_valued`. An optional tag
# withholds the coverage claim at lint (`graph-unprovable-coverage`,
# reason `row-can-refuse`) AND refuses at resolve
# (`flow-guard-unevaluable`), so a dimension that is merely sometimes
# supplied cannot be routed on at all. Where the underlying field is
# genuinely sometimes absent — a record with no Profile — the FACT TABLE
# declares the sentinel and `--tags` always renders the key; here that
# sentinel is an ordinary declared member whose cell a row claims. See
# `[fact.cluster]`'s `absent` note in rdr-facts.toml.
#
# FIVE OUTCOMES, BECAUSE THE PRODUCT BOUND IS PER GROUP. Dimensions
# accumulate over a whole group and the bound is 2048 assignments;
# `status × profile × ca` alone is 180, leaving room for three booleans
# against the five lens flags and their completion probes. Splitting the
# question splits the product: `locate` ranges over the coarse-position
# dimensions, `lens` over the lens-row ones, and neither pays for the
# other's. It also matches how the flow asks: prelock/resolve/reconcile
# close-out needs only `lens`. `locate` is AT the bound (1152 × any new
# dimension overflows), so a re-entry's target stage is `reentry`, a
# group `locate` chains to with `resolve:reentry` as it chains to `lens`.
#
# THE ANSWER IS `emit`. Values are uninterpreted strings compared by
# bytes — there is no interpolation, so `NNNN` is never spelled here. A
# row emits the stage verb (and the lens, where the row names one) and
# the caller appends the record number it already holds.
#
#   next     the command, or `none`, or a `stopped:` token
#   why      one line the skill can print as the reason
#   surface  what the skill must show verbatim beside the answer (a
#            qualifier, a home, a caveat) — absent when there is none
#   next_arg what `next` takes, when it is NOT this record's number.
#            Absent on every per-RDR route, which is all but one: the
#            caller appends `NNNN` and that is right for them. `cluster`
#            marks Stage 7.1, whose argument is a SET — see the row.
#
# `next` is never a guess. Where the flow's own answer is a judgement a
# fact cannot make, the row emits a `stopped:` token naming what is
# missing, exactly as §stop-packet requires — a skipped check must never
# read as a passed one.

outcomes = ["locate", "reentry", "lens", "critique", "repeatability", "floor", "determinacy", "after-lock"]

[model]
id          = "rdr-status"
version     = 1
class       = "decision-table"
description = "RDR navigator: the record's facts to the next command."

[model.metadata]
owner  = "rdr"
source = "skills/rdr-status/SKILL.md"
facts  = "models/rdr-facts.toml"

# ---------------------------------------------------------------------
# THE EMIT VOCABULARY IS DECLARED (intrastate RDR 0024). With these
# declarations present, lint refuses a rule emitting a key not declared
# here or a `next` outside its domain — so a typo'd key or a misspelt
# stop token is a load failure, not a value a skill reads as a stage.
# The dispositions are the caller's contract: `route` is a command the
# caller appends the record number to, `chain` is the model's own
# instruction to resolve a second outcome, `none` is "nothing to run",
# and `stop` is a §stop-packet token naming what is missing. The
# resolver surfaces the disposition of the selected row's `next` in the
# payload's `dispositions`, so a caller branches on a proven token
# rather than on a string prefix.
[emit.next]
kind = "enum"
[emit.next.domain]
route = ["/rdr-cluster-reconcile", "/rdr-draft-to-lock", "/rdr-finalize", "/rdr-implement", "/rdr-prelock 3amigo", "/rdr-prelock cove", "/rdr-prelock critique", "/rdr-prelock grounding", "/rdr-prelock repeatability", "/rdr-prelock repeatability diff", "/rdr-propose", "/rdr-reconcile", "/rdr-refine", "/rdr-resolve"]
chain = ["resolve:lens", "resolve:reentry", "resolve:determinacy"]
none  = ["none"]
stop  = ["stopped:assumption-list-unreadable", "stopped:check-the-joint-decision-home", "stopped:deferred-without-condition", "stopped:determinacy-trigger-unjudged", "stopped:no-profile", "stopped:profile-below-floor", "stopped:repeatability-variant-unstamped", "stopped:seam-lineage-count-unread"]

# The outcome to run once the stage `next` names has re-run. On a
# re-entered Draft the lens row's stale rows say what Stage 5 still owes,
# and without this chain the documented call path never reached them.
[emit.then]
kind   = "enum"
domain = ["resolve:lens"]

# The `lens` group's second answer: the row STILL OWED, headed by
# `emit.next`, in order — or `none` when the row is complete (or empty at
# `small`). draft-to-lock writes its `lenses:` line from `row` as handed,
# so no stage walks the row forward from one lens.
# Values are comma-joined with no spaces — one shell word; lint refuses
# a value with a space (`emit_value_out_of_domain`), so that spelling is
# the only one.
[emit.row]
kind   = "enum"
domain = ["none", "grounding,3amigo", "3amigo", "grounding,3amigo,critique", "3amigo,critique", "critique", "cove,3amigo,critique,repeatability", "3amigo,critique,repeatability", "critique,repeatability", "repeatability"]

[emit.why]
kind = "scalar"

[emit.surface]
kind = "scalar"

[emit.next_arg]
kind   = "enum"
domain = ["cluster", "sibling"]

# The `floor` group's answer: `raise` (Profile sits one tier above its
# contract axis) or `none`.
[emit.floor]
kind   = "enum"
domain = ["raise", "none"]

# --- the recognized outcome ------------------------------------------------
#
# `locate` asks the coarse-position question (§How it decides next step
# 1); `lens` asks §lens-row's (steps 2-3). Rescue is scoped per outcome,
# so each group closes its own remainder.

[tags.recognized]
provenance    = "recognized"
kind          = "enum"
domain        = ["locate", "reentry", "lens", "critique", "repeatability", "floor", "determinacy", "after-lock"]
single_valued = true
required      = true

# ===========================================================================
# Dimensions
# ===========================================================================

# The lifecycle Status, bare. The full domain is carried so a value the
# corpus can write is never off-domain — `unless` rows below fold the
# terminal spellings together rather than dropping them.
[tags.status]
provenance    = "observed"
kind          = "enum"
domain        = ["Draft", "Final", "Implemented", "Deferred", "Demoted", "Abandoned", "Superseded", "Reverted", "Rejected"]
single_valued = true
required      = true

# The qualifier grammar, carried verbatim from model.QualifierForm. The
# routing reads the FORM, never the qualifier prose: `revised-from` is a
# scoped re-entry, `joint-decision` is a Final owing a home check,
# `revisit-when` is a park.
[tags.status_form]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "demoted-target", "revised-from", "routed-back", "joint-decision", "revisit-when", "bracketed", "dash", "parenthetical"]
single_valued = true
required      = true

# The `@<stage>` a re-entry qualifier names. `none` is the ABSENT
# SENTINEL — a qualifier with no target, which every record written
# before the slot existed carries — and its cell is the resolve fallback.
# Read under EITHER re-entry form: `revised-from` (7.1's Final→Draft
# demotion) and `routed-back` (a mid-flow stage sending a Draft
# backward) write the same slot, so both route through one group.
# `prelock` and `reconcile` are reachable from `routed-back` only: a
# Final has closed Stages 5 and 6, so a demotion can never name them.
[tags.reentry_target]
provenance    = "observed"
kind          = "enum"
domain     = ["propose", "refine", "resolve", "prelock", "reconcile", "finalize", "none"]
single_valued = true
required      = true

# The Critical Assumption list rolled up to the shape Stage 3/4 read.
# `unknown-plan` is an unreadable list, never an empty one — it routes to
# a stop, not to a stage.
[tags.ca]
provenance    = "observed"
kind          = "enum"
domain        = ["all-pending", "mixed", "all-terminal", "unknown-plan"]
single_valued = true
required      = true

# Stage 7.1's fact. False on a clustered Final means no run has written a
# directory covering this record, which routes to /rdr-cluster-reconcile
# BEFORE /rdr-implement. The pre-2026-06-29 topical epoch is out of scope
# and reads false; every record it covers is terminal.
[tags.cluster_reconciled]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# WHETHER the record is clustered, which gates the fact above. Stage 7.1
# applies "only when the RDR is in a cluster", so an UNCLUSTERED Final
# reads `cluster_reconciled=false` — no run covers it, correctly — and
# must still go straight to implement. Reading the reconciled flag alone
# would route every solo Final to /rdr-cluster-reconcile, which is a
# stage that has nothing to reconcile.
#
# The set-valued `cluster` cannot serve here: a set's domain is a power
# set, not a partition, so it can carry no dimension. This is the same
# question reduced to the one a table can prove.
[tags.clustered]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# The `after-lock` group's two dimensions, both ON DEMAND — the caller
# filters both by name. `related_final_unimplemented` is Finalize's
# "reconcile before implement" question; `cluster_members_in_flight` is
# the other half, caught BEFORE that pass: a Draft sibling still in
# flight.
[tags.related_final_unimplemented]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+"]
single_valued = true
required      = true

[tags.cluster_members_in_flight]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1+"]
single_valued = true
required      = true

# The routing latch. `none` is the ABSENT SENTINEL — a record with no
# Profile field — and §lens-row is explicit that this is a stop-packet
# rather than a default, which is what the `no-profile` rows below do.
[tags.profile]
provenance    = "observed"
kind          = "enum"
domain        = ["small", "mid", "large", "foundational", "none"]
single_valued = true
required      = true

# The accretion floor's two inputs, read only by the `floor` group. The
# bucket is the count the Seam Lineage field carries, folded to the three
# values the floor tells apart, plus `unread` (a written count in no form
# the projector reads — a stop, never a zero) and `none`, the ABSENT
# SENTINEL for a record with no field. The disposition is whether the
# escape line is written; its sentinel is `false`, and no row reads it
# under `seam_lineage = none`.
[tags.seam_lineage]
provenance    = "observed"
kind          = "enum"
domain        = ["0", "1", "2+", "unread", "none"]
single_valued = true
required      = true

[tags.accretion_disposition]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# --- the lens flags --------------------------------------------------------
#
# A lens FOLDER says the lens ran; the completion probes say it finished.
# The two are separate facts on purpose (§lens-row: a bare folder is not
# completion), and the rows below take the folder as the "ran" signal and
# defer completion to the per-lens rows.

[tags.lens_grounding]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_3amigo]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_critique]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_cove]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_repeatability]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# Stage 7's folder. Its existence also certifies the last lens's
# resolution, which is why the lens group reads it as the row-complete
# signal rather than probing every lens's findings file.
[tags.reconcile]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# The first row lens whose evidence predates a re-entry's demote date.
# `none` is both "fresh" and the absent sentinel, so a Final or a
# first-pass Draft always lands in the cells the existing rows claim.
# The stale rows below fire on a profile's OWN row lenses only; an
# off-row lens answering here (a `mid` record with old `cove/`) is not
# owed and changes nothing, which is why every row of a profile carries
# `unless lens_stale in <its row>` rather than `eq none`.
[tags.lens_stale]
provenance    = "observed"
kind          = "enum"
domain        = ["none", "cove", "grounding", "3amigo", "critique", "repeatability"]
single_valued = true
required      = true

# --- the completion dimensions --------------------------------------------
#
# These answer whether a lens that RAN is FINISHED. The `lens` group
# deliberately does not read them (its own comment says completion is
# per-lens and defers it), and they are guarded only by the `critique`
# and `repeatability` groups below.

# Whether critique's two passes were written by DIFFERENT base models.
# `same` is the sanctioned single-model fallback, not a defect; `unknown`
# is a pass with no stamp, which §model-stamp says never to read as a
# match; `absent` is no second pass at all.
[tags.critique_models]
provenance    = "observed"
kind          = "enum"
domain        = ["differ", "same", "unknown", "absent"]
single_valued = true
required      = true

[tags.lens_critique_modelb]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_critique_diff]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# The variant run-1's own header declares. `none` is the absent sentinel
# — no run-1, or a run-1 predating the header.
[tags.repeatability_variant]
provenance    = "observed"
kind          = "enum"
domain        = ["lite", "full", "none"]
single_valued = true
required      = true

[tags.lens_repeatability_run1]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_repeatability_run2]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_repeatability_run3]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

[tags.lens_repeatability_diff]
provenance    = "observed"
kind          = "bool"
single_valued = true
required      = true

# The Stage-5 Determinacy judgement, as the `Determinacy:` line in
# Normative Contracts reads it. `unjudged` is the ABSENT SENTINEL — no
# line written yet — and the `determinacy` group stops on it by name.
[tags.determinacy]
provenance    = "observed"
kind          = "enum"
domain        = ["fired", "na", "unjudged"]
single_valued = true
required      = true

# --- NOT declared, and that is deliberate ----------------------------------
#
# Six set-valued facts ride the vector this table resolves against
# (`cluster`, `open_joint_decisions`, the three gate id-lists,
# `spikes_unrun`) and no row guards any of them, so they contribute no
# dimension. Each was once declared anyway, purely so the call would not
# refuse: the skill passes the whole `rdr status --tags NNNN` output in
# one substitution, a set arrives as a JSON array literal, and an
# undeclared key used to be validated against the zero declaration —
# whose kind is not `set` — so the array was refused as "not set-valued"
# and the whole call exited 2.
#
# intrastate RDR 0020 admits an undeclared key as a pure carrier, so the
# declarations are gone. The win is forward: a set-valued fact added to
# `rdr-facts.toml` tomorrow rides this call with no edit here, where
# before it would have refused every record in the corpus until someone
# declared it.

# ===========================================================================
# `locate` — the coarse position (§How it decides next, step 1)
# ===========================================================================
#
# Dimensions: status × status_form × ca × cluster_reconciled.
# Rows are ordered as the skill's prose orders them, and every row's
# comment cites the clause it encodes.

# --- terminal and parked ---------------------------------------------------

# `Demoted` → the RDR exited at Seed; next is none (refiled as an issue).
# It is matched before the other terminals because its reason differs:
# nothing was decided, so no post-mortem is owed either.
[[rule]]
id = "locate-demoted"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Demoted"
[rule.emit]
next    = "none"
why     = "Demoted — the RDR exited at Seed and was refiled as an issue."
surface = "no post-mortem is owed"

# `Implemented` / `Reverted` / `Abandoned` / `Superseded` / `Rejected` →
# terminal; report the post-mortem state, no next command. `Rejected` is
# in the fact's domain and belongs here: a decision that was declined is
# as closed as one that was reverted.
[[rule]]
id = "locate-terminal"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
in = ["Implemented", "Reverted", "Abandoned", "Superseded", "Rejected"]
[rule.emit]
next    = "none"
why     = "Terminal — report the disposition and the post-mortem state."
surface = "the disposition, verbatim"

# `Deferred [revisit when <condition>]` → PARKED, not terminal. No
# post-mortem is owed and no next command is due while the condition
# holds, so the condition itself must be surfaced verbatim: a trigger
# nobody re-reads is how a park becomes an abandon by default. Whether it
# has fired is the human's call, which is why this stops rather than
# naming a stage.
[[rule]]
id = "locate-parked"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Deferred"
[rule.guard.all.status_form]
eq = "revisit-when"
[rule.emit]
next    = "none"
why     = "Parked, not terminal — no next command while the revisit condition holds."
surface = "the revisit condition, verbatim, for the human to judge"

# A `Deferred` carrying no revisit condition is a park with no trigger.
# The flow has no rule for it and inventing one would be the guess this
# table exists to refuse, so it stops and names what is missing.
[[rule]]
id = "locate-deferred-no-condition"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Deferred"
[rule.guard.unless.status_form]
eq = "revisit-when"
[rule.emit]
next    = "stopped:deferred-without-condition"
why     = "Deferred with no revisit condition — a park with no trigger to re-read."
surface = "the Status line, verbatim"

# --- Final ----------------------------------------------------------------
#
# Three rows partition `cluster_reconciled` against the joint-decision
# form, so the group's coverage is proved rather than defaulted.

# A `Final [joint decision → <home §-anchor>: <question>]` is still
# `Final` for routing, but the home must be checked FIRST: if the home has
# ANSWERED the question, the scoped answer-vs-fences check (Stage 7.1) is
# owed before implement. Whether the home has answered is not a fact this
# table can read — it is another record's content — so this row stops and
# names the check rather than routing past it.
[[rule]]
id = "locate-final-joint-decision"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Final"
[rule.guard.all.status_form]
eq = "joint-decision"
[rule.emit]
next    = "stopped:check-the-joint-decision-home"
why     = "Final, but a joint decision is open — check the home before implement; if it has answered, the scoped answer-vs-fences check (7.1) is owed first."
surface = "the home anchor AND the open question, so the human sees what is unanswered"

# A CLUSTERED `Final` whose cluster has not been reconciled →
# /rdr-cluster-reconcile first. `cluster_reconciled` is false when no 7.1
# run wrote a directory covering this record; the directory's key IS its
# membership, so this is read from the tree rather than predicted.
#
# THE ONE ROW CARRYING `next_arg`, because it is the one route whose
# argument is not this record. 7.1 runs per CLUSTER — its own skill
# refuses a single RDR — so the caller's blanket "append NNNN" produces a
# command that is not merely malformed but inverted: handed one record the
# stage answers "no cluster, go implement", and a run that proceeded would
# key its directory `NNNN`, marking one record reconciled while its peers
# went unchecked. The set to name is `cluster_key` when a prior run
# resolved one, and otherwise nothing — the declared field is a claim, and
# resolving it is 7.1 step 1's judgement, not a routing table's.
[[rule]]
id = "locate-final-cluster-unreconciled"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Final"
[rule.guard.unless.status_form]
eq = "joint-decision"
[rule.guard.all.clustered]
eq = "true"
[rule.guard.all.cluster_reconciled]
eq = "false"
[rule.emit]
next     = "/rdr-cluster-reconcile"
next_arg = "cluster"
why      = "Final and clustered, and no Stage 7.1 run has reconciled a cluster containing this record."
surface  = "the declared Cluster members, as a Propose-time claim and not the membership — Stage 7.1 resolves the set"

# `Final` and reconciled → `/rdr-implement`. `true` means 7.1 already ran
# over a set containing this RDR.
[[rule]]
id = "locate-final-implement"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Final"
[rule.guard.unless.status_form]
eq = "joint-decision"
[rule.guard.all.cluster_reconciled]
eq = "true"
[rule.emit]
next = "/rdr-implement"
why  = "Final and its cluster is reconciled — implement is the next stage."

# An UNCLUSTERED `Final` → `/rdr-implement`. Stage 7.1 applies only when
# the RDR is in a cluster, so `cluster_reconciled=false` here means
# "nothing to reconcile", not "a reconcile is owed". Reading the flag
# without this guard sent every solo Final to a stage with no cluster to
# work on — a real defect this table's cross-check caught.
[[rule]]
id = "locate-final-solo"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Final"
[rule.guard.unless.status_form]
eq = "joint-decision"
[rule.guard.all.clustered]
eq = "false"
[rule.guard.all.cluster_reconciled]
eq = "false"
[rule.emit]
next = "/rdr-implement"
why  = "Final and not clustered — Stage 7.1 does not apply, so implement is the next stage."

# --- Draft ----------------------------------------------------------------

# A re-entry is a scoped BACKWARD EDGE to the stage the qualifier names,
# and TWO grammars write one: `revised from Final <date>; … @<stage>`
# (7.1's Final→Draft demotion) and `routed back from <origin> <date>; …
# @<stage>` (a mid-flow stage sending a Draft backward). They differ in
# where the record came FROM; they agree on what this row needs — a Draft
# owing work to a named earlier stage — so both match here.
#
# It is still a Draft for every binary gate, so this row must be
# matched before the front-half rows that read the CA rollup — the
# evidence would otherwise suggest a stage this record is not at. That is
# the whole defect the routed-back form exists to fix: a routed-back
# Draft's evidence reads FORWARD (Resolve's verdicts are written and
# true), so without the qualifier this group lands it at the stage it
# already passed. WHICH stage is the `reentry` group's question (below):
# `locate` is at the product bound, so the target dimension gets its own
# outcome, chained exactly as `resolve:lens` is.
[[rule]]
id = "locate-draft-reentry"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.all.status_form]
in = ["revised-from", "routed-back"]
[rule.emit]
next = "resolve:reentry"
why  = "A scoped re-entry — demoted from Final, or routed back mid-flow — so ask the reentry group which stage the qualifier's @<stage> names."

# bare `Draft`, CAs all Pending → the tally certifies no refine pass.
# Refine is the front half's only `~`, and an open `~` IS the next
# command, not a footnote to step past: /rdr-refine, THEN /rdr-resolve.
#
# It does NOT say refine is un-run, and the distinction is the whole
# reason this row is worded as it is. Stage 3 writes no artifact and
# moves no fact — `stages/03-refine.md` *Produces* is "edits to the RDR
# draft" — so a clean refine leaves this guard exactly as true as it
# was, and THIS ANSWER REPEATS. The tally supports "every CA is
# Pending"; it never supported "Refine is un-run", which is an inference
# the evidence cannot carry. Same refusal as `fact.spikes` ("Absence
# does not mean Resolve is un-run") and the `locate-draft-resolve`
# comment below ("an absent evidence folder proves nothing"): no
# evidence is not proof it did not happen.
#
# Asserting it cost a real run. A delegated cascade read "Refine is
# un-run" against a refine it had just passed, took the two for a
# contradiction, and parked at the head of its own flow rather than
# advance on its own authority. Leaving refine is the caller's call, not
# this row's: `skills/rdr-draft-to-lock/SKILL.md` (Re-entry) owns the
# one bounded carve-out, and a fact must not make it — refine's gates
# are prose, which is why `3 Refine` renders `~` in every branch and
# never `✓` (`tools/rdr/checklist.go`).
[[rule]]
id = "locate-draft-refine"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.unless.status_form]
in = ["revised-from", "routed-back"]
[rule.guard.all.ca]
eq = "all-pending"
[rule.emit]
next = "/rdr-refine"
why  = "Every Critical Assumption is Pending — the tally certifies no refine pass, and the open ~ is the next command; a clean refine moves no fact here, so this answer repeats."

# bare `Draft`, CAs mixed → Resolve is still open. Some assumptions are
# terminal and some are not, so the verdicts are the authority and an
# absent evidence folder proves nothing: a pure source-search resolve
# writes its verdicts inline and creates no folder at all.
[[rule]]
id = "locate-draft-resolve"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.unless.status_form]
in = ["revised-from", "routed-back"]
[rule.guard.all.ca]
eq = "mixed"
[rule.emit]
next = "/rdr-resolve"
why  = "Some assumptions are still open — Resolve is the stage, whether or not an evidence folder exists."

# bare `Draft`, CAs all terminal → Resolve is BEHIND this record, so the
# next question is the lens row's. Never recommend re-running a stage
# whose done-signal is already satisfied. The answer is not a command
# here: it is a second call, `--outcome lens`, which is the only place
# §lens-row is encoded.
[[rule]]
id = "locate-draft-prelock"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.unless.status_form]
in = ["revised-from", "routed-back"]
[rule.guard.all.ca]
eq = "all-terminal"
[rule.emit]
next = "resolve:lens"
why  = "Assumptions are all terminal — Resolve is behind you; ask the lens row for the next Pre-Lock step."

# bare `Draft` whose CA list cannot be read — placeholders, an
# off-vocabulary status, or no assumptions at all. An unreadable list is
# NOT an empty one, and the tallies certify no stage, so this stops
# rather than guessing a front-half position.
#
# The STOP NAMES THE FACT THAT ALREADY LOCATED THE PROBLEM. `--tags`
# carries `ca_off_vocabulary_ids` in every vector, so the offending
# assumptions are in the caller's hand before the resolve runs; the old
# surface sent the reader to the section to find by eye what the
# projector had already found. Emits are uninterpreted bytes (no
# interpolation, above), so the row names the KEY and the caller reads
# the value it holds.
#
# It also says the off-vocabulary case is a TYPO, because the cheap wrong
# fix is to widen the vocabulary. `models/rdr-template.toml`'s observed
# tier is legitimate practice the template never spelled — earned by
# recurrence — and it refuses a "tolerated but wrong" third tier by name.
# Six corpus records carry an off-vocabulary assumption status and each
# is a different one-off (Partial, Decided, Split, FALSIFIED): there is
# no missing word to add, only a spelling to correct on the record.
[[rule]]
id = "locate-draft-unknown-plan"
[rule.match.recognized]
eq = "locate"
[rule.guard.all.status]
eq = "Draft"
[rule.guard.unless.status_form]
in = ["revised-from", "routed-back"]
[rule.guard.all.ca]
eq = "unknown-plan"
[rule.emit]
next    = "stopped:assumption-list-unreadable"
why     = "The Critical Assumption list is unfilled or off-vocabulary — it certifies no stage, and an unreadable list is not an empty one."
surface = "`ca_off_vocabulary_ids` (the offending assumptions, already in the tag vector) and `ca_placeholder`: an off-vocabulary status is a TYPO to correct on the record — the terminal verdicts are Refuted | Resolved | Accepted | Downgraded, and a synonym of one of those (FALSIFIED, Partial, Split, Decided) is spelled, not adopted; a placeholder means the list is still the template legend"

# NO ESCAPE ROW HERE, AND THAT IS THE POINT. The rows above claim every
# cell of `status × status_form × ca × cluster_reconciled` positively, so
# lint PROVES this group rather than accepting a default. An "otherwise"
# row would close the same coverage while earning
# `graph-coverage-closed-by-escape` — the advisory that exists precisely
# to say a table leaned on its default instead of enumerating. Adding one
# was tried and it rescued nothing: every cell it claimed was already
# claimed, so it was unreachable as well as unproved.
#
# The consequence to keep in mind when editing: NARROWING a row here can
# open a real coverage gap, and lint will say so at exit 2. That is the
# guarantee, not an obstacle.

# ===========================================================================
# `reentry` — which stage a scoped re-entry lands at
# ===========================================================================
#
# Dimension: reentry_target alone. Reached only through
# `locate-draft-reentry`'s `resolve:reentry`, so status and form are
# already settled; guarding them here would re-import `locate`'s product.
#
# One row per target, because an INFERRED row is how a stage gets skipped:
# the 7.1 gate's target was prose-only, every re-entry routed to
# /rdr-resolve, and a resolve pass that could not close a contract edit
# was a full pass spent learning it was refine's.

[[rule]]
id = "reentry-propose"
[rule.match.recognized]
eq = "reentry"
[rule.guard.all.reentry_target]
eq = "propose"
[rule.emit]
next    = "/rdr-propose"
then    = "resolve:lens"
why     = "The qualifier names @propose — the approach is reopened, so Stage 2 re-walks it."
surface = "the qualifier, so the human knows the run is a delta"

[[rule]]
id = "reentry-refine"
[rule.match.recognized]
eq = "reentry"
[rule.guard.all.reentry_target]
eq = "refine"
[rule.emit]
next    = "/rdr-refine"
then    = "resolve:lens"
why     = "The qualifier names @refine — the fix is a design-body edit, so Stage 3 lands it before any re-verify."
surface = "the qualifier, so the human knows the run is a delta"

[[rule]]
id = "reentry-resolve"
[rule.match.recognized]
eq = "reentry"
[rule.guard.all.reentry_target]
eq = "resolve"
[rule.emit]
next    = "/rdr-resolve"
then    = "resolve:lens"
why     = "The qualifier names @resolve — /rdr-resolve self-scopes to the listed IDs."
surface = "the qualifier, so the human knows the run is a delta"

# `prelock` and `reconcile` are reachable from a `routed-back` qualifier
# only. A demotion cannot name them — a Final has closed both stages, so
# the 7.1 gate reclasses such a blocker rather than naming a stage its
# grammar has no token for. A mid-flow route-back has no such problem:
# Stage 7 sends a fired-but-unrun determinacy check back to the lens, and
# an open spike back to the stage that closes it.
[[rule]]
id = "reentry-prelock"
[rule.match.recognized]
eq = "reentry"
[rule.guard.all.reentry_target]
eq = "prelock"
[rule.emit]
next    = "/rdr-prelock repeatability"
then    = "resolve:lens"
why     = "The qualifier names @prelock — a fired `Determinacy:` line with no run-1/diff, which repeatability-lite owns."
surface = "the qualifier, so the human knows the run is a delta"

[[rule]]
id = "reentry-reconcile"
[rule.match.recognized]
eq = "reentry"
[rule.guard.all.reentry_target]
eq = "reconcile"
[rule.emit]
next    = "/rdr-reconcile"
then    = "resolve:lens"
why     = "The qualifier names @reconcile — an open spike or a round-disturbed assumption, which Stage 6 closes."
surface = "the qualifier, so the human knows the run is a delta"

[[rule]]
id = "reentry-finalize"
[rule.match.recognized]
eq = "reentry"
[rule.guard.all.reentry_target]
eq = "finalize"
[rule.emit]
next    = "/rdr-finalize"
why     = "The target is @finalize — a RE-LOCK-ONLY re-entry: the note's listed wording/citation defects are applied in the lock pass, then the record re-locks."
surface = "the qualifier and the note's defect list, so the human knows the run is a fix-and-lock"

# Neither the qualifier nor the note's TARGET RE-ENTRY STAGE line names a
# target the projector can read. The answer is the resolve default WITH
# the instruction to read the note first — a fallback the human can see
# is one, never a silent guess.
[[rule]]
id = "reentry-untargeted"
[rule.match.recognized]
eq = "reentry"
[rule.guard.all.reentry_target]
eq = "none"
[rule.emit]
next    = "/rdr-resolve"
why     = "The qualifier names no @<stage> — /rdr-resolve is the default, not the recorded target."
surface = "the qualifier, and the TARGET RE-ENTRY STAGE line of the record's `## Refinement Context` note: if it names Stage 2, 3 or a fix-and-lock, run /rdr-propose, /rdr-refine or /rdr-finalize instead"

# ===========================================================================
# `floor` — the accretion floor on Profile (TEMPLATE.md, Seam Lineage)
# ===========================================================================
#
# Dimensions: profile × seam_lineage × accretion_disposition = 5 × 5 × 2 = 50.
#
# Profile is sized by blast radius, and a seam that already carries two or
# more prior point-fixes is the matrix's cross-RDR trigger whatever the
# contract axis says: the floor is `raise` — Profile sits one tier above
# its contract axis, and rdr-write.toml's `profile` rows apply the raise
# where the two dispositions live — and the only escape is the written
# `Accretion disposition:` line in the same field. That rule was prose at
# nine sites and a count a reader re-derived at Seed, Propose, Resolve and
# Pre-Lock — three chained exact steps, four times per record. It is this
# group now, and the sites cite it.
#
# THIS GROUP IS ITS OWN OUTCOME, NOT TWO DIMENSIONS ON `lens`: the lens
# product is 960 and the bound is 2048 per group, so folding the bucket
# and the disposition in would take it to 9,600. Split, the floor is 50
# cells and `lens` is untouched — which also matches how the flow asks:
# a stage writing Profile asks "what must it be", and reads `floor`.
#
# THE ANSWER IS `floor`: the value Profile must carry (`foundational`),
# or `none` when no floor applies. `next` is `none` when the field agrees
# with the floor and a `stopped:` token when it does not — the field is
# a recorded latch (stages/README.md), and a latch below its floor is
# surfaced, never silently routed around. The caller applies `floor` as
# a value; writing the field is the stage's edit, as today.

# --- no field, or a count the grammar does not read -------------------------
#
# A record older than the field has no floor recorded, which is a
# caveat and not a stop: nothing was skipped, the field did not exist.
# A field that IS written, in a form the projector cannot read, is
# different — a count was recorded and cannot be resolved off, so the
# row stops and names the fix rather than guessing the number.
[[rule]]
id = "floor-no-field"
[rule.match.recognized]
eq = "floor"
[rule.guard.all.seam_lineage]
eq = "none"
[rule.emit]
floor   = "none"
next    = "none"
why     = "No Seam Lineage field — the record predates it, so no floor was recorded."
surface = "that the accretion floor was not read: the record carries no Seam Lineage field"

[[rule]]
id = "floor-count-unread"
[rule.match.recognized]
eq = "floor"
[rule.guard.all.seam_lineage]
eq = "unread"
[rule.emit]
floor   = "none"
next    = "stopped:seam-lineage-count-unread"
why     = "Seam Lineage is written but spells no count the projector reads."
surface = "the Seam Lineage field: write its count as `Nth point-fix` (or `no prior accretion`), then re-run this call"

# --- fewer than two ---------------------------------------------------------
[[rule]]
id = "floor-below-two"
[rule.match.recognized]
eq = "floor"
[rule.guard.all.seam_lineage]
in = ["0", "1"]
[rule.emit]
floor = "none"
next  = "none"
why   = "Fewer than two prior point-fixes at the locus — the floor does not apply."

# --- two or more, escaped ---------------------------------------------------
#
# The disposition is the author's reviewable reason the fixes are not one
# missing decision. It is co-located with the count on purpose, and the
# row surfaces it so the reader sees the escape beside its evidence.
[[rule]]
id = "floor-escaped"
[rule.match.recognized]
eq = "floor"
[rule.guard.all.seam_lineage]
eq = "2+"
[rule.guard.all.accretion_disposition]
eq = "true"
[rule.emit]
floor   = "none"
next    = "none"
why     = "Two or more prior point-fixes, escaped by the written accretion disposition."
surface = "the Accretion disposition line, verbatim"

# --- two or more, no escape: the floor holds --------------------------------
[[rule]]
id = "floor-holds"
[rule.match.recognized]
eq = "floor"
[rule.guard.all.seam_lineage]
eq = "2+"
[rule.guard.all.accretion_disposition]
eq = "false"
[rule.guard.all.profile]
in = ["mid", "large", "foundational"]
[rule.emit]
floor = "raise"
next  = "none"
why   = "Two or more prior point-fixes and no disposition raise Profile one tier above its contract axis; the field is at a raised tier, and rdr-write's profile rows verify which."

# A `none` or `small` Profile is below every raised tier too: the field
# is absent or unlifted, and the floor says a raise applies, which is
# more than the `lens` group's no-profile stop can say.
[[rule]]
id = "floor-below"
[rule.match.recognized]
eq = "floor"
[rule.guard.all.seam_lineage]
eq = "2+"
[rule.guard.all.accretion_disposition]
eq = "false"
[rule.guard.all.profile]
in = ["small", "none"]
[rule.emit]
floor   = "raise"
next    = "stopped:profile-below-floor"
why     = "Two or more prior point-fixes and no disposition raise Profile one tier; the field reads below every raised tier."
surface = "re-run rdr-write `--outcome profile` with `floor=raise` (Stage 4 owns the write)"

# ===========================================================================
# `lens` — the Stage-5 lens row (rdr-common.md §lens-row)
# ===========================================================================
#
# Dimensions: profile × the five lens flags × lens_stale.
#
# §lens-row is the one authority for the row, the first-lens fork and the
# completion rules, and this group is that table:
#
#   small         (none — skip Stage 5)     -> /rdr-reconcile
#   mid           grounding -> 3amigo
#   large         grounding -> 3amigo -> critique
#   foundational  cove -> 3amigo -> critique -> repeatability
#
# NEXT LENS = FIRST ROW ENTRY WITH NO EVIDENCE. Each profile's rows walk
# its own row in order, and `unless` on the earlier lenses is what makes
# each row claim exactly the cells where that lens is the first missing
# one. Off-row lenses are not dimensions of a profile's rows at all —
# `grounding` is not a member of the foundational row, so a complete
# `grounding/` subtracts nothing there.
#
# The rows below take the FOLDER as the "this lens ran" signal.
# Completion — repeatability's run/diff files, critique's dual-model diff
# on a foundational record — is a per-lens judgement the skill makes from
# the completion probes, which is why `/rdr-prelock NNNN <lens>` is also
# the answer for a lens that is present but unfinished: that one command
# runs the lens AND resolves its findings.

# --- no Profile ------------------------------------------------------------
#
# §lens-row: "No `Profile` entry = the field is absent: that is a
# §stop-packet, not a default." `none` is the fact table's absent
# sentinel, and this row is why it exists — the alternative was a
# dimension that sometimes went missing, which cannot be routed on at all.
[[rule]]
id = "lens-no-profile"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "none"
[rule.emit]
next    = "stopped:no-profile"
why     = "The Profile field is absent — §lens-row makes that a stop-packet, never a default."
surface = "that no Profile is written; infer the row only with the basis flagged"

# --- small: no Stage 5 -----------------------------------------------------
#
# The row is empty, so there is no lens to be first-missing and Stage 5 is
# skipped outright.
[[rule]]
id = "lens-small"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "small"
[rule.emit]
next = "/rdr-reconcile"
row = "none"
why  = "Profile small — §lens-row skips Stage 5 entirely."

# --- mid: grounding -> 3amigo ---------------------------------------------

[[rule]]
id = "lens-mid-grounding"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "mid"
[rule.guard.all.lens_grounding]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["grounding", "3amigo"]
[rule.emit]
next = "/rdr-prelock grounding"
row = "grounding,3amigo"
why  = "Profile mid — grounding is the first lens of the row and has not run."

[[rule]]
id = "lens-mid-3amigo"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "mid"
[rule.guard.all.lens_grounding]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["grounding", "3amigo"]
[rule.emit]
next = "/rdr-prelock 3amigo"
row = "3amigo"
why  = "Profile mid — grounding has run; 3amigo is the next row entry."

# The mid row is complete. A Determinacy-owed `repeatability` is an
# ADD-ON to this row, decided by the `determinacy` group over the
# `Determinacy:` line the Stage-5 judgement leaves in Normative
# Contracts; the surface points the caller at that outcome rather than
# silently choosing reconcile.
[[rule]]
id = "lens-mid-row-complete"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "mid"
[rule.guard.all.lens_grounding]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "true"
[rule.guard.unless.lens_stale]
in = ["grounding", "3amigo"]
[rule.emit]
next    = "/rdr-reconcile"
row    = "none"
why     = "Profile mid — the grounding -> 3amigo row is complete."
surface = "`--outcome repeatability` decides the Determinacy add-on from the `Determinacy:` line; ask it before accepting reconcile"

# --- large: grounding -> 3amigo -> critique -------------------------------

[[rule]]
id = "lens-large-grounding"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.lens_grounding]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["grounding", "3amigo", "critique"]
[rule.emit]
next = "/rdr-prelock grounding"
row = "grounding,3amigo,critique"
why  = "Profile large — grounding is the first lens of the row and has not run."

[[rule]]
id = "lens-large-3amigo"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.lens_grounding]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["grounding", "3amigo", "critique"]
[rule.emit]
next = "/rdr-prelock 3amigo"
row = "3amigo,critique"
why  = "Profile large — 3amigo is the next row entry."

[[rule]]
id = "lens-large-critique"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.lens_grounding]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "true"
[rule.guard.all.lens_critique]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["grounding", "3amigo", "critique"]
[rule.emit]
next = "/rdr-prelock critique"
row = "critique"
why  = "Profile large — critique is the last row entry and has not run."

[[rule]]
id = "lens-large-row-complete"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "large"
[rule.guard.all.lens_grounding]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "true"
[rule.guard.all.lens_critique]
eq = "true"
[rule.guard.unless.lens_stale]
in = ["grounding", "3amigo", "critique"]
[rule.emit]
next    = "/rdr-reconcile"
row    = "none"
why     = "Profile large — the grounding -> 3amigo -> critique row is complete."
surface = "`--outcome repeatability` decides the Determinacy add-on from the `Determinacy:` line; ask it before accepting reconcile"

# --- foundational: cove -> 3amigo -> critique -> repeatability ------------
#
# The row leads with COVE, never grounding: cove subsumes the grounding
# sweep as its Step 0. Subsumption runs one way — a standalone
# `grounding/` from a pre-escalation mid/large pass does not discharge
# cove's Step 0 — which is why `lens_grounding` is not a guard on any row
# here. Escalation is additive and the row never shrinks.
[[rule]]
id = "lens-foundational-cove"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_cove]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["cove", "3amigo", "critique", "repeatability"]
[rule.emit]
next = "/rdr-prelock cove"
row = "cove,3amigo,critique,repeatability"
why  = "Profile foundational — cove leads the row (it subsumes grounding's sweep as Step 0) and has not run."

[[rule]]
id = "lens-foundational-3amigo"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_cove]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["cove", "3amigo", "critique", "repeatability"]
[rule.emit]
next = "/rdr-prelock 3amigo"
row = "3amigo,critique,repeatability"
why  = "Profile foundational — 3amigo is the next row entry."

[[rule]]
id = "lens-foundational-critique"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_cove]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "true"
[rule.guard.all.lens_critique]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["cove", "3amigo", "critique", "repeatability"]
[rule.emit]
next    = "/rdr-prelock critique"
row    = "critique,repeatability"
why     = "Profile foundational — critique is the next row entry."
surface = "critique on a foundational RDR owes the DUAL-MODEL diff, not just critique.md"

[[rule]]
id = "lens-foundational-repeatability"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_cove]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "true"
[rule.guard.all.lens_critique]
eq = "true"
[rule.guard.all.lens_repeatability]
eq = "false"
[rule.guard.unless.lens_stale]
in = ["cove", "3amigo", "critique", "repeatability"]
[rule.emit]
next    = "/rdr-prelock repeatability"
row    = "repeatability"
why     = "Profile foundational — repeatability is the last row entry and has not run."
surface = "foundational takes the FULL variant: run-1/2/3 then diff"

[[rule]]
id = "lens-foundational-row-complete"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_cove]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "true"
[rule.guard.all.lens_critique]
eq = "true"
[rule.guard.all.lens_repeatability]
eq = "true"
[rule.guard.unless.lens_stale]
