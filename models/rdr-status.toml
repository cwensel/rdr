# --- foundational: cove -> 3amigo -> critique -> repeatability ------------
#
# The row leads with COVE, never grounding: cove subsumes the grounding
# sweep as its Step 0. Subsumption runs one way — a standalone
# `grounding/` from a pre-escalation mid/large pass does not discharge
# cove's Step 0 — which is why `lens_grounding` is not a guard on any row
# here. Escalation is additive and the row never shrinks.
[[rule]]
id = "lens-foundational-cove"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_cove]
eq = "false"
[rule.emit]
next = "/rdr-prelock cove"
why  = "Profile foundational — cove leads the row (it subsumes grounding's sweep as Step 0) and has not run."

[[rule]]
id = "lens-foundational-3amigo"
[rule.match.recognized]
eq = "lens"
[rule.guard.all.profile]
eq = "foundational"
[rule.guard.all.lens_cove]
eq = "true"
[rule.guard.all.lens_3amigo]
eq = "false"
[rule.emit]
next = "/rdr-prelock 3amigo"
why  = "Profile foundational — 3amigo is the next row entry."

